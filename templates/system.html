<!-- System Bet Calculator — React via CDN (aucune étape de build ici).
     ═══════════════════════════════════════════════════════════════════
     VERSIONS ÉPINGLÉES + SRI (C4, 2026-08-27).

     Ces quatre scripts s'exécutaient depuis des URL FLOTTANTES : `react@18`
     suivait tous les correctifs de la branche, et `cdn.tailwindcss.com` comme
     `@babel/standalone` n'avaient AUCUNE version. Le tiers décidait donc seul
     du code exécuté sur cette page, à chaque chargement.

     Ce n'est pas théorique : `@babel/standalone` sans version sert
     aujourd'hui la 8.0.4. La page a donc changé de MAJEURE de Babel sans
     qu'aucun commit ne le mentionne. Les empreintes ci-dessous figent
     exactement ce qui tournait au moment de l'épinglage — aucun changement de
     comportement, seulement la fin du changement silencieux.

     `integrity` fait vérifier au navigateur que l'octet reçu est celui qu'on
     attend ; `crossorigin="anonymous"` est OBLIGATOIRE avec lui sur une
     ressource tierce, sans quoi le navigateur ne peut pas lire la réponse
     pour la hacher. Un fichier altéré n'est pas exécuté : la page casse
     BRUYAMMENT au lieu d'exécuter autre chose en silence. C'est le compromis
     voulu — et il implique qu'une republication du même chemin par le CDN
     casse la page tant qu'on n'a pas recalculé l'empreinte.
     Empreintes calculées le 2026-08-27 :
       openssl dgst -sha384 -binary <fichier> | openssl base64 -A
-->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"
        integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"
        crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"
        integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"
        crossorigin="anonymous"></script>
<!-- ⚠️ TAILWIND EST SERVI DEPUIS CE DÉPÔT, ET C'EST MESURÉ, PAS UN CAPRICE.
     `cdn.tailwindcss.com` ne renvoie AUCUN en-tête
     `Access-Control-Allow-Origin`, y compris avec un `Origin` explicite
     (vérifié le 2026-08-27). Or `integrity` sur une ressource tierce exige
     `crossorigin`, lequel déclenche une requête CORS : y ajouter les deux
     aurait fait BLOQUER le script par le navigateur, donc cassé la page.
     unpkg, lui, renvoie `access-control-allow-origin: *` — d'où le SRI sur
     les trois autres.

     Épingler la version fermait le risque principal — la mise à jour
     silencieuse — mais pas « le CDN republie ce chemin ». Le fichier est donc
     hébergé avec le reste (`api/static/js/`, déjà servi) : 398 Ko versionnés,
     PLUS AUCUN TIERS n'exécute de code sur cette page, et le SRI devient sans
     objet puisque l'origine est la nôtre. Le bundle a été vérifié autonome
     (aucun appel réseau à l'exécution) et son empreinte est identique à celle
     du CDN — c'est le même octet, servi d'ailleurs.

     Pour revenir au CDN : remplacer par
       <script src="https://cdn.tailwindcss.com/3.4.17"></script>
     et supprimer `api/static/js/tailwind-3.4.17.min.js`. On y perd
     l'intégrité, on y gagne 398 Ko de dépôt. -->
<script src="/static/js/tailwind-3.4.17.min.js?v={{ version }}"></script>
<script>tailwind.config = { corePlugins: { preflight: false } };</script>
<script src="https://unpkg.com/@babel/standalone@8.0.4/babel.min.js"
        integrity="sha384-bdF7m0Y1IFKt9Q6xC8X9qkXn0OBriQWKyWwZKYsN05zF6P/g9OakjjL0G2Sd4pB4"
        crossorigin="anonymous"></script>
<script type="text/babel">
{% raw %}
const { useState, useMemo, useEffect } = React;

/* ---------------------------------------------------------------
   ICONS — inline SVG (lucide-react needs a bundler; this page has
   none, so these are hand-drawn equivalents at the same call sites)
--------------------------------------------------------------- */
function Icon({ size = 14, children }) {

    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
         strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{children}</svg>

}
const Plus        = ({ size }) => <Icon size={size}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Icon>;
const Trash2       = ({ size }) => <Icon size={size}><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></Icon>;

/* ---------------------------------------------------------------
   TOKENS — palette "carnet de paris quantitatif"
--------------------------------------------------------------- */
/* ---------------------------------------------------------------
   TOKENS — la charte de predator.css (variables CSS), pas une seconde
   palette : la page avait son propre fond, ses propres bordures et un or
   différent de celui des deux autres pages (harmonisation 2026-09-09).
--------------------------------------------------------------- */
const C = {
  bg: "var(--bg)",
  panel: "var(--bg1)",
  panel2: "var(--bg2)",
  border: "var(--bd2)",
  borderSoft: "var(--bd)",
  text: "var(--t1)",
  muted: "var(--t2)",
  faint: "var(--t2)",
  gold: "var(--gold)",
  goldSoft: "var(--gold-bd)",
  win: "var(--green)",
  loss: "var(--red)",
  voidC: "var(--t2)",
  partial: "var(--orange)",
  accent: "var(--purple)",
};

const SANS = "var(--font)";
const MONO = "var(--font-data)";

const FOLD_NAMES = { 1: "Simple", 2: "Double", 3: "Trio", 4: "Quadruple", 5: "Quintuple", 6: "Sextuple", 7: "Septuple", 8: "Octuple", 9: "Nonuple", 10: "Décuple" };
const foldName = (k) => FOLD_NAMES[k] || `${k}-fold`;

// Libellés courts (page sobre) ; le sens complet est en title= du sélecteur.
const STATUS_OPTS = [
  { v: "won", label: "Gagné" },
  { v: "lost", label: "Perdu" },
  { v: "void", label: "Nul" },
  { v: "won_void", label: "Gagné ½" },
  { v: "lost_void", label: "Perdu ½" },
];
const STATUS_TITLE = "Gagné · Perdu · Nul = remboursé (cote 1) · Gagné ½ / Perdu ½ = cote asiatique partielle (moitié gagnée ou perdue, moitié remboursée)";

const CURRENCIES = ["XOF", "CHF", "EUR", "USD"];
const NAMED_SYSTEMS = {
  "1-1": "Simple", "2-2": "Double", "3-3": "Trio (Treble)",
  "1-3": "Patent", "2-3": "Trixie",
  "1-4": "Lucky 15", "2-4": "Yankee",
  "1-5": "Lucky 31", "2-5": "Canadian / Super Yankee",
  "1-6": "Lucky 63", "2-6": "Heinz",
  "1-7": "Lucky 127", "2-7": "Super Heinz",
  "1-8": "Système complet (8)", "2-8": "Goliath",
};
// Format standard "Système M/N" (identique à betbuzz) : toutes les combinaisons
// de M à N sélections sont jouées d'un coup. Les noms commerciaux (Trixie,
// Yankee, Heinz...) ne sont que des alias de plages M-N précises.
function systemLabel(m, n) {
  const key = `${m}-${n}`;
  if (NAMED_SYSTEMS[key]) return NAMED_SYSTEMS[key];
  if (m === n) return "Accumulateur";
  return `Système personnalisé (${m} à ${n})`;
}
// Nombre de lignes d'un palier k sur n (C(n, k)) — pour dériver la mise par
// ligne d'une mise TOTALE sans énumérer les combinaisons.
function binom(n, k) {
  if (k < 0 || k > n) return 0;
  let r = 1;
  for (let i = 1; i <= k; i++) r = (r * (n - k + i)) / i;
  return Math.round(r);
}

/* ---------------------------------------------------------------
   MATH — combinatoire, gestion des nuls / cotes asiatiques
   (moteur inchangé — ne pas modifier ces fonctions)
--------------------------------------------------------------- */
function kCombinations(arr, k) {
  const out = [];
  const combo = [];
  (function bt(start) {
    if (combo.length === k) { out.push([...combo]); return; }
    for (let i = start; i < arr.length; i++) { combo.push(arr[i]); bt(i + 1); combo.pop(); }
  })(0);
  return out;
}

// Chaque statut se décompose en une liste de branches [poids, multiplicateur].
// C'est ce qui permet de traiter proprement les cotes asiatiques partielles
// (Gagné/Nul, Perdu/Nul) au lieu de les arrondir grossièrement.
function legBranches(sel) {
  const o = sel.odds;
  switch (sel.status) {
    case "won": return [[1, o]];
    case "lost": return [[1, 0]];
    case "void": return [[1, 1]];
    case "won_void": return [[0.5, o], [0.5, 1]];
    case "lost_void": return [[0.5, 0], [0.5, 1]];
    default: return [[1, 1]];
  }
}

// Facteur de retour attendu R d'une combinaison : produit croisé des branches
// de chaque sélection. R=0 -> perdue, R=1 -> remboursée, 0<R<1 -> perte partielle,
// R>1 -> gagnante. Un "Nul" a un multiplicateur de 1, ce qui réduit automatiquement
// la combinaison au palier inférieur sans fausser le calcul.
function comboReturnFactor(sels) {
  let acc = [[1, 1]];
  for (const sel of sels) {
    const branches = legBranches(sel);
    const next = [];
    for (const [aw, am] of acc) for (const [bw, bm] of branches) next.push([aw * bw, am * bm]);
    acc = next;
  }
  return acc.reduce((s, [w, m]) => s + w * m, 0);
}

function comboMaxFactor(sels) {
  return sels.reduce((p, sel) => {
    if (sel.status === "lost") return 0;
    if (sel.status === "won" || sel.status === "won_void") return p * sel.odds;
    return p;
  }, 1);
}

function bucketOf(R) {
  if (R === 0) return "loss";
  if (R === 1) return "void";
  if (R > 0 && R < 1) return "partial";
  return "win";
}
const bucketColor = { loss: C.loss, void: C.voidC, partial: C.partial, win: C.win };

/* ---------------------------------------------------------------
   SCÉNARIOS — dérivés du moteur (fonctions pures, sans UI)
   Ce que le calculateur ne disait pas : AVANT de miser, que rend le
   ticket si k sélections sur N sont gagnantes ? Ce sont des RETOURS
   CONDITIONNELS (« si k gagnent, alors… »), jamais des probabilités ni
   un taux de réussite (règle 7 de CLAUDE.md). Tout passe par
   kCombinations et comboReturnFactor du bloc MATH — le moteur reste
   inchangé.

   Le panneau « Scénarios » du système SEUL a été retiré le 2026-09-04 :
   `scenariosComplets` ci-dessous le couvre entièrement (mêmes k, mêmes
   pires/meilleurs cas) et en plus exactement, toutes sections confondues.
   Ses quatre fonctions (systemReturn, scenariosByWinners, breakEven,
   compoundMargin) sont parties avec lui plutôt que de rester en code mort.
--------------------------------------------------------------- */

// Retenue fiscale d'UN pari, modèle du dépôt (`core/constants.net_b`) :
// elle porte sur le GAIN NET d'un pari GAGNANT, et sur lui seul. Un pari
// perdu n'est pas taxé (on perd la mise, c'est tout), un remboursement
// (R = 1) non plus, et une cote asiatique partielle n'est taxée que sur la
// part réellement gagnée — c'est `max(0, retour − mise)` qui s'en charge.
// POINT UNIQUE : toute la page passe par ici. Le taux vient d'un champ de
// l'opérateur, il n'est écrit nulle part en dur — cf. `taxRate`.
function taxOfBet(R, stake, rate) {
  return Math.max(0, R * stake - stake) * rate;
}

// Scénarios COMPLETS : simples + combiné + système ADDITIONNÉS, pour
// k = 0..N sélections gagnantes. Pire et meilleur cas EXACTS : toutes les
// parties de k gagnantes sont parcourues (kCombinations). Le retour de
// chaque combinaison du système vient de comboReturnFactor sur des jambes
// « won », évalué UNE fois par combinaison ; une combinaison compte ensuite
// dans un scénario si toutes ses jambes y sont gagnantes (masque de bits) —
// même résultat qu'un appel de systemReturn par scénario, sans le coût
// 2^N × 2^N qui gelait la page à N = 10. Retours conditionnels, jamais des
// probabilités (règle 7). simpleStakes : mise par sélection (index aligné) ;
// flags : { sys, simples, combo } ; rate : taux d'imposition en fraction.
// L'IMPÔT est compté ici pari par pari (taxOfBet) et non sur le total du
// scénario : une ligne gagnante est taxée même quand le ticket perd dans son
// ensemble — c'est le modèle du dépôt, et c'est ce qui DÉCALE le point mort.
// Rend [{ k, mise, worst, best }] ; worst/best = { total, impot, net, sys,
// simples, combo, indices }. `total` est le retour BRUT (avant impôt), `net`
// vaut total − mise − impôt. Pire/meilleur cas sont choisis sur le NET :
// c'est le chiffre que l'opérateur encaisse. [] si N = 0.
function scenariosComplets(selections, m, lineStake, simpleStakes, comboStake, flags, rate) {
  const n = selections.length;
  if (n === 0) return [];
  const idx = selections.map((_, i) => i);
  const won = idx.map((i) => ({ odds: Number(selections[i].odds) || 1.01, status: "won" }));
  const maskOf = (ind) => ind.reduce((acc, i) => acc | (1 << i), 0);
  const sysCombos = [];
  if (flags.sys) {
    for (let j = Math.max(1, Math.min(m, n)); j <= n; j++) {
      for (const ind of kCombinations(idx, j)) {
        sysCombos.push({ mask: maskOf(ind), R: comboReturnFactor(ind.map((i) => won[i])) });
      }
    }
  }
  const simpleR = idx.map((i) => comboReturnFactor([won[i]]));
  const comboR = comboReturnFactor(won);
  const mise = sysCombos.length * lineStake
    + (flags.simples ? simpleStakes.reduce((s, v) => s + (Number(v) || 0), 0) : 0)
    + (flags.combo ? comboStake : 0);
  const out = [];
  for (let k = 0; k <= n; k++) {
    let worst = null;
    let best = null;
    for (const win of kCombinations(idx, k)) {
      const mask = maskOf(win);
      let sys = 0;
      let impot = 0;
      for (const c of sysCombos) if ((c.mask & mask) === c.mask) {
        sys += c.R * lineStake;
        impot += taxOfBet(c.R, lineStake, rate);
      }
      let simples = 0;
      if (flags.simples) for (const i of win) {
        const st = Number(simpleStakes[i]) || 0;
        simples += simpleR[i] * st;
        impot += taxOfBet(simpleR[i], st, rate);
      }
      let combo = 0;
      if (flags.combo && k === n) {
        combo = comboR * comboStake;
        impot += taxOfBet(comboR, comboStake, rate);
      }
      const total = sys + simples + combo;
      const r = { total, impot, net: total - mise - impot, sys, simples, combo, indices: win };
      if (!worst || r.net < worst.net - 1e-9) worst = r;
      if (!best || r.net > best.net + 1e-9) best = r;
    }
    out.push({ k, mise, worst, best });
  }
  return out;
}

// Point mort GLOBAL : plus petit k dont le pire cas complet rembourse la
// mise engagée APRÈS IMPÔT, toutes sections actives confondues. La retenue
// portant sur chaque pari gagnant, elle frappe même un ticket globalement
// perdant : le point mort peut donc être plus haut qu'avant impôt.
function breakEvenComplet(scen) {
  if (!scen || scen.length === 0) return null;
  const hit = scen.find((sc) => sc.worst.net >= -1e-9);
  if (!hit) return null;
  return { k: hit.k, tooShort: hit.k === scen.length - 1 };
}

/* ---------------------------------------------------------------
   UI ATOMS — sobres : chiffres, libellés courts, explications en title=.
--------------------------------------------------------------- */
function Panel({ title, children, right, sub }) {
  return (
    <div style={{ background: C.panel, border: `1px solid ${C.borderSoft}`, borderRadius: "var(--r)" }} className="p-3 md:p-4">
      <div className="flex items-center justify-between gap-x-3 gap-y-1 mb-2.5">
        <h2 style={{ color: C.muted, fontFamily: SANS, letterSpacing: "1.5px" }} className="text-[10px] font-semibold uppercase whitespace-nowrap">
          ■ {title}{sub && <span style={{ color: C.gold, fontFamily: MONO, letterSpacing: 0 }} className="ml-2 normal-case">{sub}</span>}
        </h2>
        {right}
      </div>
      {children}
    </div>
  );
}
function Field({ label, children, title }) {
  return (
    <label className="flex flex-col gap-1 min-w-0" title={title}>
      <span style={{ color: C.muted, fontFamily: SANS }} className="text-[10px] uppercase tracking-wider">{label}</span>
      {children}
    </label>
  );
}
const inputStyle = { background: C.panel2, border: `1px solid ${C.border}`, color: C.text, fontFamily: MONO, borderRadius: 6 };
const inputCls = "text-sm px-2 py-1.5 w-full min-w-0";
// Chiffre mis en avant (Total, scénarios).
function Big({ label, value, sub, color, title }) {
  return (
    <div style={{ background: C.panel2, border: `1px solid ${C.borderSoft}`, borderRadius: 8 }} className="px-3 py-2 min-w-0" title={title}>
      <div style={{ color: C.muted, fontFamily: SANS }} className="text-[10px] uppercase tracking-wider">{label}</div>
      <div style={{ color: color || C.text, fontFamily: MONO }} className="text-lg font-bold leading-tight truncate">{value}</div>
      {sub && <div style={{ color: C.muted, fontFamily: MONO }} className="text-[10px] mt-0.5 truncate">{sub}</div>}
    </div>
  );
}
// Interrupteur « Dans le total » : chaque section (simples, combiné,
// système) entre ou sort de l'addition finale sans perdre ses saisies.
function Toggle({ on, onChange, label }) {
  return (
    <button type="button" role="switch" aria-checked={on} onClick={() => onChange(!on)}
      style={{ color: on ? C.win : C.muted, border: `1px solid ${on ? "rgba(0,232,127,.35)" : C.border}`,
               background: on ? "rgba(0,232,127,.07)" : "transparent", fontFamily: SANS, cursor: "pointer", borderRadius: 100 }}
      className="flex items-center gap-1.5 text-[11px] px-2 py-0.5 transition whitespace-nowrap">
      <span style={{ width: 20, height: 11, borderRadius: 6, background: on ? C.win : C.border, position: "relative", display: "inline-block" }}>

      </span>

}
// Sélecteur à deux positions (mode de mise du système).
function Segmented({ value, options, onChange }) {

// Ligne libellé / montant, utilisée pour le bilan de chaque section.
function StatRow({ label, value, color, strong }) {

// Bilan d'une section : mise, brut, impôt, net — même bloc partout.
function Bilan({ mise, brut, impot, net, taxRate, fmt, signed, miseLabel }) {

// Détail d'un cas (pire ou meilleur) d'un scénario complet : quelles
// sélections sont bonnes, et ce que rend chaque section.
function ScenarioDetail({ titre, r, selections, flags, fmtN }) {
  const parts = [];
  if (flags.simples) parts.push(`Simples ${fmtN(r.simples)}`);
  if (flags.combo) parts.push(`Combiné ${fmtN(r.combo)}`);

      </span>
      <div style={{ color: C.muted, fontFamily: MONO }} className="mt-0.5">{parts.join(" + ")} = {fmtN(r.total)} brut{impot} → net {fmtN(r.net)}</div>
    </div>
  );
}
const Empty = ({ children }) => <p style={{ color: C.muted }} className="text-xs">{children}</p>;

/* ---------------------------------------------------------------
   AUTO-FILL — signaux PAIM actifs -> ticket système
--------------------------------------------------------------- */

// Un seul signal par match est conservé (le meilleur edge) : deux jambes du
// même match sont corrélées et invalident le calcul de combinaison
// indépendant — partagé par l'auto-remplissage et le picker manuel ci-dessous.
function dedupeBestPerMatch(list) {
  const bestPerMatch = new Map();
  for (const s of list) {
    const key = s.match_id || s.match || "";
    const prev = bestPerMatch.get(key);
    if (!prev || (s.edge_pct || 0) > (prev.edge_pct || 0)) bestPerMatch.set(key, s);
  }
  return [...bestPerMatch.values()].sort((a, b) => {
    const edgeDiff = (b.edge_pct || 0) - (a.edge_pct || 0);
    if (Math.abs(edgeDiff) > 1e-9) return edgeDiff;
    return (b.xbet_odd || 0) - (a.xbet_odd || 0);
  });
}

// Règles de l'auto-remplissage : fenêtre 12h à venir, cote > 1.80, exclut
// réglé/annulé/expiré (déjà exclus par /api/signals qui ne renvoie que
// status=active), trié par edge_pct desc puis cote desc, plafond 8 (Goliath).
async function fetchQualifyingSignals() {
  const res = await fetch("/api/signals");
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  if (!Array.isArray(data)) throw new Error("unexpected /api/signals response");

  const now = Date.now();
  const windowEnd = now + 12 * 60 * 60 * 1000;

  const qualifying = data.filter((s) => {
    if (!s.match_time) return false;
    const t = Date.parse(s.match_time);
    if (Number.isNaN(t) || t < now || t > windowEnd) return false;
    const odds = Number(s.xbet_odd);
    return odds > 1.8;
  });

  return dedupeBestPerMatch(qualifying).slice(0, 8);
}

// Signaux actifs bruts (ceux du dashboard), pour le picker manuel "Ajouter" —
// pas de fenêtre 12h ni de plancher de cote ici : contrairement à
// l'auto-remplissage, l'opérateur doit pouvoir composer son ticket avec
// n'importe quel signal actif, pas seulement ceux qui qualifient pour l'auto-fill.
async function fetchAllActiveSignals() {
  const res = await fetch("/api/signals");
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  if (!Array.isArray(data)) throw new Error("unexpected /api/signals response");
  return dedupeBestPerMatch(data);
}

/* ---------------------------------------------------------------
   MAIN COMPONENT — organisation 2026-09-09 (demande opérateur :
   « plus efficiente, intuitive, sans répétitions ») :
   · réglages globaux (devise, impôt) dans l'en-tête, une seule fois ;
   · chaque sélection n'est LISTÉE qu'une fois (panneau Sélections) ;
     Mises individuelles et Combiné y renvoient par leur numéro ;
   · le panneau « Système — résumé » (copie du bilan Système) est retiré ;
   · le détail par palier est replié par défaut ;
   · sur téléphone, une barre fixe porte Mise / Net / ROI pendant la saisie.
--------------------------------------------------------------- */
function SystemBetCalculator() {
  const [selections, setSelections] = useState([]);
  const [nextId, setNextId] = useState(1);
  const [sysM, setSysM] = useState(2);
  // Champ texte brut pour permettre de vider/retaper librement sans qu'un
  // "0" de repli ne se réinsère à chaque frappe (bug remonté : "0500" au lieu
  // de "500"). La valeur numérique clampée n'est dérivée qu'au moment du calcul.
  const [stakeInput, setStakeInput] = useState("1000");
  const lineStakeInput = Math.max(0, parseFloat(stakeInput) || 0);
  const [currency, setCurrency] = useState("XOF");
  // Mode de mise du système : « par ligne » (saisie directe) ou « totale »
  // (répartie à parts égales sur toutes les lignes). La mise par ligne
  // effective `stake` est dérivée plus bas, une fois le nombre de lignes connu.
  const [stakeMode, setStakeMode] = useState("line"); // 'line' | 'total'
  const [totalStakeInput, setTotalStakeInput] = useState("");
  // Sections additionnées dans le total : chacune entre ou sort de l'addition.
  const [sysOn, setSysOn] = useState(true);
  const [simplesOn, setSimplesOn] = useState(true);
  const [comboOn, setComboOn] = useState(true);
  // Mises individuelles : une mise par défaut commune, surchargée ligne par
  // ligne (id -> texte brut ; champ vidé = retour à la mise par défaut).
  const [simpleDefaultInput, setSimpleDefaultInput] = useState("1000");
  const [simpleStakes, setSimpleStakes] = useState({});
  const [comboStakeInput, setComboStakeInput] = useState("1000");
  const [openScenario, setOpenScenario] = useState(null);
  const [detailOpen, setDetailOpen] = useState(false);
  // FISCALITÉ — réglée par l'opérateur, jamais écrite en dur (règle 11 : le
  // taux est une décision, pas une constante enterrée dans un template).
  // Volontairement INDÉPENDANTE de `core.constants.TAX_RATE` : celle-là pilote
  // l'ÉMISSION (le b de Kelly, donc quels signaux sortent) et vaut 0.0 par
  // décision opérateur réitérée ; ici on simule ce qu'un ticket RAPPORTE, ce
  // qui est une autre question. Changer ce champ ne touche pas le moteur.
  const [taxRateInput, setTaxRateInput] = useState("20");
  const taxRate = Math.max(0, Math.min(100, parseFloat(taxRateInput) || 0));
  const taxFrac = taxRate / 100;
  const [activeCell, setActiveCell] = useState(null);
  const [signalsStatus, setSignalsStatus] = useState("loading"); // loading | error | empty | `ok:N`
  const [availableSignals, setAvailableSignals] = useState([]);
  const [pickerOpen, setPickerOpen] = useState(false);

  const n = selections.length;

  // Clamp le niveau minimum M quand le nombre de sélections N change
  useEffect(() => {
    setSysM((m) => Math.min(Math.max(m, 1), Math.max(n, 1)));
  }, [n]);

  // Auto-remplissage depuis les signaux PAIM actifs, au chargement de la page.
  useEffect(() => {
    let cancelled = false;
    (async () => {
      setSignalsStatus("loading");
      try {
        const picked = await fetchQualifyingSignals();
        if (cancelled) return;
        if (picked.length === 0) {
          setSignalsStatus("empty");
          return;
        }
        const nextSelections = picked.map((s, i) => ({
          id: i + 1,
          label: `${s.match || "?"} — ${s.selection_name || "?"}`,
          odds: Number(s.xbet_odd) || 1.01,
          status: "won",
        }));
        setSelections(nextSelections);
        setNextId(nextSelections.length + 1);
        // Système M/N canonique (Trixie/Yankee/Canadian/Heinz/Super Heinz/
        // Goliath) démarre toujours à M=2 (pas de simples) ; l'effet de clamp
        // ci-dessus le réduit tout seul à 1 si jamais un seul signal qualifie.
        setSysM(2);
        setSignalsStatus(`ok:${nextSelections.length}`);
      } catch (e) {
        if (!cancelled) setSignalsStatus("error");
      }
    })();
    return () => { cancelled = true; };
  }, []);

  // Liste des signaux actifs disponibles pour ajout manuel (picker "Ajouter") —
  // les vraies cotes du dashboard, pas une ligne vierge à coter au hasard.
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const all = await fetchAllActiveSignals();
        if (!cancelled) setAvailableSignals(all);
      } catch (e) { /* le picker affichera juste "aucun signal" */ }
    })();
    return () => { cancelled = true; };
  }, []);

  // Système M/N : tous les paliers de M à N sont inclus d'office (comme betbuzz)
  const sortedFolds = useMemo(() => {
    const arr = [];
    for (let k = Math.min(sysM, n); k <= n; k++) arr.push(k);
    return arr;
  }, [sysM, n]);
  const systemLabelText = systemLabel(Math.min(sysM, n), n);
  const totalLignes = useMemo(() => sortedFolds.reduce((s, k) => s + binom(n, k), 0), [sortedFolds, n]);
  const totalStakeWanted = Math.max(0, parseFloat(totalStakeInput) || 0);
  // Mise par ligne EFFECTIVE du système : saisie telle quelle, ou mise totale
  // divisée par le nombre de lignes. Tout le calcul système passe par elle.
  const stake = stakeMode === "total" ? (totalLignes > 0 ? totalStakeWanted / totalLignes : 0) : lineStakeInput;

  // Calcul complet
  const computed = useMemo(() => {
    const idx = selections.map((_, i) => i);
    const byFold = sortedFolds.map((k) => {
      const combos = kCombinations(idx, k).map((indices) => {
        const sels = indices.map((i) => selections[i]);
        const R = comboReturnFactor(sels);
        const maxR = comboMaxFactor(sels);
        return { k, indices, R, maxR, bucket: bucketOf(R) };
      });
      const count = combos.length;
      const mise = count * stake;
      const retour = combos.reduce((s, c) => s + c.R * stake, 0);
      // AVANT impôt (demande opérateur, 2026-09-05) : la retenue n'est plus
      // ventilée par palier, elle est prélevée UNE fois sur le total —
      // `taxAmount` plus bas. Un palier montre donc retour − mise, et la
      // somme des paliers dépasse le net total de l'impôt : c'est voulu.
      return { k, combos, count, mise, retour, profit: retour - mise };
    });
    const totalLignes = byFold.reduce((s, f) => s + f.count, 0);
    const totalMise = byFold.reduce((s, f) => s + f.mise, 0);
    const totalRetour = byFold.reduce((s, f) => s + f.retour, 0);
    const totalProfit = totalRetour - totalMise;
    const maxRSystem = Math.max(1, ...byFold.flatMap((f) => f.combos.filter((c) => c.R > 1).map((c) => c.R)));
    // Retenue LIGNE PAR LIGNE gagnante (modèle du dépôt) : une combinaison
    // perdante ne vient pas alléger l'impôt d'une combinaison gagnante.
    let taxAmount = 0;
    for (const f of byFold) for (const c of f.combos) taxAmount += taxOfBet(c.R, stake, taxFrac);
    const totalNet = totalProfit - taxAmount;
    return { byFold, totalLignes, totalMise, totalRetour, totalProfit, maxRSystem, taxAmount, totalNet };
  }, [selections, sortedFolds, stake, taxFrac]);

  const fmt = (v) => `${v.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ${currency}`;
  const signed = (v) => `${v >= 0 ? "+" : ""}${fmt(v)}`;
  // Format compact (sans devise, décimales seulement si besoin) pour les
  // tableaux étroits : la devise est rappelée une fois dans l'en-tête.
  const fmtN = (v) => v.toLocaleString("fr-FR", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  const signedN = (v) => `${v >= 0 ? "+" : ""}${fmtN(v)}`;
  const round2 = (v) => Math.round(v * 100) / 100;

  // Mises individuelles : chaque sélection jouée seule. Le retour passe par
  // comboReturnFactor sur une jambe, donc les statuts (nul, asiatique
  // partiel) sont traités exactement comme dans le système.
  const simpleStakeOf = (sel) => {
    const raw = simpleStakes[sel.id];
    const v = raw === undefined || raw === "" ? simpleDefaultInput : raw;
    return Math.max(0, parseFloat(v) || 0);
  };
  const simples = useMemo(() => {
    const rows = selections.map((sel, i) => {
      const st = simpleStakeOf(sel);
      const R = comboReturnFactor([sel]);
      const brut = R * st;
      const impot = taxOfBet(R, st, taxFrac);
      return { sel, i, stake: st, R, brut, impot, net: brut - st - impot, bucket: bucketOf(R) };
    });
    const mise = rows.reduce((s, r) => s + r.stake, 0);
    const brut = rows.reduce((s, r) => s + r.brut, 0);
    const impot = rows.reduce((s, r) => s + r.impot, 0);
    return { rows, mise, brut, impot, net: brut - mise - impot };
  }, [selections, simpleStakes, simpleDefaultInput, taxFrac]);

  // Combiné N/N : toutes les sélections sur une ligne, cote totale = produit.
  const comboStake = Math.max(0, parseFloat(comboStakeInput) || 0);
  const combine = useMemo(() => {
    const cote = selections.reduce((p, s) => p * (Number(s.odds) || 1.01), 1);
    const R = comboReturnFactor(selections);
    const brut = R * comboStake;
    const impot = taxOfBet(R, comboStake, taxFrac);
    return { cote, R, stake: comboStake, brut, impot, net: brut - comboStake - impot, bucket: bucketOf(R) };
  }, [selections, comboStake, taxFrac]);

  // Total : addition des sections ACTIVES. Le combiné n'existe qu'à partir
  // de 2 sélections (à 1, c'est un simple).
  const sectionFlags = { sys: sysOn && n > 0, simples: simplesOn && n > 0, combo: comboOn && n >= 2 };
  const sections = [
    { key: "simples", label: `${n} simple${n > 1 ? "s" : ""}`, on: sectionFlags.simples, mise: simples.mise, brut: simples.brut, impot: simples.impot },
    ...(n >= 2 ? [{ key: "combo", label: `Combiné ${n}/${n}`, on: sectionFlags.combo, mise: combine.stake, brut: combine.brut, impot: combine.impot }] : []),
    { key: "sys", label: `Système ${Math.min(sysM, n)}/${n}`, on: sectionFlags.sys, mise: computed.totalMise, brut: computed.totalRetour, impot: computed.taxAmount },
  ].map((sec) => ({ ...sec, net: sec.brut - sec.mise - sec.impot }));
  const grand = (() => {
    const act = sections.filter((sec) => sec.on);
    const mise = act.reduce((s, sec) => s + sec.mise, 0);
    const brut = act.reduce((s, sec) => s + sec.brut, 0);
    const impot = act.reduce((s, sec) => s + sec.impot, 0);
    const net = brut - mise - impot;
    return { mise, brut, impot, net, roi: mise > 0 ? (net / mise) * 100 : 0 };
  })();
  // Un système M/N contient déjà le combiné N/N, et à M = 1 les N simples :
  // les additionner n'est pas faux, mais c'est miser deux fois — on le dit.
  const inclus = [];
  if (sectionFlags.sys && sectionFlags.simples && Math.min(sysM, n) === 1) inclus.push(`les ${n} simples`);
  if (sectionFlags.sys && sectionFlags.combo) inclus.push(`le combiné ${n}/${n}`);
  const doublon = inclus.length > 0 ? `Le système ${Math.min(sysM, n)}/${n} contient déjà ${inclus.join(" et ")}` : null;

  // Scénarios complets : pire / meilleur cas EXACTS toutes sections actives
  // confondues — retours conditionnels, jamais des probabilités (règle 7).
  const scenariosTotal = useMemo(() => scenariosComplets(
    selections, Math.min(sysM, n), stake, simples.rows.map((r) => r.stake), combine.stake, sectionFlags, taxFrac),
    [selections, sysM, n, stake, simples, combine, sectionFlags.sys, sectionFlags.simples, sectionFlags.combo, taxFrac]);
  const pointMortTotal = useMemo(() => breakEvenComplet(scenariosTotal), [scenariosTotal]);
  // Verdicts jugés sur le NET (après impôt) : c'est ce que l'opérateur encaisse.
  const verdictOf = (sc) => {
    if (sc.worst.net > 1e-9) return { t: "Gagnant", c: C.win };
    if (sc.worst.net >= -1e-9) return { t: "Couvert", c: C.gold };
    if (sc.best.net >= -1e-9) return { t: "Selon lesquelles", c: C.partial };
    return { t: "Perdant", c: C.loss };
  };

  const addSelection = () => {
    if (n >= 10) return;
    setSelections((s) => [...s, { id: nextId, label: "", odds: 1.9, status: "won" }]);
    setNextId((x) => x + 1);
  };
  const addFromSignal = (sig) => {
    if (n >= 10) return;
    setSelections((s) => [...s, {
      id: nextId,
      label: `${sig.match || "?"} — ${sig.selection_name || "?"}`,
      odds: Number(sig.xbet_odd) || 1.01,
      status: "won",
    }]);
    setNextId((x) => x + 1);
  };
  // Autorise la suppression jusqu'à 0 : le ticket vide est un état géré
  // (messages "Aucune sélection" + panneau Système neutralisé). L'ancienne
  // garde s.length > 1 laissait un élément ineffaçable — remonté par l'opérateur.
  const removeSelection = (id) => setSelections((s) => s.filter((x) => x.id !== id));
  const clearAll = () => { setSelections([]); setPickerOpen(false); };
  const updateSelection = (id, patch) => setSelections((s) => s.map((x) => (x.id === id ? { ...x, ...patch } : x)));
  const setSimpleStake = (id, raw) => setSimpleStakes((m) => {
    const next = { ...m };
    if (raw === "") delete next[id]; else next[id] = raw;
    return next;
  });
  // Bascule par ligne <-> totale en conservant la mise engagée courante, pour
  // que le changement de mode ne change pas le ticket.
  const switchStakeMode = (mode) => {
    if (mode === stakeMode) return;
    if (mode === "total") setTotalStakeInput(String(round2(lineStakeInput * totalLignes)));
    else setStakeInput(String(round2(stake)));
    setStakeMode(mode);
  };
  const setSelectionCount = (target) => {
    const t = Math.max(1, Math.min(10, target));
    setSelections((s) => {
      if (t === s.length) return s;
      if (t > s.length) {
        const extra = [];
        let id = nextId;
        for (let i = s.length; i < t; i++) { extra.push({ id, label: "", odds: 1.9, status: "won" }); id++; }
        setNextId(id);
        return [...s, ...extra];
      }
      return s.slice(0, t);
    });
  };

  const activeCombo = activeCell != null ? computed.byFold.find((f) => f.k === activeCell.k)?.combos[activeCell.i] : null;

  // Signaux du picker "Ajouter" pas déjà présents dans le ticket (même clé de
  // libellé que l'auto-remplissage, donc un signal ajouté puis retiré peut être repris).
  const pickableSignals = useMemo(() => {
    const used = new Set(selections.map((s) => s.label));
    return availableSignals.filter((s) => !used.has(`${s.match || "?"} — ${s.selection_name || "?"}`));
  }, [availableSignals, selections]);

  const statusLine = {
    loading: "signaux…",
    error: "signaux indisponibles",
    empty: "aucun signal ≥ 1.80 sous 12 h",
  }[signalsStatus] || `${signalsStatus.split(":")[1]} signaux · 12 h · cote > 1.80`;

  const nActives = sections.filter((s) => s.on).length;
  const netColor = grand.net >= 0 ? C.win : C.loss;
  const numBadge = { color: C.gold, fontFamily: MONO, background: "var(--gold-bg)", border: `1px solid ${C.goldSoft}` };

  return (
    <div style={{ fontFamily: SANS }} className="w-full">
      <div className="max-w-6xl mx-auto px-3 py-4 md:px-6 md:py-5">
        {/* En-tête : même gabarit que /performance, plus les deux réglages
            GLOBAUX (devise, impôt) — ils valent pour toutes les sections,
            ils ne vivent donc plus dans le panneau Système. */}
        <div className="flex items-end justify-between gap-3 flex-wrap mb-3">
          <div className="min-w-0">
            <div className="page-title">&#9660; CALCULATEUR</div>
            <div className="page-sub" style={{ fontFamily: MONO }}
              title="Auto-remplissage : signaux actifs, match dans les 12 h, cote > 1.80, meilleur edge d'abord, 8 au plus. Ticket vide = saisie manuelle.">{statusLine}</div>
          </div>
          <div className="flex items-end gap-2">
            <div className="w-20">
              <Field label="Devise">
                <select value={currency} onChange={(e) => setCurrency(e.target.value)}
                  style={{ ...inputStyle, fontFamily: SANS }} className={inputCls}>
                  {CURRENCIES.map((c) => <option key={c} value={c}>{c}</option>)}
                </select>
              </Field>
            </div>
            <div className="w-20">
              <Field label="Impôt (%)">
                <input type="number" min="0" max="100" step="0.5" value={taxRateInput}
                  onChange={(e) => setTaxRateInput(e.target.value)}
                  onBlur={() => setTaxRateInput(String(taxRate))}
                  title="Retenue sur le gain net de chaque pari GAGNANT, toutes sections. Un pari perdu ou remboursé n'est pas taxé."
                  style={inputStyle} className={inputCls} />
              </Field>
            </div>
          </div>
        </div>

        <div className="grid grid-cols-1 lg:grid-cols-12 gap-3">
          {/* COLONNE SAISIE — les sélections (listées ici et nulle part
              ailleurs), puis une section par type de pari avec son bilan. */}
          <div className="lg:col-span-5 space-y-3">
            <Panel
              title="Sélections"
              sub={n > 0 ? `${n}` : null}
              right={
                <div className="flex items-center gap-1.5">
                  {n > 0 && (
                    <button onClick={clearAll} aria-label="Tout effacer" title="Tout effacer"
                      style={{ color: C.loss, border: `1px solid ${C.border}`, borderRadius: 100 }}
                      className="flex items-center gap-1 text-[11px] px-2 py-0.5 transition">
                      <Trash2 size={12} /> Vider
                    </button>
                  )}
                  <button onClick={() => setPickerOpen((v) => !v)} disabled={n >= 10} title={n >= 10 ? "10 sélections au plus" : "Ajouter un signal actif ou une ligne vide"}
                    style={{ color: n >= 10 ? C.muted : C.gold, border: `1px solid ${n >= 10 ? C.border : C.goldSoft}`, borderRadius: 100 }}
                    className="flex items-center gap-1 text-[11px] px-2 py-0.5 transition">
                    <Plus size={12} /> Ajouter
                  </button>
                </div>
              }
            >
              {pickerOpen && n < 10 && (
                <div style={{ background: C.panel2, border: `1px solid ${C.borderSoft}`, borderRadius: 8 }} className="mb-2 p-1.5 max-h-56 overflow-y-auto">
                  {pickableSignals.length === 0 ? (
                    <Empty>Aucun signal actif.</Empty>
                  ) : (
                    pickableSignals.map((s, i) => (
                      <button key={i} onClick={() => { addFromSignal(s); setPickerOpen(false); }}
                        style={{ color: C.text }}
                        className="w-full flex items-center justify-between gap-2 text-left text-xs px-1.5 py-1.5 rounded-md hover:bg-white/5">
                        <span className="truncate">{s.match || "?"} — {s.selection_name || "?"}</span>
                        <span style={{ color: C.gold, fontFamily: MONO }} className="shrink-0">@{Number(s.xbet_odd || 0).toFixed(2)}</span>
                      </button>
                    ))
                  )}
                  <div style={{ borderTop: `1px solid ${C.border}` }} className="mt-1 pt-1">
                    <button onClick={() => { addSelection(); setPickerOpen(false); }}
                      style={{ color: C.muted }} className="w-full text-left text-xs px-1.5 py-1.5 rounded-md hover:bg-white/5">
                      + Ligne vide
                    </button>
                  </div>
                </div>
              )}
              {n === 0 ? (
                <Empty>Aucune sélection.</Empty>
              ) : (
                <div className="space-y-1.5">
                  {selections.map((sel, i) => (
                    <div key={sel.id} style={{ background: C.panel2, border: `1px solid ${C.borderSoft}`, borderRadius: 8 }} className="p-2">
                      <div className="flex items-center gap-1.5 mb-1.5">
                        <span style={numBadge} className="text-[11px] w-6 h-6 flex items-center justify-center rounded-md shrink-0">{i + 1}</span>
                        <input
                          value={sel.label}
                          onChange={(e) => updateSelection(sel.id, { label: e.target.value })}
                          placeholder={`Sélection ${i + 1}`}
                          style={{ ...inputStyle, fontFamily: SANS }}
                          className="flex-1 min-w-0 text-sm px-2 py-1"
                        />
                        <button onClick={() => removeSelection(sel.id)} aria-label="Supprimer la sélection" title="Supprimer"
                          style={{ color: C.loss }} className="shrink-0 p-1">
                          <Trash2 size={14} />
                        </button>
                      </div>
                      <div className="flex gap-1.5 pl-[30px]">
                        <div className="w-20 shrink-0">
                          <input
                            type="number" step="0.01" min="1.01" value={sel.odds} aria-label="Cote" title="Cote"
                            onChange={(e) => updateSelection(sel.id, { odds: Math.max(1.01, parseFloat(e.target.value) || 1.01) })}
                            style={inputStyle} className="w-full text-sm px-2 py-1"
                          />
                        </div>
                        <select
                          value={sel.status} title={STATUS_TITLE} aria-label="Statut"
                          onChange={(e) => updateSelection(sel.id, { status: e.target.value })}
                          style={{ ...inputStyle, fontFamily: SANS }}
                          className="flex-1 min-w-0 text-sm px-2 py-1"
                        >
                          {STATUS_OPTS.map((o) => <option key={o.v} value={o.v}>{o.label}</option>)}
                        </select>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </Panel>

            {/* Système M/N — deux menus M/N, comme betbuzz ; mise saisie PAR
                LIGNE ou TOTALE (répartie à parts égales sur les lignes). */}
            <Panel title="Système" sub={n > 0 ? `${Math.min(sysM, n)}/${n} · ${systemLabelText} · ${totalLignes} ligne${totalLignes > 1 ? "s" : ""}` : null}
              right={n > 0 ? <Toggle on={sysOn} onChange={setSysOn} label="Dans le total" /> : null}>
              {n === 0 ? (
                <Empty>Aucune sélection.</Empty>
              ) : (
              <>
              <div className="grid grid-cols-2 gap-2 mb-2">
                <Field label="M" title="Plus petit palier joué : toutes les combinaisons de M à N sélections sont jouées">
                  <select value={Math.min(sysM, n)} onChange={(e) => setSysM(Number(e.target.value))}
                    style={inputStyle} className={inputCls}>
                    {Array.from({ length: n }, (_, i) => i + 1).map((k) => <option key={k} value={k}>{k}</option>)}
                  </select>
                </Field>
                <Field label="N" title="Nombre de sélections du ticket (ajoute ou retire des lignes)">
                  <select value={n} onChange={(e) => setSelectionCount(Number(e.target.value))}
                    style={inputStyle} className={inputCls}>
                    {Array.from({ length: 10 }, (_, i) => i + 1).map((k) => <option key={k} value={k}>{k}</option>)}
                  </select>
                </Field>
              </div>
              <div className="grid grid-cols-2 gap-2 items-end">
                <Field label="Mise">
                  <Segmented value={stakeMode} onChange={switchStakeMode}
                    options={[{ v: "line", label: "Mise par ligne" }, { v: "total", label: "Mise totale" }]} />
                </Field>
                {stakeMode === "line" ? (
                  <Field label="Par ligne">
                    <input type="number" min="0" step="1" value={stakeInput}
                      onChange={(e) => setStakeInput(e.target.value)}
                      onBlur={() => setStakeInput(String(lineStakeInput))}
                      style={inputStyle} className={inputCls} />
                  </Field>
                ) : (
                  <Field label="Totale">
                    <input type="number" min="0" step="1" value={totalStakeInput}
                      onChange={(e) => setTotalStakeInput(e.target.value)}
                      onBlur={() => setTotalStakeInput(String(totalStakeWanted))}
                      style={inputStyle} className={inputCls} />
                  </Field>
                )}
              </div>
              {stakeMode === "total" && (
                <div style={{ color: C.muted, fontFamily: MONO }} className="text-[11px] mt-1.5 text-right">÷ {totalLignes} = {fmt(stake)} par ligne</div>
              )}
              <Bilan mise={computed.totalMise} brut={computed.totalRetour} impot={computed.taxAmount} net={computed.totalNet}
                taxRate={taxRate} fmt={fmt} signed={signed} miseLabel={`Mise · ${totalLignes} × ${fmtN(stake)}`} />
              </>
              )}
            </Panel>

            {/* Mises individuelles — chaque sélection jouée SEULE. Les lignes
                renvoient au NUMÉRO de la sélection (listée une seule fois plus
                haut) : mise par défaut commune, surchargeable ligne par ligne. */}
            <Panel title="Mises individuelles" sub={n > 0 ? `${n} simple${n > 1 ? "s" : ""}` : null}
              right={n > 0 ? <Toggle on={simplesOn} onChange={setSimplesOn} label="Dans le total" /> : null}>
              {n === 0 ? (
                <Empty>Aucune sélection.</Empty>
              ) : (
              <>
              <div className="flex items-end gap-2 mb-2">
                <div className="w-28">
                  <Field label="Mise par défaut" title="Appliquée à chaque simple sans mise propre">
                    <input type="number" min="0" step="1" value={simpleDefaultInput}
                      onChange={(e) => setSimpleDefaultInput(e.target.value)}
                      onBlur={() => setSimpleDefaultInput(String(Math.max(0, parseFloat(simpleDefaultInput) || 0)))}
                      style={inputStyle} className={inputCls} />
                  </Field>
                </div>
                {Object.keys(simpleStakes).length > 0 && (
                  <button type="button" onClick={() => setSimpleStakes({})} title="Remettre toutes les mises à la valeur par défaut"
                    style={{ color: C.muted, border: `1px solid ${C.border}`, cursor: "pointer", borderRadius: 100 }}
                    className="text-[11px] px-2 py-1">
                    ↺ défaut
                  </button>
                )}
              </div>
              <table className="w-full text-xs" style={{ fontFamily: MONO, borderCollapse: "collapse" }}
                title="Une ligne par sélection (numéro du panneau Sélections). Mise vide = mise par défaut. Brut = retour mise comprise, net après impôt.">
                <thead>
                  <tr style={{ color: C.muted, fontFamily: SANS }}>
                    <th className="text-left py-1 pr-2">#</th>
                    <th className="text-left py-1 pr-2">Cote</th>
                    <th className="text-left py-1 pr-2">Mise</th>
                    <th className="text-right py-1 px-1">Brut</th>
                    <th className="text-right py-1 pl-1">Net</th>
                  </tr>
                </thead>
                <tbody>
                  {simples.rows.map((r) => (
                    <tr key={r.sel.id} style={{ borderTop: `1px solid ${C.borderSoft}` }}>
                      <td className="py-1 pr-2"><span style={numBadge} className="text-[10px] w-5 h-5 inline-flex items-center justify-center rounded">{r.i + 1}</span></td>
                      <td className="py-1 pr-2" style={{ color: C.gold }}>{r.sel.odds.toFixed(2)}{r.sel.status !== "won" && <span style={{ color: C.muted }}> · {STATUS_OPTS.find((o) => o.v === r.sel.status)?.label}</span>}</td>
                      <td className="py-1 pr-2">
                        <input type="number" min="0" step="1" value={simpleStakes[r.sel.id] ?? ""} placeholder={simpleDefaultInput}
                          aria-label={`Mise sélection ${r.i + 1}`}
                          onChange={(e) => setSimpleStake(r.sel.id, e.target.value)}
                          style={inputStyle} className="w-20 text-xs px-1.5 py-1" />
                      </td>
                      <td className="text-right py-1 px-1" style={{ color: bucketColor[r.bucket] }}>{fmtN(r.brut)}</td>
                      <td className="text-right py-1 pl-1" style={{ color: r.net >= 0 ? C.win : C.loss }}>{signedN(r.net)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
              <Bilan mise={simples.mise} brut={simples.brut} impot={simples.impot} net={simples.net}
                taxRate={taxRate} fmt={fmt} signed={signed} />
              </>
              )}
            </Panel>

            {/* Combiné — TOUTES les sélections sur une seule ligne N/N, cote
                totale = produit des cotes (statuts appliqués par le moteur). */}
            <Panel title="Combiné" sub={n >= 2 ? `${n}/${n}` : null}
              right={n >= 2 ? <Toggle on={comboOn} onChange={setComboOn} label="Dans le total" /> : null}>
              {n < 2 ? (
                <Empty>2 sélections minimum.</Empty>
              ) : (
              <>
              <div className="grid grid-cols-2 gap-2 items-end">
                <Field label="Mise">
                  <input type="number" min="0" step="1" value={comboStakeInput}
                    onChange={(e) => setComboStakeInput(e.target.value)}
                    onBlur={() => setComboStakeInput(String(comboStake))}
                    style={inputStyle} className={inputCls} />
                </Field>
                <div className="min-w-0 text-right" title={selections.map((s) => s.odds.toFixed(2)).join(" × ")}>
                  <div style={{ color: C.muted }} className="text-[10px] uppercase tracking-wider">Cote totale</div>
                  <div style={{ color: C.gold, fontFamily: MONO }} className="text-xl font-bold leading-none">{combine.cote.toFixed(3)}</div>
                </div>
              </div>
              <div style={{ color: C.muted, fontFamily: MONO }} className="text-[11px] mt-1.5 text-right truncate">
                {selections.map((s) => s.odds.toFixed(2)).join(" × ")}
                {combine.bucket !== "win" && <span style={{ color: C.partial }} title="Statuts appliqués : nul = cote 1, perdu = 0."> · R {combine.R.toFixed(3)}×</span>}
              </div>
              <Bilan mise={combine.stake} brut={combine.brut} impot={combine.impot} net={combine.net}
                taxRate={taxRate} fmt={fmt} signed={signed} />
              </>
              )}
            </Panel>
          </div>

          {/* COLONNE RÉSULTAT — le total des sections actives, ses scénarios
              complets, puis le détail du système (replié). */}
          <div className="lg:col-span-7 space-y-3">
            {n === 0 ? (
              <Panel title="Total"><Empty>Aucune sélection.</Empty></Panel>
            ) : (
              <>
                {/* Total — addition des sections actives (interrupteur « Dans le
                    total » de chacune). Brut = retour mise comprise, net = brut − mise − impôt. */}
                <Panel title="Total" sub={`${nActives}/${sections.length} actives · ${currency}`}>
                  {/* Grands chiffres SANS devise (elle est dans le sous-titre) :
                      « 8 000,00 XOF » se tronquait dans une colonne de 390/3 px. */}
                  <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
                    <div className="col-span-2 md:col-span-1 md:order-2 min-w-0">
                      <Big label="Net" value={signedN(grand.net)} color={netColor} sub={`${fmtN(grand.brut)} brut`} />
                    </div>
                    <div className="md:order-1 min-w-0"><Big label="Mise" value={fmtN(grand.mise)} /></div>
                    <div className="md:order-3 min-w-0"><Big label="ROI" value={`${grand.roi.toFixed(1)} %`} color={netColor} sub="net / mise" /></div>
                  </div>
                  <div className="mt-2.5"
                    title="Brut = retour avant impôt, mise comprise. Net = brut − mise − impôt. Selon les statuts saisis (Gagné par défaut = tout passe).">
                    <table className="w-full text-xs" style={{ fontFamily: MONO, borderCollapse: "collapse" }}>
                      <thead>
                        <tr style={{ color: C.muted, fontFamily: SANS }}>
                          <th className="text-left py-1 pr-2">Section</th>
                          <th className="text-right py-1 px-1">Mise</th>
                          <th className="text-right py-1 px-1">Brut</th>
                          <th className="text-right py-1 px-1 whitespace-nowrap">{`Impôt ${taxRate} %`}</th>
                          <th className="text-right py-1 pl-1">Net</th>
                        </tr>
                      </thead>
                      <tbody>
                        {sections.map((s) => (
                          <tr key={s.key} style={{ borderTop: `1px solid ${C.borderSoft}`, opacity: s.on ? 1 : 0.45 }}>
                            <td className="py-1 pr-2 whitespace-nowrap" style={{ color: C.text, fontFamily: SANS }} title={s.on ? "" : "hors total"}>
                              {s.label}{!s.on && <span style={{ color: C.muted }}> ⊘</span>}
                            </td>
                            <td className="text-right py-1 px-1" style={{ color: C.text }}>{fmtN(s.mise)}</td>
                            <td className="text-right py-1 px-1" style={{ color: C.text }}>{fmtN(s.brut)}</td>
                            <td className="text-right py-1 px-1" style={{ color: C.partial }}>{s.impot > 0 ? `− ${fmtN(s.impot)}` : "—"}</td>
                            <td className="text-right py-1 pl-1" style={{ color: s.net >= 0 ? C.win : C.loss }}>{signedN(s.net)}</td>
                          </tr>
                        ))}
                        <tr style={{ borderTop: `1px solid ${C.border}`, color: C.text }} className="font-semibold">
                          <td className="py-1 pr-2" style={{ fontFamily: SANS }}>Total</td>
                          <td className="text-right py-1 px-1">{fmtN(grand.mise)}</td>
                          <td className="text-right py-1 px-1">{fmtN(grand.brut)}</td>
                          <td className="text-right py-1 px-1" style={{ color: C.partial }}>{grand.impot > 0 ? `− ${fmtN(grand.impot)}` : "—"}</td>
                          <td className="text-right py-1 pl-1" style={{ color: netColor }}>{signedN(grand.net)}</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                  {doublon && (
                    <div style={{ background: "rgba(255,107,53,.08)", border: `1px solid rgba(255,107,53,.35)`, color: C.partial, borderRadius: 6 }}
                      className="text-[11px] px-2 py-1 mt-2">
                      ⚠ {doublon} — jouer deux fois.
                    </div>
                  )}
                </Panel>

                {/* Scénarios complets — pire et meilleur cas EXACTS, toutes sections
                    actives confondues, par nombre de bons. Retours conditionnels,
                    jamais des probabilités (règle 7). */}
                <Panel
                  title="Scénarios complets"
                  right={<span style={{ color: C.muted, fontFamily: SANS }} className="text-[10px] whitespace-nowrap"
                    title="Retours conditionnels : « si k sélections sont bonnes, le ticket rend… ». Aucune probabilité n'est calculée ni affichée.">pas des probabilités</span>}
                >
                  {grand.mise <= 0 ? (
                    <Empty>Aucune mise.</Empty>
                  ) : (
                  <>
                  <div className="grid grid-cols-2 gap-2 mb-2.5">
                    <Big label="Point mort" title="Plus petit nombre de bonnes sélections dont le PIRE cas rembourse la mise après impôt"
                      value={pointMortTotal ? `${pointMortTotal.k} bon${pointMortTotal.k > 1 ? "s" : ""} / ${n}` : "jamais"}
                      color={pointMortTotal ? C.gold : C.loss}
                      sub={pointMortTotal && pointMortTotal.tooShort ? `${n - 1} bons ne couvrent pas` : "net ≥ 0"} />
                    <Big label="Si tout passe" value={signedN(scenariosTotal[n].best.net)} color={C.win}
                      sub={`${fmtN(scenariosTotal[n].best.total)} brut − ${fmtN(scenariosTotal[n].best.impot)} impôt`} />
                  </div>
                  <div
                    title="Si k sélections sont bonnes : pire cas = les k qui rapportent le moins, net d'impôt ; meilleur cas = celles qui rapportent le plus. Gagnant = couvert même au pire · Selon lesquelles = dépend des bonnes · Perdant = jamais couvert. L'impôt frappe chaque pari gagnant même si le ticket perd. Touche une ligne pour le détail.">
                    <table className="w-full text-xs" style={{ fontFamily: MONO, borderCollapse: "collapse" }}>
                      <thead>
                        <tr style={{ color: C.muted, fontFamily: SANS }}>
                          <th className="text-left py-1 pr-2">Bons</th>
                          <th className="text-right py-1 px-1">Pire<div style={{ color: C.muted }} className="font-normal text-[9px]">brut / net</div></th>
                          <th className="text-right py-1 px-1">Meilleur<div style={{ color: C.muted }} className="font-normal text-[9px]">brut / net</div></th>
                          <th className="text-right py-1 pl-1">Verdict</th>
                        </tr>
                      </thead>
                      <tbody>
                        {scenariosTotal.map((sc) => {
                          const v = verdictOf(sc);
                          const open = openScenario === sc.k;
                          const estPM = pointMortTotal && pointMortTotal.k === sc.k;
                          const netW = sc.worst.net;
                          const netB = sc.best.net;
                          return (
                            <React.Fragment key={sc.k}>
                              <tr onClick={() => setOpenScenario(open ? null : sc.k)}
                                style={{ borderTop: `1px solid ${C.borderSoft}`, background: estPM ? "var(--gold-bg)" : "transparent", cursor: "pointer" }}>
                                <td className="py-1 pr-2 align-top whitespace-nowrap" style={{ color: estPM ? C.gold : C.text }}>
                                  {sc.k}/{n}{estPM ? " ◆" : ""}
                                </td>
                                <td className="text-right py-1 px-1 align-top">
                                  <div style={{ color: C.text }}>{fmtN(sc.worst.total)}</div>
                                  <div style={{ color: netW >= 0 ? C.win : C.loss }}>{signedN(netW)}</div>
                                </td>
                                <td className="text-right py-1 px-1 align-top">
                                  <div style={{ color: C.text }}>{fmtN(sc.best.total)}</div>
                                  <div style={{ color: netB >= 0 ? C.win : C.loss }}>{signedN(netB)}</div>
                                </td>
                                <td className="text-right py-1 pl-1 align-top">
                                  <span style={{ color: v.c, border: `1px solid ${v.c}`, fontFamily: SANS, borderRadius: 100 }}
                                    className="inline-block px-1.5 py-0.5 text-[10px] whitespace-nowrap">{v.t}</span>
                                </td>
                              </tr>
                              {open && (
                                <tr style={{ background: C.panel2 }}>
                                  <td colSpan="4" className="px-2 py-2">
                                    <div className="space-y-1.5">
                                      <ScenarioDetail titre="Pire" r={sc.worst} selections={selections} flags={sectionFlags} fmtN={fmtN} />
                                      <ScenarioDetail titre="Meilleur" r={sc.best} selections={selections} flags={sectionFlags} fmtN={fmtN} />
                                    </div>
                                  </td>
                                </tr>
                              )}
                            </React.Fragment>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                  </>
                  )}
                </Panel>

                {/* Détail du SYSTÈME par palier et par combinaison — replié par
                    défaut : c'est la loupe, pas la lecture courante. Avant
                    impôt : la retenue n'est pas ventilée par palier. */}
                <Panel title="Détail du système" sub={`${computed.totalLignes} ligne${computed.totalLignes > 1 ? "s" : ""}`}
                  right={
                    <button type="button" onClick={() => setDetailOpen((v) => !v)}
                      style={{ color: C.muted, border: `1px solid ${C.border}`, borderRadius: 100 }}
                      className="text-[11px] px-2 py-0.5" title="Paliers et combinaisons, avant impôt">
                      {detailOpen ? "▾ masquer" : "▸ afficher"}
                    </button>
                  }
                >
                  {detailOpen && (
                  <div className="space-y-2">
                    {computed.byFold.map((f) => (
                      <div key={f.k} style={{ background: C.panel2, border: `1px solid ${C.borderSoft}`, borderRadius: 8 }} className="p-2.5">
                        <div className="flex items-center justify-between mb-1.5">
                          <span style={{ color: C.text, fontFamily: SANS }} className="text-sm font-medium">
                            {foldName(f.k)} <span style={{ color: C.muted }} className="font-normal text-xs">· {f.count} ligne{f.count > 1 ? "s" : ""}</span>
                          </span>
                          <span style={{ fontFamily: MONO }} className="text-right">
                            <span style={{ color: f.profit >= 0 ? C.win : C.loss }} className="text-sm font-semibold">{signed(f.profit)}</span>
                            <span style={{ color: C.muted }} className="block text-[10px]">{fmtN(f.retour)} brut</span>
                          </span>
                        </div>
                        <div className="flex flex-wrap gap-1">
                          {f.combos.map((c, i) => {
                            const isActive = activeCell && activeCell.k === f.k && activeCell.i === i;
                            return (
                              <button key={i} onClick={() => setActiveCell(isActive ? null : { k: f.k, i })}
                                style={{
                                  background: isActive ? bucketColor[c.bucket] : "transparent",
                                  border: `1px solid ${bucketColor[c.bucket]}`,
                                  color: isActive ? C.bg : bucketColor[c.bucket],
                                  fontFamily: MONO, borderRadius: 6,
                                }}
                                className="text-[11px] px-1.5 py-0.5 transition">
                                {c.indices.map((idx) => idx + 1).join("·")}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    ))}
                    {activeCombo && (
                      <div style={{ background: C.panel2, border: `1px solid ${C.goldSoft}`, borderRadius: 8 }} className="p-2.5">
                        <div style={{ color: C.gold, fontFamily: MONO }} className="text-xs font-semibold mb-1.5">
                          {foldName(activeCell.k)} {activeCombo.indices.map((i) => i + 1).join("·")}
                          <span style={{ color: bucketColor[activeCombo.bucket] }} className="float-right" title="Facteur de retour : 0 = perdue, 1 = remboursée, > 1 = gagnante">R {activeCombo.R.toFixed(3)}×</span>
                        </div>
                        <div className="space-y-0.5">
                          {activeCombo.indices.map((idx) => {
                            const sel = selections[idx];
                            return (
                              <div key={idx} className="flex items-center justify-between gap-2 text-xs">
                                <span style={{ color: C.muted }} className="truncate">{idx + 1} · {sel.label || `Sélection ${idx + 1}`}</span>
                                <span style={{ color: C.gold, fontFamily: MONO }} className="shrink-0">
                                  @{sel.odds.toFixed(2)}{sel.status !== "won" ? ` · ${STATUS_OPTS.find((o) => o.v === sel.status)?.label}` : ""}
                                </span>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    )}
                  </div>
                  )}
                </Panel>
              </>
            )}
          </div>
        </div>

        {/* Widget « Quota OddsAPI » retiré le 2026-08-22 (Mission 2, Phase 2) :
            la surveillance est backend — alerte Telegram 20 % / 5 % + log à
            chaque run (run_engine._alert_oddsapi_pool_levels). */}
      </div>

      {/* Barre de résultat (téléphone) : mise, net, ROI des sections actives. */}
      {n > 0 && (
        <div className="sys-bar" title="Total des sections actives, après impôt">
          <div><div className="l">Mise</div><div className="v" style={{ color: C.text }}>{fmtN(grand.mise)}</div></div>
          <div><div className="l">Net</div><div className="v" style={{ color: netColor }}>{signedN(grand.net)}</div></div>
          <div><div className="l">ROI</div><div className="v" style={{ color: netColor }}>{grand.roi.toFixed(1)} %</div></div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("sbc-root")).render(<SystemBetCalculator />);
{% endraw %}
</script>
</body>
</html>
