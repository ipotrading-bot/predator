<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#00E87F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PREDATOR">
<title>PREDATOR · SYSTÈME</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="192x192" href="/static/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/predator.css?v={{ version }}">
<link rel="stylesheet" href="/static/css/system.css?v={{ version }}">
<style>
/* System page overrides — même charte que l'accueil et /performance :
   variables de predator.css, en-tête .page-title/.page-sub, pendule local. */
.wrap { max-width: none; padding: 0 0 calc(116px + var(--sbot)); }
@media (min-width: 640px) { .wrap { padding-bottom: 52px; } }
.nav-pages a.on, .bnav a.on { color: var(--purple); }
/* predator.css donnait à TOUTE table un min-width de 760px ; la règle est
   scopée au ledger et à l'audit depuis le 2026-09-09. Les tableaux de cette
   page sont étroits et doivent tenir dans un téléphone : ce plancher à 0
   reste la garantie locale, avec :where() pour ne pas peser plus lourd que
   les classes Tailwind. */
:where(#sbc-root) table { min-width: 0; }
#sbc-root input, #sbc-root select { color-scheme: dark; }
#sbc-root input:focus, #sbc-root select:focus { outline: none; border-color: var(--purple) !important; }
/* Barre de résultat mobile : le net vit sous le pouce pendant la saisie,
   sans avoir à descendre jusqu'au panneau Total. */
.sys-bar { position: fixed; left: 0; right: 0; bottom: calc(64px + var(--sbot)); z-index: 55;
  background: rgba(3,3,5,.94); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--bd); display: flex; justify-content: space-around; padding: 8px 12px; }
.sys-bar div { text-align: center; }
.sys-bar .l { font-size: 8.5px; letter-spacing: .6px; text-transform: uppercase; color: var(--t2); font-weight: 600; }
.sys-bar .v { font-size: 15px; font-weight: 800; font-family: var(--font-data); line-height: 1.2; }
@media (min-width: 1024px) { .sys-bar { display: none; } }
</style>
</head>
<body>

<!-- TOP NAV -->
<nav class="topnav">
  <a href="/" class="nav-logo"><img src="/static/icons/icon-96.png" alt="PREDATOR"> PREDATOR</a>
  <div class="nav-pages">
    <a href="/">ACCUEIL</a>
    <a href="/system" class="on">SYSTÈME</a>
    <a href="/performance">PERF</a>
    <a href="/bank">BANK</a>
  </div>
  <div class="nav-right">
    <span id="clock" title="Heure locale">—</span>
  </div>
</nav>

<div class="wrap">

<div id="sbc-root"></div>

</div><!-- /wrap -->

<footer>PREDATOR SYSTÈME v{{ version }} &nbsp;&middot;&nbsp; Calculateur système auto-rempli &middot; PAIM</footer>

<!-- BOTTOM NAV -->
<nav class="bnav">
  <a href="/" aria-label="Accueil">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    Accueil
  </a>
  <a href="/system" class="on" aria-label="Système">
    <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" fill="currentColor" stroke="none"/></svg>
    Sys
  </a>
  <a href="/performance" aria-label="Performance">
    <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/><circle cx="12" cy="5" r="1" fill="currentColor" stroke="none"/></svg>
    Perf
  </a>
  <a href="/bank" aria-label="Bank">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="12" cy="12" r="4"/><line x1="12" y1="8" x2="12" y2="10"/><line x1="12" y1="14" x2="12" y2="16"/><line x1="8" y1="12" x2="10" y2="12"/><line x1="14" y1="12" x2="16" y2="12"/><line x1="6" y1="20" x2="6" y2="22"/><line x1="18" y1="20" x2="18" y2="22"/></svg>
    Bank
  </a>
</nav>

<script>
// Heure locale HH:MM, comme l'accueil et /performance.
(function tick(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  document.getElementById('clock').textContent = p(d.getHours())+':'+p(d.getMinutes());
  setTimeout(tick,1000);
})();
</script>
<!-- System Bet Calculator — COMPILÉ, plus rien ne se transpile dans le
     navigateur (2026-09-09, demande opérateur « appli légère, chargement
     rapide »). Jusque-là la page chargeait Babel standalone (2,9 Mo) pour
     transpiler le JSX à chaque visite, et Tailwind « play » (398 Ko) pour
     générer son CSS à la volée : plusieurs secondes sur téléphone, pour un
     résultat toujours identique.

     Source : assets/system.jsx. Sorties : /static/js/system.js et
     /static/css/system.css, produites par `python scripts/build_system.py`
     (Babel 8.0.4 en local, Tailwind CLI 3.4.17), empreinte de la source en
     tête de chaque fichier — `tests/test_system_build.py` refuse une source
     modifiée sans recompilation. react / react-dom 18.3.1 sont servis d'ici
     (api/static/js/vendor/, SRI vérifié au téléchargement par le même
     script) : plus aucun tiers n'exécute de code sur cette page. -->
<script src="/static/js/vendor/react-18.3.1.production.min.js?v={{ version }}"></script>
<script src="/static/js/vendor/react-dom-18.3.1.production.min.js?v={{ version }}"></script>
<script src="/static/js/system.js?v={{ version }}"></script>
</body>
</html>
