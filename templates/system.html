{% raw %}
const { useState, useMemo, useEffect } = React;

/* ---------------------------------------------------------------
   ICONS — inline SVG (lucide-react needs a bundler; this page has

--------------------------------------------------------------- */

const Plus        = ({ size }) => <Icon size={size}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Icon>;
const Trash2       = ({ size }) => <Icon size={size}><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></Icon>;

/* ---------------------------------------------------------------
   TOKENS — palette "carnet de paris quantitatif"
--------------------------------------------------------------- */
const C = {
  bg: "#0A0C10",
  panel: "#12151C",
  panel2: "#191D27",
  border: "#262B38",
  borderSoft: "#1E222D",
  text: "#ECEFF4",
  muted: "#8A93A6",
  faint: "#5C6478",
  gold: "#C6A15B",
  goldSoft: "#8A7240",
  win: "#33C481",
  loss: "#E5566B",
  voidC: "#7C8798",
  partial: "#E3A23C",
};

const SANS = '"Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif';
const MONO = 'ui-monospace, "IBM Plex Mono", "SF Mono", Menlo, Consolas, monospace';

const FOLD_NAMES = { 1: "Simple", 2: "Double", 3: "Trio", 4: "Quadruple", 5: "Quintuple", 6: "Sextuple", 7: "Septuple", 8: "Octuple", 9: "Nonuple", 10: "Décuple" };
const foldName = (k) => FOLD_NAMES[k] || `${k}-fold`;

const STATUS_OPTS = [
  { v: "won", label: "Gagné" },
  { v: "lost", label: "Perdu" },
  { v: "void", label: "Nul (remboursé)" },
  { v: "won_void", label: "Gagné / Nul (cote asiatique partielle)" },
  { v: "lost_void", label: "Perdu / Nul (cote asiatique partielle)" },
];

const CURRENCIES = ["XOF", "CHF", "EUR", "USD"];

const NAMED_SYSTEMS = {
  "1-1": "Simple", "2-2": "Double", "3-3": "Trio (Treble)",
  "1-3": "Patent", "2-3": "Trixie",
  "1-4": "Lucky 15", "2-4": "Yankee",
  "1-5": "Lucky 31", "2-5": "Canadian / Super Yankee",
  "1-6": "Lucky 63", "2-6": "Heinz",
  "1-7": "Lucky 127", "2-7": "Super Heinz",
  "1-8": "Système complet (8)", "2-8": "Goliath",
};
// Format standard "Système M/N" (identique à betbuzz) : toutes les combinaisons
// de M à N sélections sont jouées d'un coup. Les noms commerciaux (Trixie,
// Yankee, Heinz...) ne sont que des alias de plages M-N précises.
function systemLabel(m, n) {
  const key = `${m}-${n}`;
  if (NAMED_SYSTEMS[key]) return NAMED_SYSTEMS[key];
  if (m === n) return "Accumulateur";
  return `Système personnalisé (${m} à ${n})`;
}

/* ---------------------------------------------------------------
   MATH — combinatoire, gestion des nuls / cotes asiatiques
   (moteur inchangé — ne pas modifier ces fonctions)
--------------------------------------------------------------- */
function kCombinations(arr, k) {
  const out = [];
  const combo = [];
  (function bt(start) {
    if (combo.length === k) { out.push([...combo]); return; }
    for (let i = start; i < arr.length; i++) { combo.push(arr[i]); bt(i + 1); combo.pop(); }
  })(0);
  return out;
}

// Chaque statut se décompose en une liste de branches [poids, multiplicateur].
// C'est ce qui permet de traiter proprement les cotes asiatiques partielles
// (Gagné/Nul, Perdu/Nul) au lieu de les arrondir grossièrement.
function legBranches(sel) {
  const o = sel.odds;
  switch (sel.status) {
    case "won": return [[1, o]];
    case "lost": return [[1, 0]];
    case "void": return [[1, 1]];
    case "won_void": return [[0.5, o], [0.5, 1]];
    case "lost_void": return [[0.5, 0], [0.5, 1]];
    default: return [[1, 1]];
  }
}

// Facteur de retour attendu R d'une combinaison : produit croisé des branches
// de chaque sélection. R=0 -> perdue, R=1 -> remboursée, 0<R<1 -> perte partielle,
// R>1 -> gagnante. Un "Nul" a un multiplicateur de 1, ce qui réduit automatiquement
// la combinaison au palier inférieur sans fausser le calcul.
function comboReturnFactor(sels) {
  let acc = [[1, 1]];
  for (const sel of sels) {
    const branches = legBranches(sel);
    const next = [];
    for (const [aw, am] of acc) for (const [bw, bm] of branches) next.push([aw * bw, am * bm]);
    acc = next;
  }
  return acc.reduce((s, [w, m]) => s + w * m, 0);
}

function comboMaxFactor(sels) {
  return sels.reduce((p, sel) => {
    if (sel.status === "lost") return 0;
    if (sel.status === "won" || sel.status === "won_void") return p * sel.odds;
    return p;
  }, 1);
}

function bucketOf(R) {
  if (R === 0) return "loss";
  if (R === 1) return "void";
  if (R > 0 && R < 1) return "partial";
  return "win";
}
const bucketColor = { loss: C.loss, void: C.voidC, partial: C.partial, win: C.win };

/* ---------------------------------------------------------------
   UI ATOMS
--------------------------------------------------------------- */
function Panel({ title, children, right }) {
  return (

      <div className="flex items-center justify-between mb-3">
        <h2 style={{ color: C.text, fontFamily: SANS }} className="text-sm font-semibold tracking-wide uppercase">{title}</h2>
        {right}

    </div>

}
function Field({ label, children }) {
  return (
    <label className="flex flex-col gap-1">
      <span style={{ color: C.muted, fontFamily: SANS }} className="text-xs">{label}</span>
      {children}
    </label>
  );
}
const inputStyle = { background: C.panel2, border: `1px solid ${C.border}`, color: C.text, fontFamily: MONO };
function SummaryCard({ label, value, sub, color }) {
  return (
    <div style={{ background: C.panel2, border: `1px solid ${C.borderSoft}`, borderRadius: 10 }} className="px-4 py-3">
      <div style={{ color: C.muted, fontFamily: SANS }} className="text-xs mb-1">{label}</div>
      <div style={{ color: color || C.text, fontFamily: MONO }} className="text-lg font-semibold">{value}</div>
      {sub && <div style={{ color: C.faint, fontFamily: SANS }} className="text-xs mt-0.5">{sub}</div>}
    </div>
  );
}

/* ---------------------------------------------------------------
   AUTO-FILL — signaux PAIM actifs -> ticket système
--------------------------------------------------------------- */

// Un seul signal par match est conservé (le meilleur edge) : deux jambes du
// même match sont corrélées et invalident le calcul de combinaison
// indépendant — partagé par l'auto-remplissage et le picker manuel ci-dessous.
function dedupeBestPerMatch(list) {
  const bestPerMatch = new Map();
  for (const s of list) {
    const key = s.match_id || s.match || "";
    const prev = bestPerMatch.get(key);
    if (!prev || (s.edge_pct || 0) > (prev.edge_pct || 0)) bestPerMatch.set(key, s);
  }
  return [...bestPerMatch.values()].sort((a, b) => {
    const edgeDiff = (b.edge_pct || 0) - (a.edge_pct || 0);
    if (Math.abs(edgeDiff) > 1e-9) return edgeDiff;
    return (b.xbet_odd || 0) - (a.xbet_odd || 0);
  });
}

// Règles de l'auto-remplissage : fenêtre 12h à venir, cote > 1.80, exclut
// réglé/annulé/expiré (déjà exclus par /api/signals qui ne renvoie que
// status=active), trié par edge_pct desc puis cote desc, plafond 8 (Goliath).
async function fetchQualifyingSignals() {
  const res = await fetch("/api/signals");
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  if (!Array.isArray(data)) throw new Error("unexpected /api/signals response");

  const now = Date.now();
  const windowEnd = now + 12 * 60 * 60 * 1000;

  const qualifying = data.filter((s) => {
    if (!s.match_time) return false;
    const t = Date.parse(s.match_time);
    if (Number.isNaN(t) || t < now || t > windowEnd) return false;
    const odds = Number(s.xbet_odd);
    return odds > 1.8;
  });

  return dedupeBestPerMatch(qualifying).slice(0, 8);
}

// Signaux actifs bruts (ceux du dashboard), pour le picker manuel "Ajouter" —
// pas de fenêtre 12h ni de plancher de cote ici : contrairement à
// l'auto-remplissage, l'opérateur doit pouvoir composer son ticket avec
// n'importe quel signal actif, pas seulement ceux qui qualifient pour l'auto-fill.
async function fetchAllActiveSignals() {
  const res = await fetch("/api/signals");
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  if (!Array.isArray(data)) throw new Error("unexpected /api/signals response");
  return dedupeBestPerMatch(data);
}

/* ---------------------------------------------------------------
   MAIN COMPONENT
--------------------------------------------------------------- */
function SystemBetCalculator() {
  const [selections, setSelections] = useState([]);
  const [nextId, setNextId] = useState(1);
  const [sysM, setSysM] = useState(2);
  // Champ texte brut pour permettre de vider/retaper librement sans qu'un
  // "0" de repli ne se réinsère à chaque frappe (bug remonté : "0500" au lieu
  // de "500"). La valeur numérique clampée n'est dérivée qu'au moment du calcul.
  const [stakeInput, setStakeInput] = useState("1000");
  const stake = Math.max(0, parseFloat(stakeInput) || 0);
  const [currency, setCurrency] = useState("XOF");
  // Fiscalité masquée sur cette page (demande opérateur) mais gardée active
  // "en sourdine" : la retenue continue d'être calculée dans `computed`
  // ci-dessous avec les mêmes réglages par défaut, simplement plus affichée.
  const taxEnabled = true;
  const taxRate = 20;
  const taxBase = "net_system"; // 'net_system' | 'per_line'
  const [activeCell, setActiveCell] = useState(null);
  const [signalsStatus, setSignalsStatus] = useState("loading"); // loading | error | empty | `ok:N`
  const [oddsQuota, setOddsQuota] = useState({ status: "loading" }); // loading | ok | error
  const [availableSignals, setAvailableSignals] = useState([]);
  const [pickerOpen, setPickerOpen] = useState(false);

  const n = selections.length;

  // Clamp le niveau minimum M quand le nombre de sélections N change
  useEffect(() => {
    setSysM((m) => Math.min(Math.max(m, 1), Math.max(n, 1)));
  }, [n]);

  // Auto-remplissage depuis les signaux PAIM actifs, au chargement de la page.
  useEffect(() => {
    let cancelled = false;
    (async () => {
      setSignalsStatus("loading");
      try {
        const picked = await fetchQualifyingSignals();
        if (cancelled) return;
        if (picked.length === 0) {
          setSignalsStatus("empty");
          return;
        }
        const nextSelections = picked.map((s, i) => ({
          id: i + 1,
          label: `${s.match || "?"} — ${s.selection_name || "?"}`,
          odds: Number(s.xbet_odd) || 1.01,
          status: "won",
        }));
        setSelections(nextSelections);
        setNextId(nextSelections.length + 1);
        // Système M/N canonique (Trixie/Yankee/Canadian/Heinz/Super Heinz/
        // Goliath) démarre toujours à M=2 (pas de simples) ; l'effet de clamp
        // ci-dessus le réduit tout seul à 1 si jamais un seul signal qualifie.
        setSysM(2);
        setSignalsStatus(`ok:${nextSelections.length}`);
      } catch (e) {
        if (!cancelled) setSignalsStatus("error");
      }
    })();
    return () => { cancelled = true; };
  }, []);

  // Liste des signaux actifs disponibles pour ajout manuel (picker "Ajouter") —
  // les vraies cotes du dashboard, pas une ligne vierge à coter au hasard.
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const all = await fetchAllActiveSignals();
        if (!cancelled) setAvailableSignals(all);
      } catch (e) { /* le picker affichera juste "aucun signal disponible" */ }
    })();
    return () => { cancelled = true; };
  }, []);

  // Quota OddsAPI restant, temps réel — poll léger (l'endpoint interroge
  // /v4/sports côté serveur, le seul appel OddsAPI qui ne consomme pas de quota).
  useEffect(() => {
    let cancelled = false;
    const poll = async () => {
      try {
        const res = await fetch("/api/odds-quota");
        const data = await res.json();
        if (cancelled) return;
        if (!res.ok || data.error) {
          setOddsQuota({ status: "error", message: data.error || `HTTP ${res.status}` });
        } else {
          setOddsQuota({ status: "ok", remaining: data.remaining, used: data.used, checkedAt: new Date() });
        }
      } catch (e) {
        if (!cancelled) setOddsQuota({ status: "error", message: "requête impossible" });
      }
    };
    poll();
    const id = setInterval(poll, 30000);
    return () => { cancelled = true; clearInterval(id); };
  }, []);

  // Système M/N : tous les paliers de M à N sont inclus d'office (comme betbuzz)
  const sortedFolds = useMemo(() => {
    const arr = [];
    for (let k = Math.min(sysM, n); k <= n; k++) arr.push(k);
    return arr;
  }, [sysM, n]);
  const systemLabelText = systemLabel(Math.min(sysM, n), n);

  // Calcul complet
  const computed = useMemo(() => {
    const idx = selections.map((_, i) => i);
    const byFold = sortedFolds.map((k) => {
      const combos = kCombinations(idx, k).map((indices) => {
        const sels = indices.map((i) => selections[i]);
        const R = comboReturnFactor(sels);
        const maxR = comboMaxFactor(sels);
        return { k, indices, R, maxR, bucket: bucketOf(R) };
      });
      const count = combos.length;
      const mise = count * stake;
      const retour = combos.reduce((s, c) => s + c.R * stake, 0);
      return { k, combos, count, mise, retour, profit: retour - mise };
    });
    const totalLignes = byFold.reduce((s, f) => s + f.count, 0);
    const totalMise = byFold.reduce((s, f) => s + f.mise, 0);
    const totalRetour = byFold.reduce((s, f) => s + f.retour, 0);
    const totalProfit = totalRetour - totalMise;
    const maxRSystem = Math.max(1, ...byFold.flatMap((f) => f.combos.filter((c) => c.R > 1).map((c) => c.R)));
    let taxAmount = 0;
    if (taxEnabled && taxRate > 0) {
      if (taxBase === "net_system") {
        taxAmount = totalProfit > 0 ? totalProfit * (taxRate / 100) : 0;
      } else {
        for (const f of byFold) for (const c of f.combos) {
          const lineProfit = c.R * stake - stake;
          if (lineProfit > 0) taxAmount += lineProfit * (taxRate / 100);
        }
      }
    }
    const netAfterTax = totalRetour - taxAmount;
    return { byFold, totalLignes, totalMise, totalRetour, totalProfit, maxRSystem, taxAmount, netAfterTax };
  }, [selections, sortedFolds, stake, taxEnabled, taxRate, taxBase]);

  const fmt = (v) => `${v.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ${currency}`;

  const addSelection = () => {
    if (n >= 10) return;
    setSelections((s) => [...s, { id: nextId, label: "", odds: 1.9, status: "won" }]);
    setNextId((x) => x + 1);
  };
  const addFromSignal = (sig) => {
    if (n >= 10) return;
    setSelections((s) => [...s, {
      id: nextId,
      label: `${sig.match || "?"} — ${sig.selection_name || "?"}`,
      odds: Number(sig.xbet_odd) || 1.01,
      status: "won",
    }]);
    setNextId((x) => x + 1);
  };
  const removeSelection = (id) => setSelections((s) => (s.length > 1 ? s.filter((x) => x.id !== id) : s));
  const updateSelection = (id, patch) => setSelections((s) => s.map((x) => (x.id === id ? { ...x, ...patch } : x)));
  const setSelectionCount = (target) => {
    const t = Math.max(1, Math.min(10, target));
    setSelections((s) => {
      if (t === s.length) return s;
      if (t > s.length) {
        const extra = [];
        let id = nextId;
        for (let i = s.length; i < t; i++) { extra.push({ id, label: "", odds: 1.9, status: "won" }); id++; }
        setNextId(id);
        return [...s, ...extra];
      }
      return s.slice(0, t);
    });
  };

  const activeCombo = activeCell != null ? computed.byFold.find((f) => f.k === activeCell.k)?.combos[activeCell.i] : null;

  // Signaux du picker "Ajouter" pas déjà présents dans le ticket (même clé de
  // libellé que l'auto-remplissage, donc un signal ajouté puis retiré peut être repris).
  const pickableSignals = useMemo(() => {
    const used = new Set(selections.map((s) => s.label));
    return availableSignals.filter((s) => !used.has(`${s.match || "?"} — ${s.selection_name || "?"}`));
  }, [availableSignals, selections]);

  const statusLine = {
    loading: "Chargement des signaux PAIM…",
    error: "Signaux indisponibles — ticket vide, remplissage manuel possible.",
    empty: "Aucun signal ≥ 1.80 dans les 12h à venir — ticket vide, remplissage manuel possible.",
  }[signalsStatus] || `Auto-rempli depuis ${signalsStatus.split(":")[1]} signal(aux) actif(s) — fenêtre 12h, cote > 1.80, trié par edge.`;

  return (
    <div style={{ background: C.bg, minHeight: "60vh", fontFamily: SANS }} className="w-full">
      <div className="max-w-6xl mx-auto px-4 py-8 md:px-8">
        {/* Header */}
        <div className="mb-6">
          <div style={{ color: C.gold, fontFamily: MONO }} className="text-xs tracking-widest uppercase mb-1">Predator Paim · Outils</div>
          <h1 style={{ color: C.text }} className="text-2xl md:text-3xl font-semibold mb-2">Calculateur de paris système</h1>
          <p style={{ color: C.muted }} className="text-sm max-w-2xl">
            Calcule tous les paliers d'un système (Trixie, Yankee, Heinz, Goliath, etc.) et gère correctement les
            sélections nulles et les cotes asiatiques partielles.
          </p>
          <p style={{ color: C.faint, fontFamily: MONO }} className="text-xs mt-2">{statusLine}</p>
        </div>

        <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
          {/* LEFT COLUMN */}
          <div className="lg:col-span-5 space-y-5">
            {/* Ticket */}
            <Panel
              title="Sélections"
              right={
                <button onClick={() => setPickerOpen((v) => !v)} disabled={n >= 10}
                  style={{ color: n >= 10 ? C.faint : C.gold, border: `1px solid ${n >= 10 ? C.border : C.goldSoft}` }}
                  className="flex items-center gap-1 text-xs px-2 py-1 rounded-md transition">
                  <Plus size={13} /> Ajouter
                </button>
              }
            >
              {pickerOpen && n < 10 && (
                <div style={{ background: C.panel2, border: `1px solid ${C.borderSoft}`, borderRadius: 10 }} className="mb-3 p-2 max-h-56 overflow-y-auto">
                  {pickableSignals.length === 0 ? (
                    <p style={{ color: C.faint }} className="text-xs px-1.5 py-1">Aucun signal actif disponible — utilise la ligne vide ci-dessous.</p>
                  ) : (
                    pickableSignals.map((s, i) => (
                      <button key={i} onClick={() => { addFromSignal(s); setPickerOpen(false); }}
                        style={{ color: C.text }}
                        className="w-full flex items-center justify-between gap-2 text-left text-xs px-1.5 py-1.5 rounded-md hover:bg-white/5">
                        <span className="truncate">{s.match || "?"} — {s.selection_name || "?"}</span>
                        <span style={{ color: C.gold, fontFamily: MONO }} className="shrink-0">@{Number(s.xbet_odd || 0).toFixed(2)}</span>
                      </button>
                    ))
                  )}
                  <div style={{ borderTop: `1px solid ${C.border}` }} className="mt-1 pt-1">
                    <button onClick={() => { addSelection(); setPickerOpen(false); }}
                      style={{ color: C.muted }} className="w-full text-left text-xs px-1.5 py-1.5 rounded-md hover:bg-white/5">
                      + Ligne vide (saisie manuelle)
                    </button>
                  </div>
                </div>
              )}
              {n === 0 ? (
                <p style={{ color: C.faint }} className="text-xs">Aucune sélection — ajoute-en une, ou attends l'auto-remplissage.</p>
              ) : (
                <div className="space-y-2">
                  {selections.map((sel, i) => (
                    <div key={sel.id} style={{ background: C.panel2, border: `1px solid ${C.borderSoft}`, borderRadius: 10 }} className="p-2.5">
                      <div className="flex items-center gap-2 mb-2">
                        <span style={{ color: C.gold, fontFamily: MONO, background: "rgba(198,161,91,0.1)" }} className="text-xs w-6 h-6 flex items-center justify-center rounded-md shrink-0">
                          {i + 1}
                        </span>
                        <input
                          value={sel.label}
                          onChange={(e) => updateSelection(sel.id, { label: e.target.value })}
                          placeholder={`Sélection ${i + 1}`}
                          style={{ ...inputStyle, fontFamily: SANS }}
                          className="flex-1 min-w-0 text-sm rounded-md px-2 py-1.5"
                        />
                        <button onClick={() => removeSelection(sel.id)} disabled={n <= 1}
                          style={{ color: n <= 1 ? C.faint : C.loss }} className="shrink-0 p-1">
                          <Trash2 size={14} />
                        </button>
                      </div>
                      <div className="flex gap-2">
                        <div className="w-20 shrink-0">
                          <input
                            type="number" step="0.01" min="1.01" value={sel.odds}
                            onChange={(e) => updateSelection(sel.id, { odds: Math.max(1.01, parseFloat(e.target.value) || 1.01) })}
                            style={inputStyle} className="w-full text-sm rounded-md px-2 py-1.5"
                          />
                        </div>
                        <select
                          value={sel.status}
                          onChange={(e) => updateSelection(sel.id, { status: e.target.value })}
                          style={{ ...inputStyle, fontFamily: SANS }}
                          className="flex-1 min-w-0 text-sm rounded-md px-2 py-1.5"
                        >
                          {STATUS_OPTS.map((o) => <option key={o.v} value={o.v}>{o.label}</option>)}
                        </select>
                      </div>
                    </div>
                  ))}
                </div>
              )}
              {n >= 10 && <div style={{ color: C.faint }} className="text-xs mt-2">Maximum 10 sélections pour garder un affichage lisible.</div>}
            </Panel>

            {/* System config — deux dropdowns M/N, comme betbuzz */}
            <Panel title="Système">
              <div className="grid grid-cols-2 gap-3 mb-3">
                <Field label="Système (M)">
                  <select value={Math.min(sysM, n)} onChange={(e) => setSysM(Number(e.target.value))}
                    style={{ ...inputStyle, fontFamily: MONO }} className="text-sm rounded-md px-2 py-1.5">
                    {Array.from({ length: n }, (_, i) => i + 1).map((k) => <option key={k} value={k}>{k}</option>)}
                  </select>
                </Field>
                <Field label="Sélections (N)">
                  <select value={n} onChange={(e) => setSelectionCount(Number(e.target.value))}
                    style={{ ...inputStyle, fontFamily: MONO }} className="text-sm rounded-md px-2 py-1.5">
                    {Array.from({ length: 10 }, (_, i) => i + 1).map((k) => <option key={k} value={k}>{k}</option>)}
                  </select>
                </Field>
              </div>
              <div style={{ background: "rgba(198,161,91,0.1)", border: `1px solid ${C.goldSoft}`, color: C.gold, fontFamily: MONO }}
                className="text-xs px-2.5 py-1.5 rounded-md mb-4 inline-block">
                Système {Math.min(sysM, n)}/{n} = {systemLabelText}
              </div>
              <div className="grid grid-cols-2 gap-3">
                <Field label="Mise par ligne">
                  <input type="number" min="0" step="1" value={stakeInput}
                    onChange={(e) => setStakeInput(e.target.value)}
                    onBlur={() => setStakeInput(String(stake))}
                    style={inputStyle} className="text-sm rounded-md px-2 py-1.5" />
                </Field>
                <Field label="Devise">
                  <select value={currency} onChange={(e) => setCurrency(e.target.value)}
                    style={{ ...inputStyle, fontFamily: SANS }} className="text-sm rounded-md px-2 py-1.5">
                    {CURRENCIES.map((c) => <option key={c} value={c}>{c}</option>)}
                  </select>
                </Field>
              </div>
            </Panel>
          </div>

          {/* RIGHT COLUMN */}
          <div className="lg:col-span-7 space-y-5">
            {n === 0 ? (
              <Panel title="Résultats">
                <p style={{ color: C.muted }} className="text-sm">Ajoute au moins une sélection pour lancer le calcul.</p>
              </Panel>
            ) : (
              <>
                <Panel title="Résumé">
                  <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                    <SummaryCard label="Lignes" value={computed.totalLignes} />
                    <SummaryCard label="Mise totale" value={fmt(computed.totalMise)} />
                    <SummaryCard label="Retour total" value={fmt(computed.totalRetour)} />
                    <SummaryCard label="Profit net" value={fmt(computed.totalProfit)} color={computed.totalProfit >= 0 ? C.win : C.loss} />
                    <SummaryCard label="ROI" value={`${computed.totalMise > 0 ? ((computed.totalProfit / computed.totalMise) * 100).toFixed(1) : "0.0"} %`} color={computed.totalProfit >= 0 ? C.win : C.loss} />
                    {taxEnabled && <SummaryCard label="Retenue fiscale" value={`− ${fmt(computed.taxAmount)}`} color={C.partial} sub={`${taxRate}% · ${taxBase === "net_system" ? "profit net" : "par ligne"}`} />}
                  </div>
                  {taxEnabled && (
                    <div style={{ borderTop: `1px solid ${C.borderSoft}` }} className="mt-3 pt-3 flex items-center justify-between">
                      <span style={{ color: C.muted }} className="text-xs">Net perçu après retenue</span>
                      <span style={{ color: C.text, fontFamily: MONO }} className="text-base font-semibold">{fmt(computed.netAfterTax)}</span>
                    </div>
                  )}
                </Panel>

                <Panel title="Détail par palier & combinaisons">
                  <div className="space-y-3">
                    {computed.byFold.map((f) => (
                      <div key={f.k} style={{ background: C.panel2, border: `1px solid ${C.borderSoft}`, borderRadius: 10 }} className="p-3">
                        <div className="flex items-center justify-between mb-2">
                          <span style={{ color: C.text, fontFamily: SANS }} className="text-sm font-medium">
                            {foldName(f.k)} <span style={{ color: C.faint }} className="font-normal">· {f.count} ligne{f.count > 1 ? "s" : ""}</span>
                          </span>
                          <span style={{ color: f.profit >= 0 ? C.win : C.loss, fontFamily: MONO }} className="text-sm font-semibold">
                            {f.profit >= 0 ? "+" : ""}{fmt(f.profit)}
                          </span>
                        </div>
                        <div className="flex flex-wrap gap-1.5">
                          {f.combos.map((c, i) => {
                            const isActive = activeCell && activeCell.k === f.k && activeCell.i === i;
                            return (
                              <button key={i} onClick={() => setActiveCell(isActive ? null : { k: f.k, i })}
                                style={{
                                  background: isActive ? bucketColor[c.bucket] : `${bucketColor[c.bucket]}22`,
                                  border: `1px solid ${bucketColor[c.bucket]}`,
                                  color: isActive ? C.bg : bucketColor[c.bucket],
                                  fontFamily: MONO,
                                }}
                                className="text-xs px-2 py-1 rounded-md transition">
                                {c.indices.map((idx) => idx + 1).join("·")}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    ))}
                  </div>

                  {activeCombo && (
                    <div style={{ background: C.panel2, border: `1px solid ${C.gold}`, borderRadius: 10 }} className="p-3 mt-3">
                      <div style={{ color: C.gold, fontFamily: SANS }} className="text-xs font-semibold uppercase tracking-wide mb-2">
                        Combinaison {activeCell.k}-fold — {activeCombo.indices.map((i) => i + 1).join(" · ")}
                      </div>
                      <div className="space-y-1 mb-2">
                        {activeCombo.indices.map((idx) => {
                          const sel = selections[idx];
                          return (
                            <div key={idx} className="flex items-center justify-between text-xs">
                              <span style={{ color: C.muted }}>{sel.label || `Sélection ${idx + 1}`}</span>
                              <span style={{ color: C.faint, fontFamily: MONO }}>
                                @{sel.odds.toFixed(2)} · {STATUS_OPTS.find((o) => o.v === sel.status)?.label}
                              </span>
                            </div>
                          );
                        })}
                      </div>
                      <div className="flex items-center justify-between text-sm" style={{ fontFamily: MONO }}>
                        <span style={{ color: C.muted }}>Facteur de retour R</span>
                        <span style={{ color: bucketColor[activeCombo.bucket], fontWeight: 600 }}>{activeCombo.R.toFixed(3)}×</span>
                      </div>
                    </div>
                  )}
                </Panel>
              </>
            )}
          </div>
        </div>

        {/* Quota OddsAPI — temps réel, pas de coût de quota (endpoint /v4/sports) */}
        <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 12 }} className="mt-5 p-3 flex items-center justify-between flex-wrap gap-2">
          <span style={{ color: C.muted, fontFamily: SANS }} className="text-xs uppercase tracking-wide">Quota OddsAPI</span>
          {oddsQuota.status === "loading" && (
            <span style={{ color: C.faint, fontFamily: MONO }} className="text-xs">chargement…</span>
          )}
          {oddsQuota.status === "error" && (
            <span style={{ color: C.loss, fontFamily: MONO }} className="text-xs">indisponible — {oddsQuota.message}</span>
          )}
          {oddsQuota.status === "ok" && (() => {
            const total = oddsQuota.used != null ? oddsQuota.remaining + oddsQuota.used : null;
            const pct = total ? Math.max(0, Math.min(100, (oddsQuota.remaining / total) * 100)) : null;
            const color = pct != null
              ? (pct < 10 ? C.loss : pct < 25 ? C.partial : C.win)
              : (oddsQuota.remaining < 500 ? C.loss : oddsQuota.remaining < 2000 ? C.partial : C.win);
            return (
              <div className="flex items-center gap-3 flex-wrap">
                {pct != null && (
                  <div style={{ width: 90, height: 6, background: C.panel2, borderRadius: 4, overflow: "hidden" }}>
                    <div style={{ width: `${pct}%`, height: "100%", background: color, transition: "width 0.3s" }} />
                  </div>
                )}
                <span style={{ color, fontFamily: MONO, fontWeight: 600 }} className="text-xs">
                  {oddsQuota.remaining ?? "?"} restantes{pct != null ? ` (${pct.toFixed(1)}%)` : ""}
                </span>
                {oddsQuota.used != null && (
                  <span style={{ color: C.faint, fontFamily: MONO }} className="text-xs">· {oddsQuota.used} utilisées</span>
                )}
                {oddsQuota.checkedAt && (
                  <span style={{ color: C.faint, fontFamily: MONO }} className="text-xs">
                    · vérifié {oddsQuota.checkedAt.toLocaleTimeString("fr-FR", { hour12: false })}
                  </span>
                )}
              </div>
            );
          })()}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("sbc-root")).render(<SystemBetCalculator />);
{% endraw %}
</script>
</body>
</html>
