<script type="text/babel">
{% raw %}
const { useState, useMemo, useEffect } = React;

/* ---------------------------------------------------------------

   none, so these are hand-drawn equivalents at the same call sites)
--------------------------------------------------------------- */

}
const Plus        = ({ size }) => <Icon size={size}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Icon>;
const Trash2       = ({ size }) => <Icon size={size}><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></Icon>;

/* ---------------------------------------------------------------
   TOKENS — palette "carnet de paris quantitatif"
--------------------------------------------------------------- */
const C = {
  bg: "#0A0C10",
  panel: "#12151C",
  panel2: "#191D27",
  border: "#262B38",
  borderSoft: "#1E222D",
  text: "#ECEFF4",
  muted: "#8A93A6",
  faint: "#5C6478",
  gold: "#C6A15B",
  goldSoft: "#8A7240",
  win: "#33C481",
  loss: "#E5566B",
  voidC: "#7C8798",
  partial: "#E3A23C",
};

const SANS = '"Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif';
const MONO = 'ui-monospace, "IBM Plex Mono", "SF Mono", Menlo, Consolas, monospace';

const FOLD_NAMES = { 1: "Simple", 2: "Double", 3: "Trio", 4: "Quadruple", 5: "Quintuple", 6: "Sextuple", 7: "Septuple", 8: "Octuple", 9: "Nonuple", 10: "Décuple" };
const foldName = (k) => FOLD_NAMES[k] || `${k}-fold`;

const STATUS_OPTS = [
  { v: "won", label: "Gagné" },
  { v: "lost", label: "Perdu" },
  { v: "void", label: "Nul (remboursé)" },
  { v: "won_void", label: "Gagné / Nul (cote asiatique partielle)" },
  { v: "lost_void", label: "Perdu / Nul (cote asiatique partielle)" },
];

const CURRENCIES = ["XOF", "CHF", "EUR", "USD"];

const NAMED_SYSTEMS = {
  "1-1": "Simple", "2-2": "Double", "3-3": "Trio (Treble)",
  "1-3": "Patent", "2-3": "Trixie",
  "1-4": "Lucky 15", "2-4": "Yankee",
  "1-5": "Lucky 31", "2-5": "Canadian / Super Yankee",
  "1-6": "Lucky 63", "2-6": "Heinz",
  "1-7": "Lucky 127", "2-7": "Super Heinz",
  "1-8": "Système complet (8)", "2-8": "Goliath",
};
// Format standard "Système M/N" (identique à betbuzz) : toutes les combinaisons
// de M à N sélections sont jouées d'un coup. Les noms commerciaux (Trixie,
// Yankee, Heinz...) ne sont que des alias de plages M-N précises.
function systemLabel(m, n) {
  const key = `${m}-${n}`;
  if (NAMED_SYSTEMS[key]) return NAMED_SYSTEMS[key];
  if (m === n) return "Accumulateur";
  return `Système personnalisé (${m} à ${n})`;
}
// Nombre de lignes d'un palier k sur n (C(n, k)) — pour dériver la mise par
// ligne d'une mise TOTALE sans énumérer les combinaisons.
function binom(n, k) {
  if (k < 0 || k > n) return 0;
  let r = 1;
  for (let i = 1; i <= k; i++) r = (r * (n - k + i)) / i;
  return Math.round(r);
}

/* ---------------------------------------------------------------
   MATH — combinatoire, gestion des nuls / cotes asiatiques
   (moteur inchangé — ne pas modifier ces fonctions)
--------------------------------------------------------------- */
function kCombinations(arr, k) {
  const out = [];
  const combo = [];
  (function bt(start) {
    if (combo.length === k) { out.push([...combo]); return; }
    for (let i = start; i < arr.length; i++) { combo.push(arr[i]); bt(i + 1); combo.pop(); }
  })(0);
  return out;
}

// Chaque statut se décompose en une liste de branches [poids, multiplicateur].
// C'est ce qui permet de traiter proprement les cotes asiatiques partielles
// (Gagné/Nul, Perdu/Nul) au lieu de les arrondir grossièrement.
function legBranches(sel) {
  const o = sel.odds;
  switch (sel.status) {
    case "won": return [[1, o]];
    case "lost": return [[1, 0]];
    case "void": return [[1, 1]];
    case "won_void": return [[0.5, o], [0.5, 1]];
    case "lost_void": return [[0.5, 0], [0.5, 1]];
    default: return [[1, 1]];
  }
}

// Facteur de retour attendu R d'une combinaison : produit croisé des branches
// de chaque sélection. R=0 -> perdue, R=1 -> remboursée, 0<R<1 -> perte partielle,
// R>1 -> gagnante. Un "Nul" a un multiplicateur de 1, ce qui réduit automatiquement
// la combinaison au palier inférieur sans fausser le calcul.
function comboReturnFactor(sels) {
  let acc = [[1, 1]];
  for (const sel of sels) {
    const branches = legBranches(sel);
    const next = [];
    for (const [aw, am] of acc) for (const [bw, bm] of branches) next.push([aw * bw, am * bm]);
    acc = next;
  }
  return acc.reduce((s, [w, m]) => s + w * m, 0);
}

function comboMaxFactor(sels) {
  return sels.reduce((p, sel) => {
    if (sel.status === "lost") return 0;
    if (sel.status === "won" || sel.status === "won_void") return p * sel.odds;
    return p;
  }, 1);
}

function bucketOf(R) {
  if (R === 0) return "loss";
  if (R === 1) return "void";
  if (R > 0 && R < 1) return "partial";
  return "win";
}
const bucketColor = { loss: C.loss, void: C.voidC, partial: C.partial, win: C.win };

/* ---------------------------------------------------------------
   SCÉNARIOS — dérivés du moteur (fonctions pures, sans UI)
   Ce que le calculateur ne disait pas : AVANT de miser, que rend le
   système si k sélections sur N sont gagnantes ? Ce sont des RETOURS
   CONDITIONNELS (« si k gagnent, alors… »), jamais des probabilités ni
   un taux de réussite (règle 7 de CLAUDE.md). Tout passe par
   kCombinations et comboReturnFactor du bloc MATH, sur des sélections
   simulées (k statuts "won", N-k "lost") — le moteur reste inchangé.
--------------------------------------------------------------- */

// Retour total d'un système M/N pour un jeu de sélections données, avec la
// même règle que `computed` : tous les paliers de min(m, N) à N, chaque
// combinaison mise `stake`. Rend { mise, retour }.
function systemReturn(sels, m, stake) {
  const n = sels.length;
  const idx = sels.map((_, i) => i);
  let mise = 0;
  let retour = 0;
  for (let j = Math.max(1, Math.min(m, n)); j <= n; j++) {
    for (const indices of kCombinations(idx, j)) {
      mise += stake;
      retour += comboReturnFactor(indices.map((i) => sels[i])) * stake;
    }
  }
  return { mise, retour };
}

// Pour k = 0..N sélections gagnantes : pire cas (les k cotes les plus BASSES
// gagnent), meilleur cas (les k plus HAUTES), sur le système M/N et la mise
// courants. Le pire cas est bien minimal : chaque terme du retour est un
// produit de cotes, et prendre les k plus petites minimise chaque terme.
// Les statuts saisis sont ignorés — seules les cotes comptent.
// Rend [{ k, mise, worst, best, profitWorst, profitBest }], [] si N = 0.
function scenariosByWinners(selections, m, stake) {
  const n = selections.length;
  if (n === 0) return [];
  const asc = selections.map((s) => Number(s.odds) || 1.01).sort((a, b) => a - b);
  const desc = [...asc].reverse();
  const simulate = (winningOdds, losingOdds) =>
    [...winningOdds.map((o) => ({ odds: o, status: "won" })),
     ...losingOdds.map((o) => ({ odds: o, status: "lost" }))];
  const out = [];
  for (let k = 0; k <= n; k++) {
    const worstSet = simulate(asc.slice(0, k), asc.slice(k));
    const bestSet = simulate(desc.slice(0, k), desc.slice(k));
    const w = systemReturn(worstSet, m, stake);
    const b = systemReturn(bestSet, m, stake);
    out.push({ k, mise: w.mise, worst: w.retour, best: b.retour,
               profitWorst: w.retour - w.mise, profitBest: b.retour - w.mise });
  }
  return out;
}

// Point mort : plus petit k dont le retour PIRE CAS couvre la mise totale.
// Rend { k, tooShort } — tooShort vaut true quand il faut TOUTES les
// sélections (k = N) : N-1 bons ne couvrent pas la mise, les cotes sont trop
// courtes pour un système. Rend null si aucun k ne couvre la mise.
function breakEven(scenarios) {
  if (!scenarios || scenarios.length === 0) return null;
  const n = scenarios.length - 1;
  const hit = scenarios.find((sc) => sc.worst >= sc.mise - 1e-9);
  if (!hit) return null;
  return { k: hit.k, tooShort: hit.k === n };
}

// Marge composée par palier, à titre indicatif : (1 + m)^k − 1, m en
// fraction (0.05 pour 5 %). Ce n'est pas une probabilité : c'est ce que
// vaudrait une marge m répétée k fois si elle était réelle à chaque jambe.
function compoundMargin(m, k) {
  const marge = Number(m) || 0;
  return Math.pow(1 + marge, Math.max(0, k)) - 1;
}

// Scénarios COMPLETS : simples + combiné + système ADDITIONNÉS, pour
// k = 0..N sélections gagnantes. Pire et meilleur cas EXACTS : toutes les
// parties de k gagnantes sont parcourues (kCombinations). Le retour de
// chaque combinaison du système vient de comboReturnFactor sur des jambes
// « won », évalué UNE fois par combinaison ; une combinaison compte ensuite
// dans un scénario si toutes ses jambes y sont gagnantes (masque de bits) —
// même résultat qu'un appel de systemReturn par scénario, sans le coût
// 2^N × 2^N qui gelait la page à N = 10. Retours conditionnels, jamais des
// probabilités (règle 7). simpleStakes : mise par sélection (index aligné) ;
// flags : { sys, simples, combo }.
// Rend [{ k, mise, worst, best }] ; worst/best = { total, sys, simples,
// combo, indices } où indices sont les gagnantes du cas. [] si N = 0.
function scenariosComplets(selections, m, lineStake, simpleStakes, comboStake, flags) {
  const n = selections.length;
  if (n === 0) return [];
  const idx = selections.map((_, i) => i);
  const won = idx.map((i) => ({ odds: Number(selections[i].odds) || 1.01, status: "won" }));
  const maskOf = (ind) => ind.reduce((acc, i) => acc | (1 << i), 0);
  const sysCombos = [];
  if (flags.sys) {
    for (let j = Math.max(1, Math.min(m, n)); j <= n; j++) {
      for (const ind of kCombinations(idx, j)) {
        sysCombos.push({ mask: maskOf(ind), R: comboReturnFactor(ind.map((i) => won[i])) });
      }
    }
  }
  const simpleR = idx.map((i) => comboReturnFactor([won[i]]));
  const comboR = comboReturnFactor(won);
  const mise = sysCombos.length * lineStake
    + (flags.simples ? simpleStakes.reduce((s, v) => s + (Number(v) || 0), 0) : 0)
    + (flags.combo ? comboStake : 0);
  const out = [];
  for (let k = 0; k <= n; k++) {
    let worst = null;
    let best = null;
    for (const win of kCombinations(idx, k)) {
      const mask = maskOf(win);
      let sys = 0;
      for (const c of sysCombos) if ((c.mask & mask) === c.mask) sys += c.R * lineStake;
      let simples = 0;
      if (flags.simples) for (const i of win) simples += simpleR[i] * (Number(simpleStakes[i]) || 0);
      const combo = flags.combo && k === n ? comboR * comboStake : 0;
      const r = { total: sys + simples + combo, sys, simples, combo, indices: win };
      if (!worst || r.total < worst.total - 1e-9) worst = r;
      if (!best || r.total > best.total + 1e-9) best = r;
    }
    out.push({ k, mise, worst, best });
  }
  return out;
}

// Point mort GLOBAL : plus petit k dont le pire cas complet couvre la mise
// engagée, toutes sections actives confondues. Même contrat que breakEven.
function breakEvenComplet(scen) {
  if (!scen || scen.length === 0) return null;
  const hit = scen.find((sc) => sc.worst.total >= sc.mise - 1e-9);
  if (!hit) return null;
  return { k: hit.k, tooShort: hit.k === scen.length - 1 };
}

/* ---------------------------------------------------------------
   UI ATOMS
--------------------------------------------------------------- */
function Panel({ title, children, right }) {

    <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 12 }} className="p-4 md:p-5">

}
const inputStyle = { background: C.panel2, border: `1px solid ${C.border}`, color: C.text, fontFamily: MONO };
function SummaryCard({ label, value, sub, color }) {
  return (
    <div style={{ background: C.panel2, border: `1px solid ${C.borderSoft}`, borderRadius: 10 }} className="px-4 py-3">
      <div style={{ color: C.muted, fontFamily: SANS }} className="text-xs mb-1">{label}</div>

      {sub && <div style={{ color: C.faint, fontFamily: SANS }} className="text-xs mt-0.5">{sub}</div>}

// Interrupteur « Dans le total » : chaque section (simples, combiné,
// système) entre ou sort de l'addition finale sans perdre ses saisies.
function Toggle({ on, onChange, label }) {
  return (
    <button type="button" role="switch" aria-checked={on} onClick={() => onChange(!on)}
      style={{ color: on ? C.win : C.faint, border: `1px solid ${on ? C.win : C.border}`,
               background: on ? "rgba(51,196,129,0.10)" : "transparent", fontFamily: SANS, cursor: "pointer" }}
      className="flex items-center gap-1.5 text-xs px-2 py-1 rounded-md transition">
      <span style={{ width: 22, height: 12, borderRadius: 6, background: on ? C.win : C.border, position: "relative", display: "inline-block" }}>
        <span style={{ position: "absolute", top: 2, left: on ? 12 : 2, width: 8, height: 8, borderRadius: 4, background: C.bg, transition: "left .15s" }}></span>
      </span>
      {label}
    </button>
  );
}
// Sélecteur à deux positions (mode de mise du système).
function Segmented({ value, options, onChange }) {
  return (
    <div style={{ background: C.panel2, border: `1px solid ${C.border}`, borderRadius: 8 }} className="flex p-0.5">
      {options.map((o) => {
        const active = o.v === value;
        return (
          <button key={o.v} type="button" onClick={() => onChange(o.v)}
            style={{ background: active ? C.gold : "transparent", color: active ? C.bg : C.muted, fontFamily: SANS, borderRadius: 6, border: 0, cursor: "pointer" }}
            className="flex-1 text-xs font-medium px-2 py-1.5 transition">
            {o.label}
          </button>
        );
      })}
    </div>
  );
}
// Ligne libellé / montant, utilisée pour le bilan de chaque section.
function StatRow({ label, value, color, strong }) {
  return (
    <div className="flex items-center justify-between gap-3">
      <span style={{ color: C.muted, fontFamily: SANS }} className="text-xs">{label}</span>
      <span style={{ color: color || C.text, fontFamily: MONO }} className={strong ? "text-base font-semibold" : "text-sm"}>{value}</span>

}
// Détail d'un cas (pire ou meilleur) d'un scénario complet : quelles
// sélections sont bonnes, et ce que rend chaque section.
function ScenarioDetail({ titre, r, selections, flags, fmtN }) {
  const parts = [];
  if (flags.simples) parts.push(`Simples ${fmtN(r.simples)}`);
  if (flags.combo) parts.push(`Combiné ${fmtN(r.combo)}`);
  if (flags.sys) parts.push(`Système ${fmtN(r.sys)}`);
  return (
    <div className="text-xs">
      <span style={{ color: C.muted, fontFamily: SANS }}>{titre} — bonnes : </span>
      <span style={{ color: C.text }}>
        {r.indices.length === 0 ? "aucune" : r.indices.map((i) => `${i + 1} @${selections[i].odds.toFixed(2)}`).join(" · ")}
      </span>
      <div style={{ color: C.faint }} className="mt-0.5">{parts.join(" + ")} = {fmtN(r.total)}</div>
    </div>
  );
}

/* ---------------------------------------------------------------
   AUTO-FILL — signaux PAIM actifs -> ticket système
--------------------------------------------------------------- */

// Un seul signal par match est conservé (le meilleur edge) : deux jambes du
// même match sont corrélées et invalident le calcul de combinaison
// indépendant — partagé par l'auto-remplissage et le picker manuel ci-dessous.
function dedupeBestPerMatch(list) {
  const bestPerMatch = new Map();
  for (const s of list) {
    const key = s.match_id || s.match || "";
    const prev = bestPerMatch.get(key);
    if (!prev || (s.edge_pct || 0) > (prev.edge_pct || 0)) bestPerMatch.set(key, s);
  }
  return [...bestPerMatch.values()].sort((a, b) => {
    const edgeDiff = (b.edge_pct || 0) - (a.edge_pct || 0);
    if (Math.abs(edgeDiff) > 1e-9) return edgeDiff;
    return (b.xbet_odd || 0) - (a.xbet_odd || 0);
  });
}

// Règles de l'auto-remplissage : fenêtre 12h à venir, cote > 1.80, exclut
// réglé/annulé/expiré (déjà exclus par /api/signals qui ne renvoie que
// status=active), trié par edge_pct desc puis cote desc, plafond 8 (Goliath).
async function fetchQualifyingSignals() {
  const res = await fetch("/api/signals");
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  if (!Array.isArray(data)) throw new Error("unexpected /api/signals response");

  const now = Date.now();
  const windowEnd = now + 12 * 60 * 60 * 1000;

  const qualifying = data.filter((s) => {
    if (!s.match_time) return false;
    const t = Date.parse(s.match_time);
    if (Number.isNaN(t) || t < now || t > windowEnd) return false;
    const odds = Number(s.xbet_odd);
    return odds > 1.8;
  });

  return dedupeBestPerMatch(qualifying).slice(0, 8);
}

// Signaux actifs bruts (ceux du dashboard), pour le picker manuel "Ajouter" —
// pas de fenêtre 12h ni de plancher de cote ici : contrairement à
// l'auto-remplissage, l'opérateur doit pouvoir composer son ticket avec
// n'importe quel signal actif, pas seulement ceux qui qualifient pour l'auto-fill.
async function fetchAllActiveSignals() {
  const res = await fetch("/api/signals");
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  if (!Array.isArray(data)) throw new Error("unexpected /api/signals response");
  return dedupeBestPerMatch(data);
}

/* ---------------------------------------------------------------
   MAIN COMPONENT
--------------------------------------------------------------- */
function SystemBetCalculator() {
  const [selections, setSelections] = useState([]);
  const [nextId, setNextId] = useState(1);
  const [sysM, setSysM] = useState(2);
  // Champ texte brut pour permettre de vider/retaper librement sans qu'un
  // "0" de repli ne se réinsère à chaque frappe (bug remonté : "0500" au lieu
  // de "500"). La valeur numérique clampée n'est dérivée qu'au moment du calcul.
  const [stakeInput, setStakeInput] = useState("1000");
  const lineStakeInput = Math.max(0, parseFloat(stakeInput) || 0);
  const [currency, setCurrency] = useState("XOF");
  // Mode de mise du système : « par ligne » (saisie directe) ou « totale »
  // (répartie à parts égales sur toutes les lignes). La mise par ligne
  // effective `stake` est dérivée plus bas, une fois le nombre de lignes connu.
  const [stakeMode, setStakeMode] = useState("line"); // 'line' | 'total'
  const [totalStakeInput, setTotalStakeInput] = useState("");
  // Sections additionnées dans le total : chacune entre ou sort de l'addition.
  const [sysOn, setSysOn] = useState(true);
  const [simplesOn, setSimplesOn] = useState(true);
  const [comboOn, setComboOn] = useState(true);
  // Mises individuelles : une mise par défaut commune, surchargée ligne par
  // ligne (id -> texte brut ; champ vidé = retour à la mise par défaut).
  const [simpleDefaultInput, setSimpleDefaultInput] = useState("1000");
  const [simpleStakes, setSimpleStakes] = useState({});
  const [comboStakeInput, setComboStakeInput] = useState("1000");
  const [openScenario, setOpenScenario] = useState(null);
  // Fiscalité masquée sur cette page (demande opérateur) mais gardée active
  // "en sourdine" : la retenue continue d'être calculée dans `computed`
  // ci-dessous avec les mêmes réglages par défaut, simplement plus affichée.
  const taxEnabled = true;
  const taxRate = 20;
  const taxBase = "net_system"; // 'net_system' | 'per_line'
  const [activeCell, setActiveCell] = useState(null);
  // Marge par jambe pour la note de marge composée (indicatif). Champ texte
  // brut, même raison que la mise : pouvoir vider et retaper sans repli.
  const [marginInput, setMarginInput] = useState("5");
  const marginPct = Math.max(0, Math.min(100, parseFloat(marginInput) || 0));
  const [signalsStatus, setSignalsStatus] = useState("loading"); // loading | error | empty | `ok:N`
  const [availableSignals, setAvailableSignals] = useState([]);
  const [pickerOpen, setPickerOpen] = useState(false);

  const n = selections.length;

  // Clamp le niveau minimum M quand le nombre de sélections N change
  useEffect(() => {
    setSysM((m) => Math.min(Math.max(m, 1), Math.max(n, 1)));
  }, [n]);

  // Auto-remplissage depuis les signaux PAIM actifs, au chargement de la page.
  useEffect(() => {
    let cancelled = false;
    (async () => {
      setSignalsStatus("loading");
      try {
        const picked = await fetchQualifyingSignals();
        if (cancelled) return;
        if (picked.length === 0) {
          setSignalsStatus("empty");
          return;
        }
        const nextSelections = picked.map((s, i) => ({
          id: i + 1,
          label: `${s.match || "?"} — ${s.selection_name || "?"}`,
          odds: Number(s.xbet_odd) || 1.01,
          status: "won",
        }));
        setSelections(nextSelections);
        setNextId(nextSelections.length + 1);
        // Système M/N canonique (Trixie/Yankee/Canadian/Heinz/Super Heinz/
        // Goliath) démarre toujours à M=2 (pas de simples) ; l'effet de clamp
        // ci-dessus le réduit tout seul à 1 si jamais un seul signal qualifie.
        setSysM(2);
        setSignalsStatus(`ok:${nextSelections.length}`);
      } catch (e) {
        if (!cancelled) setSignalsStatus("error");
      }
    })();
    return () => { cancelled = true; };
  }, []);

  // Liste des signaux actifs disponibles pour ajout manuel (picker "Ajouter") —
  // les vraies cotes du dashboard, pas une ligne vierge à coter au hasard.
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const all = await fetchAllActiveSignals();
        if (!cancelled) setAvailableSignals(all);
      } catch (e) { /* le picker affichera juste "aucun signal disponible" */ }
    })();
    return () => { cancelled = true; };
  }, []);


  // Système M/N : tous les paliers de M à N sont inclus d'office (comme betbuzz)
  const sortedFolds = useMemo(() => {
    const arr = [];
    for (let k = Math.min(sysM, n); k <= n; k++) arr.push(k);
    return arr;
  }, [sysM, n]);
  const systemLabelText = systemLabel(Math.min(sysM, n), n);
  const totalLignes = useMemo(() => sortedFolds.reduce((s, k) => s + binom(n, k), 0), [sortedFolds, n]);
  const totalStakeWanted = Math.max(0, parseFloat(totalStakeInput) || 0);
  // Mise par ligne EFFECTIVE du système : saisie telle quelle, ou mise totale
  // divisée par le nombre de lignes. Tout le calcul système passe par elle.
  const stake = stakeMode === "total" ? (totalLignes > 0 ? totalStakeWanted / totalLignes : 0) : lineStakeInput;

  // Calcul complet
  const computed = useMemo(() => {
    const idx = selections.map((_, i) => i);
    const byFold = sortedFolds.map((k) => {
      const combos = kCombinations(idx, k).map((indices) => {
        const sels = indices.map((i) => selections[i]);
        const R = comboReturnFactor(sels);
        const maxR = comboMaxFactor(sels);
        return { k, indices, R, maxR, bucket: bucketOf(R) };
      });
      const count = combos.length;
      const mise = count * stake;
      const retour = combos.reduce((s, c) => s + c.R * stake, 0);
      return { k, combos, count, mise, retour, profit: retour - mise };
    });
    const totalLignes = byFold.reduce((s, f) => s + f.count, 0);
    const totalMise = byFold.reduce((s, f) => s + f.mise, 0);
    const totalRetour = byFold.reduce((s, f) => s + f.retour, 0);
    const totalProfit = totalRetour - totalMise;
    const maxRSystem = Math.max(1, ...byFold.flatMap((f) => f.combos.filter((c) => c.R > 1).map((c) => c.R)));
    let taxAmount = 0;
    if (taxEnabled && taxRate > 0) {
      if (taxBase === "net_system") {
        taxAmount = totalProfit > 0 ? totalProfit * (taxRate / 100) : 0;
      } else {
        for (const f of byFold) for (const c of f.combos) {
          const lineProfit = c.R * stake - stake;
          if (lineProfit > 0) taxAmount += lineProfit * (taxRate / 100);
        }
      }
    }
    const netAfterTax = totalRetour - taxAmount;
    return { byFold, totalLignes, totalMise, totalRetour, totalProfit, maxRSystem, taxAmount, netAfterTax };
  }, [selections, sortedFolds, stake, taxEnabled, taxRate, taxBase]);

  // Scénarios « si k gagnent » : retours CONDITIONNELS sur le système M/N et
  // la mise courants — jamais des probabilités (règle 7 de CLAUDE.md).
  const scenarios = useMemo(() => scenariosByWinners(selections, Math.min(sysM, n), stake),
                            [selections, sysM, n, stake]);
  const pointMort = useMemo(() => breakEven(scenarios), [scenarios]);

  const fmt = (v) => `${v.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ${currency}`;
  const signed = (v) => `${v >= 0 ? "+" : ""}${fmt(v)}`;
  // Format compact (sans devise, décimales seulement si besoin) pour les
  // tableaux étroits : la devise est rappelée une fois sous le tableau.
  const fmtN = (v) => v.toLocaleString("fr-FR", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  const signedN = (v) => `${v >= 0 ? "+" : ""}${fmtN(v)}`;
  const round2 = (v) => Math.round(v * 100) / 100;

  // Mises individuelles : chaque sélection jouée seule. Le retour passe par
  // comboReturnFactor sur une jambe, donc les statuts (nul, asiatique
  // partiel) sont traités exactement comme dans le système.
  const simpleStakeOf = (sel) => {
    const raw = simpleStakes[sel.id];
    const v = raw === undefined || raw === "" ? simpleDefaultInput : raw;
    return Math.max(0, parseFloat(v) || 0);
  };
  const simples = useMemo(() => {
    const rows = selections.map((sel, i) => {
      const st = simpleStakeOf(sel);
      const R = comboReturnFactor([sel]);
      const brut = R * st;
      return { sel, i, stake: st, R, brut, net: brut - st, bucket: bucketOf(R) };
    });
    const mise = rows.reduce((s, r) => s + r.stake, 0);
    const brut = rows.reduce((s, r) => s + r.brut, 0);
    return { rows, mise, brut, net: brut - mise };
  }, [selections, simpleStakes, simpleDefaultInput]);

  // Combiné N/N : toutes les sélections sur une ligne, cote totale = produit.
  const comboStake = Math.max(0, parseFloat(comboStakeInput) || 0);
  const combine = useMemo(() => {
    const cote = selections.reduce((p, s) => p * (Number(s.odds) || 1.01), 1);
    const R = comboReturnFactor(selections);
    const brut = R * comboStake;
    return { cote, R, stake: comboStake, brut, net: brut - comboStake, bucket: bucketOf(R) };
  }, [selections, comboStake]);

  // Total : addition des sections ACTIVES. Le combiné n'existe qu'à partir
  // de 2 sélections (à 1, c'est un simple).
  const sectionFlags = { sys: sysOn && n > 0, simples: simplesOn && n > 0, combo: comboOn && n >= 2 };
  const sections = [
    { key: "simples", label: `${n} simple${n > 1 ? "s" : ""}`, on: sectionFlags.simples, mise: simples.mise, brut: simples.brut },
    ...(n >= 2 ? [{ key: "combo", label: `Combiné ${n}/${n}`, on: sectionFlags.combo, mise: combine.stake, brut: combine.brut }] : []),
    { key: "sys", label: `Système ${Math.min(sysM, n)}/${n}`, on: sectionFlags.sys, mise: computed.totalMise, brut: computed.totalRetour },
  ].map((sec) => ({ ...sec, net: sec.brut - sec.mise }));
  const grand = (() => {
    const act = sections.filter((sec) => sec.on);
    const mise = act.reduce((s, sec) => s + sec.mise, 0);
    const brut = act.reduce((s, sec) => s + sec.brut, 0);
    return { mise, brut, net: brut - mise, roi: mise > 0 ? ((brut - mise) / mise) * 100 : 0 };
  })();
  // Un système M/N contient déjà le combiné N/N, et à M = 1 les N simples :
  // les additionner n'est pas faux, mais c'est miser deux fois — on le dit.
  const inclus = [];
  if (sectionFlags.sys && sectionFlags.simples && Math.min(sysM, n) === 1) inclus.push(`les ${n} simples`);
  if (sectionFlags.sys && sectionFlags.combo) inclus.push(`le combiné ${n}/${n}`);
  const doublon = inclus.length > 0 ? `Le système ${Math.min(sysM, n)}/${n} contient déjà ${inclus.join(" et ")}` : null;

  // Scénarios complets : pire / meilleur cas EXACTS toutes sections actives
  // confondues — retours conditionnels, jamais des probabilités (règle 7).
  const scenariosTotal = useMemo(() => scenariosComplets(
    selections, Math.min(sysM, n), stake, simples.rows.map((r) => r.stake), combine.stake, sectionFlags),
    [selections, sysM, n, stake, simples, combine, sectionFlags.sys, sectionFlags.simples, sectionFlags.combo]);
  const pointMortTotal = useMemo(() => breakEvenComplet(scenariosTotal), [scenariosTotal]);
  const verdictOf = (sc) => {
    if (sc.worst.total > sc.mise + 1e-9) return { t: "Gagnant", c: C.win };
    if (sc.worst.total >= sc.mise - 1e-9) return { t: "Couvert", c: C.gold };
    if (sc.best.total >= sc.mise - 1e-9) return { t: "Selon lesquelles", c: C.partial };
    return { t: "Perdant", c: C.loss };
  };

  const addSelection = () => {
    if (n >= 10) return;
    setSelections((s) => [...s, { id: nextId, label: "", odds: 1.9, status: "won" }]);
    setNextId((x) => x + 1);
  };
  const addFromSignal = (sig) => {
    if (n >= 10) return;
    setSelections((s) => [...s, {
      id: nextId,
      label: `${sig.match || "?"} — ${sig.selection_name || "?"}`,
      odds: Number(sig.xbet_odd) || 1.01,
      status: "won",
    }]);
    setNextId((x) => x + 1);
  };
  // Autorise la suppression jusqu'à 0 : le ticket vide est un état géré
  // (messages "Aucune sélection" + panneau Système neutralisé). L'ancienne
  // garde s.length > 1 laissait un élément ineffaçable — remonté par l'opérateur.
  const removeSelection = (id) => setSelections((s) => s.filter((x) => x.id !== id));
  const clearAll = () => { setSelections([]); setPickerOpen(false); };
  const updateSelection = (id, patch) => setSelections((s) => s.map((x) => (x.id === id ? { ...x, ...patch } : x)));
  const setSimpleStake = (id, raw) => setSimpleStakes((m) => {
    const next = { ...m };
    if (raw === "") delete next[id]; else next[id] = raw;
    return next;
  });
  // Bascule par ligne <-> totale en conservant la mise engagée courante, pour
  // que le changement de mode ne change pas le ticket.
  const switchStakeMode = (mode) => {
    if (mode === stakeMode) return;
    if (mode === "total") setTotalStakeInput(String(round2(lineStakeInput * totalLignes)));
    else setStakeInput(String(round2(stake)));
    setStakeMode(mode);
  };
  const setSelectionCount = (target) => {
    const t = Math.max(1, Math.min(10, target));
    setSelections((s) => {
      if (t === s.length) return s;
      if (t > s.length) {
        const extra = [];
        let id = nextId;
        for (let i = s.length; i < t; i++) { extra.push({ id, label: "", odds: 1.9, status: "won" }); id++; }
        setNextId(id);
        return [...s, ...extra];
      }
      return s.slice(0, t);
    });
  };

  const activeCombo = activeCell != null ? computed.byFold.find((f) => f.k === activeCell.k)?.combos[activeCell.i] : null;

  // Signaux du picker "Ajouter" pas déjà présents dans le ticket (même clé de
  // libellé que l'auto-remplissage, donc un signal ajouté puis retiré peut être repris).
  const pickableSignals = useMemo(() => {
    const used = new Set(selections.map((s) => s.label));
    return availableSignals.filter((s) => !used.has(`${s.match || "?"} — ${s.selection_name || "?"}`));
  }, [availableSignals, selections]);

  const statusLine = {
    loading: "Chargement des signaux PAIM…",
    error: "Signaux indisponibles — ticket vide, remplissage manuel possible.",
    empty: "Aucun signal ≥ 1.80 dans les 12h à venir — ticket vide, remplissage manuel possible.",
  }[signalsStatus] || `Auto-rempli depuis ${signalsStatus.split(":")[1]} signal(aux) actif(s) — fenêtre 12h, cote > 1.80, trié par edge.`;

  return (
    <div style={{ background: C.bg, minHeight: "60vh", fontFamily: SANS }} className="w-full">
      <div className="max-w-6xl mx-auto px-4 py-8 md:px-8">
        {/* Header */}
        <div className="mb-6">
          <div style={{ color: C.gold, fontFamily: MONO }} className="text-xs tracking-widest uppercase mb-1">Predator Paim · Outils</div>
          <h1 style={{ color: C.text }} className="text-2xl md:text-3xl font-semibold mb-2">Calculateur de paris</h1>
          <p style={{ color: C.muted }} className="text-sm max-w-2xl">
            Système, simples et combiné sur les mêmes sélections, additionnés dans un total unique, avec le pire et
            le meilleur cas selon le nombre de bons. Nuls et cotes asiatiques partielles gérés.
          </p>
          <p style={{ color: C.faint, fontFamily: MONO }} className="text-xs mt-2">{statusLine}</p>
        </div>

        <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
          {/* LEFT COLUMN — saisie : les sélections, puis une section par type de pari,
              chacune avec son propre bilan brut/net. */}
          <div className="lg:col-span-5 space-y-5">
            {/* Ticket */}
            <Panel
              title="Sélections"
              right={
                <div className="flex items-center gap-2">
                  {n > 0 && (
                    <button onClick={clearAll} aria-label="Tout effacer"
                      style={{ color: C.loss, border: `1px solid ${C.border}` }}
                      className="flex items-center gap-1 text-xs px-2 py-1 rounded-md transition">
                      <Trash2 size={13} /> Vider
                    </button>
                  )}
                  <button onClick={() => setPickerOpen((v) => !v)} disabled={n >= 10}
                    style={{ color: n >= 10 ? C.faint : C.gold, border: `1px solid ${n >= 10 ? C.border : C.goldSoft}` }}
                    className="flex items-center gap-1 text-xs px-2 py-1 rounded-md transition">
                    <Plus size={13} /> Ajouter
                  </button>
                </div>
              }
            >
              {pickerOpen && n < 10 && (
                <div style={{ background: C.panel2, border: `1px solid ${C.borderSoft}`, borderRadius: 10 }} className="mb-3 p-2 max-h-56 overflow-y-auto">
                  {pickableSignals.length === 0 ? (
                    <p style={{ color: C.faint }} className="text-xs px-1.5 py-1">Aucun signal actif disponible — utilise la ligne vide ci-dessous.</p>
                  ) : (
                    pickableSignals.map((s, i) => (
                      <button key={i} onClick={() => { addFromSignal(s); setPickerOpen(false); }}
                        style={{ color: C.text }}
                        className="w-full flex items-center justify-between gap-2 text-left text-xs px-1.5 py-1.5 rounded-md hover:bg-white/5">
                        <span className="truncate">{s.match || "?"} — {s.selection_name || "?"}</span>
                        <span style={{ color: C.gold, fontFamily: MONO }} className="shrink-0">@{Number(s.xbet_odd || 0).toFixed(2)}</span>
                      </button>
                    ))
                  )}
                  <div style={{ borderTop: `1px solid ${C.border}` }} className="mt-1 pt-1">
                    <button onClick={() => { addSelection(); setPickerOpen(false); }}
                      style={{ color: C.muted }} className="w-full text-left text-xs px-1.5 py-1.5 rounded-md hover:bg-white/5">
                      + Ligne vide (saisie manuelle)
                    </button>
                  </div>
                </div>
              )}
              {n === 0 ? (
                <p style={{ color: C.faint }} className="text-xs">Aucune sélection — ajoute-en une, ou attends l'auto-remplissage.</p>
              ) : (
                <div className="space-y-2">
                  {selections.map((sel, i) => (
                    <div key={sel.id} style={{ background: C.panel2, border: `1px solid ${C.borderSoft}`, borderRadius: 10 }} className="p-2.5">
                      <div className="flex items-center gap-2 mb-2">
                        <span style={{ color: C.gold, fontFamily: MONO, background: "rgba(198,161,91,0.1)" }} className="text-xs w-6 h-6 flex items-center justify-center rounded-md shrink-0">
                          {i + 1}
                        </span>
                        <input
                          value={sel.label}
                          onChange={(e) => updateSelection(sel.id, { label: e.target.value })}
                          placeholder={`Sélection ${i + 1}`}
                          style={{ ...inputStyle, fontFamily: SANS }}
                          className="flex-1 min-w-0 text-sm rounded-md px-2 py-1.5"
                        />
                        <button onClick={() => removeSelection(sel.id)} aria-label="Supprimer la sélection"
                          style={{ color: C.loss }} className="shrink-0 p-1">
                          <Trash2 size={14} />

                        <div className="w-20 shrink-0">
                          <input
                            type="number" step="0.01" min="1.01" value={sel.odds}

                          />
                        </div>
                        <select
                          value={sel.status}
                          onChange={(e) => updateSelection(sel.id, { status: e.target.value })}

                          className="flex-1 min-w-0 text-sm rounded-md px-2 py-1.5"
                        >
                          {STATUS_OPTS.map((o) => <option key={o.v} value={o.v}>{o.label}</option>)}
                        </select>
                      </div>
                    </div>
                  ))}
                </div>

            </Panel>

            {/* System config — deux dropdowns M/N, comme betbuzz ; mise saisie
                PAR LIGNE ou TOTALE (répartie à parts égales sur les lignes). */}
            <Panel title="Système" right={n > 0 ? <Toggle on={sysOn} onChange={setSysOn} label="Dans le total" /> : null}>
              {n === 0 ? (
                <p style={{ color: C.faint }} className="text-xs">

                </p>

              <>
              <div className="grid grid-cols-2 gap-3 mb-3">
                <Field label="Système (M)">
                  <select value={Math.min(sysM, n)} onChange={(e) => setSysM(Number(e.target.value))}
                    style={{ ...inputStyle, fontFamily: MONO }} className="text-sm rounded-md px-2 py-1.5">
                    {Array.from({ length: n }, (_, i) => i + 1).map((k) => <option key={k} value={k}>{k}</option>)}
                  </select>
                </Field>
                <Field label="Sélections (N)">
                  <select value={n} onChange={(e) => setSelectionCount(Number(e.target.value))}
                    style={{ ...inputStyle, fontFamily: MONO }} className="text-sm rounded-md px-2 py-1.5">
                    {Array.from({ length: 10 }, (_, i) => i + 1).map((k) => <option key={k} value={k}>{k}</option>)}
                  </select>
                </Field>
              </div>
              <div style={{ background: "rgba(198,161,91,0.1)", border: `1px solid ${C.goldSoft}`, color: C.gold, fontFamily: MONO }}

                Système {Math.min(sysM, n)}/{n} = {systemLabelText} · {totalLignes} ligne{totalLignes > 1 ? "s" : ""}
              </div>
              <Field label="Mode de mise">
                <Segmented value={stakeMode} onChange={switchStakeMode}
                  options={[{ v: "line", label: "Mise par ligne" }, { v: "total", label: "Mise totale" }]} />
              </Field>
              <div className="grid grid-cols-2 gap-3 mt-3">
                {stakeMode === "line" ? (
                  <Field label="Mise par ligne">
                    <input type="number" min="0" step="1" value={stakeInput}
                      onChange={(e) => setStakeInput(e.target.value)}
                      onBlur={() => setStakeInput(String(lineStakeInput))}
                      style={inputStyle} className="text-sm rounded-md px-2 py-1.5" />
                  </Field>
                ) : (
                  <Field label="Mise totale">
                    <input type="number" min="0" step="1" value={totalStakeInput}
                      onChange={(e) => setTotalStakeInput(e.target.value)}
                      onBlur={() => setTotalStakeInput(String(totalStakeWanted))}
                      style={inputStyle} className="text-sm rounded-md px-2 py-1.5" />
                  </Field>
                )}
                <Field label="Devise">
                  <select value={currency} onChange={(e) => setCurrency(e.target.value)}
                    style={{ ...inputStyle, fontFamily: SANS }} className="text-sm rounded-md px-2 py-1.5">
                    {CURRENCIES.map((c) => <option key={c} value={c}>{c}</option>)}
                  </select>
                </Field>
              </div>
              <p style={{ color: C.faint, fontFamily: MONO }} className="text-xs mt-2">
                {stakeMode === "line"
                  ? `${totalLignes} × ${fmt(stake)} = ${fmt(computed.totalMise)} engagés`
                  : `${fmt(totalStakeWanted)} ÷ ${totalLignes} = ${fmt(stake)} par ligne`}
              </p>
              <div style={{ borderTop: `1px solid ${C.borderSoft}` }} className="mt-3 pt-3 space-y-1.5">
                <StatRow label="Mise totale" value={fmt(computed.totalMise)} />
                <StatRow label="Gain brut" value={fmt(computed.totalRetour)} />
                <StatRow label="Gain net" value={signed(computed.totalProfit)} color={computed.totalProfit >= 0 ? C.win : C.loss} strong />
              </div>
              </>
              )}
            </Panel>

            {/* Mises individuelles — chaque sélection jouée SEULE, avec sa propre
                mise : une mise par défaut commune, surchargeable ligne par ligne. */}
            <Panel title="Mises individuelles" right={n > 0 ? <Toggle on={simplesOn} onChange={setSimplesOn} label="Dans le total" /> : null}>
              {n === 0 ? (
                <p style={{ color: C.faint }} className="text-xs">Aucune sélection — chaque sélection pourra être jouée seule ici.</p>
              ) : (
              <>
              <div className="flex items-end gap-3 mb-3">
                <Field label="Mise par défaut (toutes)">
                  <input type="number" min="0" step="1" value={simpleDefaultInput}
                    onChange={(e) => setSimpleDefaultInput(e.target.value)}
                    onBlur={() => setSimpleDefaultInput(String(Math.max(0, parseFloat(simpleDefaultInput) || 0)))}
                    style={inputStyle} className="text-sm rounded-md px-2 py-1.5 w-32" />
                </Field>
                {Object.keys(simpleStakes).length > 0 && (
                  <button type="button" onClick={() => setSimpleStakes({})}
                    style={{ color: C.muted, border: `1px solid ${C.border}`, cursor: "pointer" }}
                    className="text-xs px-2 py-1.5 rounded-md">
                    Tout remettre par défaut
                  </button>
                )}
              </div>
              <div className="space-y-2">
                {simples.rows.map((r) => (
                  <div key={r.sel.id} style={{ background: C.panel2, border: `1px solid ${C.borderSoft}`, borderRadius: 10 }} className="p-2.5">
                    <div className="flex items-center gap-2 mb-2">
                      <span style={{ color: C.gold, fontFamily: MONO, background: "rgba(198,161,91,0.1)" }} className="text-xs w-6 h-6 flex items-center justify-center rounded-md shrink-0">
                        {r.i + 1}
                      </span>
                      <span style={{ color: C.text }} className="flex-1 min-w-0 truncate text-sm">{r.sel.label || `Sélection ${r.i + 1}`}</span>
                      <span style={{ color: C.gold, fontFamily: MONO }} className="text-sm shrink-0">@{r.sel.odds.toFixed(2)}</span>
                    </div>
                    <div className="flex items-center gap-2">
                      <input type="number" min="0" step="1" value={simpleStakes[r.sel.id] ?? ""} placeholder={simpleDefaultInput}
                        aria-label={`Mise sélection ${r.i + 1}`}
                        onChange={(e) => setSimpleStake(r.sel.id, e.target.value)}
                        style={inputStyle} className="w-24 shrink-0 text-sm rounded-md px-2 py-1.5" />
                      <div className="flex-1 min-w-0 text-right" style={{ fontFamily: MONO }}>
                        <div style={{ color: C.faint }} className="text-xs">
                          {fmtN(r.stake)} × {r.sel.odds.toFixed(2)}{r.sel.status !== "won" ? ` · ${STATUS_OPTS.find((o) => o.v === r.sel.status)?.label}` : ""}
                        </div>
                        <div style={{ color: bucketColor[r.bucket] }} className="text-sm font-semibold">{fmt(r.brut)}</div>
                        <div style={{ color: r.net >= 0 ? C.win : C.loss }} className="text-xs">net {signed(r.net)}</div>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
              <div style={{ borderTop: `1px solid ${C.borderSoft}` }} className="mt-3 pt-3 space-y-1.5">
                <StatRow label={`Mise totale · ${n} simple${n > 1 ? "s" : ""}`} value={fmt(simples.mise)} />
                <StatRow label="Gain brut" value={fmt(simples.brut)} />
                <StatRow label="Gain net potentiel" value={signed(simples.net)} color={simples.net >= 0 ? C.win : C.loss} strong />
              </div>
              </>
              )}
            </Panel>

            {/* Combiné — TOUTES les sélections sur une seule ligne N/N, cote
                totale = produit des cotes (statuts appliqués par le moteur). */}
            <Panel title="Combiné" right={n >= 2 ? <Toggle on={comboOn} onChange={setComboOn} label="Dans le total" /> : null}>
              {n < 2 ? (
                <p style={{ color: C.faint }} className="text-xs">
                  Il faut au moins 2 sélections pour un combiné{n === 1 ? " — avec une seule, c'est un simple (section ci-dessus)" : ""}.
                </p>
              ) : (
              <>
              <div className="flex flex-wrap gap-1.5 mb-3">
                {selections.map((sel, i) => (
                  <span key={sel.id} style={{ color: C.text, background: C.panel2, border: `1px solid ${C.borderSoft}`, fontFamily: MONO }}
                    className="text-xs px-2 py-1 rounded-md max-w-full truncate">
                    {i + 1} · {sel.label || `Sélection ${i + 1}`} <span style={{ color: C.gold }}>@{sel.odds.toFixed(2)}</span>
                  </span>
                ))}
              </div>
              <div className="grid grid-cols-2 gap-3 items-end">
                <Field label="Mise du combiné">
                  <input type="number" min="0" step="1" value={comboStakeInput}
                    onChange={(e) => setComboStakeInput(e.target.value)}
                    onBlur={() => setComboStakeInput(String(comboStake))}
                    style={inputStyle} className="text-sm rounded-md px-2 py-1.5" />
                </Field>
                <div>
                  <div style={{ color: C.muted }} className="text-xs mb-1">Cote totale</div>
                  <div style={{ color: C.gold, fontFamily: MONO }} className="text-xl font-semibold leading-none">{combine.cote.toFixed(3)}</div>
                </div>
              </div>
              <p style={{ color: C.faint, fontFamily: MONO }} className="text-xs mt-2">
                {selections.map((s) => s.odds.toFixed(2)).join(" × ")} = {combine.cote.toFixed(3)}
              </p>
              <div style={{ borderTop: `1px solid ${C.borderSoft}` }} className="mt-3 pt-3 space-y-1.5">
                <StatRow label={`${fmtN(combine.stake)} × ${combine.cote.toFixed(3)}`} value={fmt(combine.stake * combine.cote)} />
                <StatRow label="Gain brut" value={fmt(combine.brut)} color={bucketColor[combine.bucket]} />
                <StatRow label="Gain net" value={signed(combine.net)} color={combine.net >= 0 ? C.win : C.loss} strong />
              </div>
              {combine.bucket !== "win" && (
                <p style={{ color: C.partial }} className="text-xs mt-2">
                  Statuts appliqués : facteur de retour {combine.R.toFixed(3)}× (nul = cote 1, perdu = 0).
                </p>
              )}
              </>
              )}
            </Panel>
          </div>

          {/* RIGHT COLUMN — le total des sections actives, ses scénarios
              complets, puis le détail du système seul. */}
          <div className="lg:col-span-7 space-y-5">
            {n === 0 ? (
              <Panel title="Total">
                <p style={{ color: C.muted }} className="text-sm">Ajoute au moins une sélection pour lancer le calcul.</p>
              </Panel>
            ) : (
              <>
                {/* Total — addition des sections actives (interrupteur « Dans le
                    total » de chacune). Brut = retour mise comprise, net = brut − mise. */}
                <Panel title="Total"
                  right={<span style={{ color: C.faint, fontFamily: SANS }} className="text-xs">{sections.filter((s) => s.on).length}/{sections.length} sections actives</span>}
                >
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                    <SummaryCard label="Mise engagée" value={fmt(grand.mise)} />
                    <SummaryCard label="Gain brut potentiel" value={fmt(grand.brut)} />
                    <SummaryCard label="Gain net potentiel" value={signed(grand.net)} color={grand.net >= 0 ? C.win : C.loss} />
                    <SummaryCard label="ROI" value={`${grand.roi.toFixed(1)} %`} color={grand.net >= 0 ? C.win : C.loss} />
                  </div>
                  <div className="mt-3 overflow-x-auto">
                    <table className="w-full text-xs" style={{ fontFamily: MONO, borderCollapse: "collapse" }}>
                      <thead>
                        <tr style={{ color: C.muted, fontFamily: SANS }}>
                          <th className="text-left py-1 pr-2">Section</th>
                          <th className="text-right py-1 px-2">Mise</th>
                          <th className="text-right py-1 px-2">Brut</th>
                          <th className="text-right py-1 pl-2">Net</th>
                        </tr>
                      </thead>
                      <tbody>
                        {sections.map((s) => (
                          <tr key={s.key} style={{ borderTop: `1px solid ${C.borderSoft}`, opacity: s.on ? 1 : 0.45 }}>
                            <td className="py-1.5 pr-2" style={{ color: C.text, fontFamily: SANS }}>
                              {s.label}{!s.on && <span style={{ color: C.faint }}> · hors total</span>}
                            </td>
                            <td className="text-right py-1.5 px-2" style={{ color: C.text }}>{fmtN(s.mise)}</td>
                            <td className="text-right py-1.5 px-2" style={{ color: C.text }}>{fmtN(s.brut)}</td>
                            <td className="text-right py-1.5 pl-2" style={{ color: s.net >= 0 ? C.win : C.loss }}>{signedN(s.net)}</td>
                          </tr>
                        ))}
                        <tr style={{ borderTop: `1px solid ${C.border}`, color: C.text }} className="font-semibold">
                          <td className="py-1.5 pr-2" style={{ fontFamily: SANS }}>Total</td>
                          <td className="text-right py-1.5 px-2">{fmtN(grand.mise)}</td>
                          <td className="text-right py-1.5 px-2">{fmtN(grand.brut)}</td>
                          <td className="text-right py-1.5 pl-2" style={{ color: grand.net >= 0 ? C.win : C.loss }}>{signedN(grand.net)}</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                  <p style={{ color: C.faint }} className="text-xs mt-2">
                    Brut = retour, mise comprise · Net = brut − mise · en {currency}, selon les statuts saisis (Gagné par défaut = tout passe).
                  </p>
                  {doublon && (
                    <div style={{ background: "rgba(227,162,60,0.10)", border: `1px solid ${C.partial}`, color: C.partial }}
                      className="text-xs px-2.5 py-1.5 rounded-md mt-2">
                      ⚠ {doublon} : les mises s'additionnent, c'est jouer deux fois la même chose. Voulu ? Sinon, sors une section du total.
                    </div>
                  )}
                </Panel>

                {/* Scénarios complets — pire et meilleur cas EXACTS, toutes sections
                    actives confondues, par nombre de bons. Retours conditionnels,
                    jamais des probabilités (règle 7). */}
                <Panel
                  title="Scénarios complets"
                  right={<span style={{ color: C.faint, fontFamily: SANS }} className="text-xs">toutes sections — pas des probabilités</span>}
                >
                  {grand.mise <= 0 ? (
                    <p style={{ color: C.muted }} className="text-sm">Active au moins une section avec une mise pour voir les scénarios.</p>
                  ) : (
                  <>
                  <p style={{ color: C.muted }} className="text-xs mb-3">
                    Si <span style={{ color: C.text, fontFamily: MONO }}>k</span> sélections sur {n} sont bonnes, pour {fmt(grand.mise)} engagés.
                    Pire cas : les k bonnes qui rapportent le moins. Meilleur cas : celles qui rapportent le plus. Touche une ligne pour le détail.
                  </p>
                  <div className="grid grid-cols-2 gap-3 mb-3">
                    <div style={{ background: C.panel2, border: `1px solid ${C.borderSoft}`, borderRadius: 10 }} className="px-4 py-3">
                      <div style={{ color: C.muted }} className="text-xs mb-1">Point mort</div>
                      <div style={{ color: pointMortTotal ? C.gold : C.loss, fontFamily: MONO }} className="text-lg font-semibold">
                        {pointMortTotal ? `${pointMortTotal.k} bon${pointMortTotal.k > 1 ? "s" : ""} sur ${n}` : "jamais"}
                      </div>
                      <div style={{ color: C.faint }} className="text-xs mt-0.5">
                        {pointMortTotal && pointMortTotal.tooShort ? `${n - 1} bons sur ${n} ne couvrent pas la mise` : "pire cas ≥ mise engagée"}
                      </div>
                    </div>
                    <div style={{ background: C.panel2, border: `1px solid ${C.borderSoft}`, borderRadius: 10 }} className="px-4 py-3">
                      <div style={{ color: C.muted }} className="text-xs mb-1">Si tout passe</div>
                      <div style={{ color: C.win, fontFamily: MONO }} className="text-lg font-semibold">
                        {signed(scenariosTotal[n].best.total - grand.mise)}
                      </div>
                      <div style={{ color: C.faint }} className="text-xs mt-0.5">{fmt(scenariosTotal[n].best.total)} de retour</div>
                    </div>
                  </div>
                  <div className="overflow-x-auto">
                    <table className="w-full text-xs" style={{ fontFamily: MONO, borderCollapse: "collapse" }}>
                      <thead>
                        <tr style={{ color: C.muted, fontFamily: SANS }}>
                          <th className="text-left py-1 pr-2">k bons</th>
                          <th className="text-right py-1 px-2">Pire cas</th>
                          <th className="text-right py-1 px-2">Meilleur cas</th>
                          <th className="text-right py-1 pl-2">Verdict</th>
                        </tr>
                      </thead>
                      <tbody>
                        {scenariosTotal.map((sc) => {
                          const v = verdictOf(sc);
                          const open = openScenario === sc.k;
                          const estPM = pointMortTotal && pointMortTotal.k === sc.k;
                          const netW = sc.worst.total - sc.mise;
                          const netB = sc.best.total - sc.mise;
                          return (
                            <React.Fragment key={sc.k}>
                              <tr onClick={() => setOpenScenario(open ? null : sc.k)}
                                style={{ borderTop: `1px solid ${C.borderSoft}`, background: estPM ? "rgba(198,161,91,0.10)" : "transparent", cursor: "pointer" }}>
                                <td className="py-1.5 pr-2 align-top" style={{ color: estPM ? C.gold : C.text }}>
                                  {sc.k}/{n}{estPM ? " ◆" : ""}
                                </td>
                                <td className="text-right py-1.5 px-2 align-top">
                                  <div style={{ color: C.text }}>{fmtN(sc.worst.total)}</div>
                                  <div style={{ color: netW >= 0 ? C.win : C.loss }}>{signedN(netW)}</div>
                                </td>
                                <td className="text-right py-1.5 px-2 align-top">
                                  <div style={{ color: C.text }}>{fmtN(sc.best.total)}</div>
                                  <div style={{ color: netB >= 0 ? C.win : C.loss }}>{signedN(netB)}</div>
                                </td>
                                <td className="text-right py-1.5 pl-2 align-top">
                                  <span style={{ color: v.c, border: `1px solid ${v.c}`, background: `${v.c}22`, fontFamily: SANS }}
                                    className="inline-block px-1.5 py-0.5 rounded-md whitespace-nowrap">{v.t}</span>
                                </td>
                              </tr>
                              {open && (
                                <tr style={{ background: C.panel2 }}>
                                  <td colSpan="4" className="px-2 py-2">
                                    <div className="space-y-1.5">
                                      <ScenarioDetail titre="Pire cas" r={sc.worst} selections={selections} flags={sectionFlags} fmtN={fmtN} />
                                      <ScenarioDetail titre="Meilleur cas" r={sc.best} selections={selections} flags={sectionFlags} fmtN={fmtN} />
                                    </div>
                                  </td>
                                </tr>
                              )}
                            </React.Fragment>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                  <p style={{ color: C.faint }} className="text-xs mt-2">
                    Retour puis net, en {currency}. Gagnant = couvert même dans le pire cas · Selon lesquelles = dépend des bonnes · Perdant = jamais couvert.
                  </p>
                  </>
                  )}
                </Panel>

                {/* Résumé du SYSTÈME seul (les panneaux ci-dessous ne concernent
                    que lui : scénarios système, détail par palier). */}
                <Panel title="Système — résumé">
                  <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                    <SummaryCard label="Lignes" value={computed.totalLignes} />
                    <SummaryCard label="Mise totale" value={fmt(computed.totalMise)} />
                    <SummaryCard label="Retour total" value={fmt(computed.totalRetour)} />
                    <SummaryCard label="Profit net" value={fmt(computed.totalProfit)} color={computed.totalProfit >= 0 ? C.win : C.loss} />
                    <SummaryCard label="ROI" value={`${computed.totalMise > 0 ? ((computed.totalProfit / computed.totalMise) * 100).toFixed(1) : "0.0"} %`} color={computed.totalProfit >= 0 ? C.win : C.loss} />
                    {taxEnabled && <SummaryCard label="Retenue fiscale" value={`− ${fmt(computed.taxAmount)}`} color={C.partial} sub={`${taxRate}% · ${taxBase === "net_system" ? "profit net" : "par ligne"}`} />}
                  </div>
                  {taxEnabled && (
                    <div style={{ borderTop: `1px solid ${C.borderSoft}` }} className="mt-3 pt-3 flex items-center justify-between">
                      <span style={{ color: C.muted }} className="text-xs">Net perçu après retenue</span>
                      <span style={{ color: C.text, fontFamily: MONO }} className="text-base font-semibold">{fmt(computed.netAfterTax)}</span>
                    </div>
                  )}
                </Panel>

                {/* Scénarios — retours conditionnels par nombre de gagnants.
                    Ce que le calculateur ne disait pas : AVANT de miser, que
                    rend le système si k sélections sur N sont bonnes ? Pire cas
                    = les k cotes les plus basses gagnent, meilleur cas = les k
                    plus hautes. Ce ne sont PAS des probabilités ni un taux de
                    réussite (règle 7) — le libellé le dit. */}
                <Panel
                  title="Scénarios"
                  right={<span style={{ color: C.faint, fontFamily: SANS }} className="text-xs">système seul · retours conditionnels — pas des probabilités</span>}
                >
                  <p style={{ color: C.muted }} className="text-xs mb-3">
                    Si <span style={{ color: C.text, fontFamily: MONO }}>k</span> sélections sur {n} sont bonnes, sur le système {Math.min(sysM, n)}/{n} et la mise {fmt(stake)} par ligne.
                    Pire cas : les k cotes les plus basses gagnent. Meilleur cas : les k plus hautes.
                  </p>
                  <div className="overflow-x-auto">
                    <table className="w-full text-xs" style={{ fontFamily: MONO, borderCollapse: "collapse" }}>
                      <thead>
                        <tr style={{ color: C.muted, fontFamily: SANS }}>
                          <th className="text-left py-1 pr-2">k bons</th>
                          <th className="text-right py-1 px-2">Pire cas</th>
                          <th className="text-right py-1 px-2">Meilleur cas</th>
                          <th className="text-right py-1 px-2">Profit net (pire)</th>
                          <th className="text-right py-1 pl-2">Marge composée</th>
                        </tr>
                      </thead>
                      <tbody>
                        {scenarios.map((sc) => {
                          const estPointMort = pointMort && pointMort.k === sc.k;
                          const couvre = sc.worst >= sc.mise - 1e-9;
                          return (
                            <tr key={sc.k}
                              style={{ borderTop: `1px solid ${C.borderSoft}`, background: estPointMort ? "rgba(198,161,91,0.10)" : "transparent" }}>
                              <td className="py-1 pr-2" style={{ color: estPointMort ? C.gold : C.text }}>
                                {sc.k}/{n}{estPointMort ? " ◆" : ""}
                              </td>
                              <td className="text-right py-1 px-2" style={{ color: couvre ? C.win : C.loss }}>{fmt(sc.worst)}</td>
                              <td className="text-right py-1 px-2" style={{ color: C.text }}>{fmt(sc.best)}</td>
                              <td className="text-right py-1 px-2" style={{ color: sc.profitWorst >= 0 ? C.win : C.loss }}>
                                {sc.profitWorst >= 0 ? "+" : ""}{fmt(sc.profitWorst)}
                              </td>
                              <td className="text-right py-1 pl-2" style={{ color: C.faint }}>
                                {(compoundMargin(marginPct / 100, sc.k) * 100).toFixed(1)} %
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>

                  {/* Point mort : plus petit k dont le PIRE cas couvre la mise totale. */}
                  <div style={{ borderTop: `1px solid ${C.borderSoft}` }} className="mt-3 pt-3 space-y-2">
                    {pointMort ? (
                      <div className="flex items-center justify-between text-xs">
                        <span style={{ color: C.muted }}>Point mort (pire cas ≥ mise totale)</span>
                        <span style={{ color: C.gold, fontFamily: MONO }} className="font-semibold">◆ {pointMort.k} bons sur {n}</span>
                      </div>
                    ) : (
                      <div style={{ color: C.loss }} className="text-xs">Aucun nombre de bons ne couvre la mise totale en pire cas.</div>
                    )}
                    {pointMort && pointMort.tooShort && (
                      <div style={{ background: "rgba(229,86,107,0.10)", border: `1px solid ${C.loss}`, color: C.loss }}
                        className="text-xs px-2.5 py-1.5 rounded-md">
                        Cotes trop courtes pour un système : {n - 1} bons sur {n} ne couvrent pas la mise.
                      </div>
                    )}
                  </div>

                  {/* Marge composée, indicative : (1 + m)^k − 1, m saisi par l'opérateur. */}
                  <div style={{ borderTop: `1px solid ${C.borderSoft}` }} className="mt-3 pt-3 grid grid-cols-2 gap-3 items-end">
                    <Field label="Marge par jambe (%) — indicatif">
                      <input type="number" min="0" max="100" step="0.5" value={marginInput}
                        onChange={(e) => setMarginInput(e.target.value)}
                        onBlur={() => setMarginInput(String(marginPct))}
                        style={inputStyle} className="text-sm rounded-md px-2 py-1.5" />
                    </Field>
                    <div style={{ color: C.faint }} className="text-xs">
                      Marge composée = (1 + m)<sup>k</sup> − 1. Une hypothèse, pas une mesure.
                      {n >= 5 && (
                        <div style={{ color: C.partial }} className="mt-1">
                          ⚠ N ≥ 5 : la marge composée grossit vite, elle ne dit rien de la chance de gagner.
                        </div>
                      )}
                    </div>
                  </div>
                </Panel>

                <Panel title="Détail par palier & combinaisons">
                  <div className="space-y-3">
                    {computed.byFold.map((f) => (
                      <div key={f.k} style={{ background: C.panel2, border: `1px solid ${C.borderSoft}`, borderRadius: 10 }} className="p-3">
                        <div className="flex items-center justify-between mb-2">
                          <span style={{ color: C.text, fontFamily: SANS }} className="text-sm font-medium">
                            {foldName(f.k)} <span style={{ color: C.faint }} className="font-normal">· {f.count} ligne{f.count > 1 ? "s" : ""}</span>
                          </span>
                          <span style={{ color: f.profit >= 0 ? C.win : C.loss, fontFamily: MONO }} className="text-sm font-semibold">
                            {f.profit >= 0 ? "+" : ""}{fmt(f.profit)}
                          </span>
                        </div>
                        <div className="flex flex-wrap gap-1.5">
                          {f.combos.map((c, i) => {
                            const isActive = activeCell && activeCell.k === f.k && activeCell.i === i;
                            return (
                              <button key={i} onClick={() => setActiveCell(isActive ? null : { k: f.k, i })}
                                style={{
                                  background: isActive ? bucketColor[c.bucket] : `${bucketColor[c.bucket]}22`,
                                  border: `1px solid ${bucketColor[c.bucket]}`,
                                  color: isActive ? C.bg : bucketColor[c.bucket],
                                  fontFamily: MONO,
                                }}
                                className="text-xs px-2 py-1 rounded-md transition">
                                {c.indices.map((idx) => idx + 1).join("·")}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    ))}
                  </div>

                  {activeCombo && (
                    <div style={{ background: C.panel2, border: `1px solid ${C.gold}`, borderRadius: 10 }} className="p-3 mt-3">
                      <div style={{ color: C.gold, fontFamily: SANS }} className="text-xs font-semibold uppercase tracking-wide mb-2">
                        Combinaison {activeCell.k}-fold — {activeCombo.indices.map((i) => i + 1).join(" · ")}
                      </div>
                      <div className="space-y-1 mb-2">
                        {activeCombo.indices.map((idx) => {
                          const sel = selections[idx];
                          return (
                            <div key={idx} className="flex items-center justify-between text-xs">
                              <span style={{ color: C.muted }}>{sel.label || `Sélection ${idx + 1}`}</span>
                              <span style={{ color: C.faint, fontFamily: MONO }}>
                                @{sel.odds.toFixed(2)} · {STATUS_OPTS.find((o) => o.v === sel.status)?.label}
                              </span>
                            </div>
                          );
                        })}
                      </div>
                      <div className="flex items-center justify-between text-sm" style={{ fontFamily: MONO }}>
                        <span style={{ color: C.muted }}>Facteur de retour R</span>
                        <span style={{ color: bucketColor[activeCombo.bucket], fontWeight: 600 }}>{activeCombo.R.toFixed(3)}×</span>
                      </div>
                    </div>
                  )}
                </Panel>
              </>
            )}
          </div>
        </div>

        {/* Widget « Quota OddsAPI » retiré le 2026-08-22 (Mission 2, Phase 2) :
            la surveillance est backend — alerte Telegram 20 % / 5 % + log à
            chaque run (run_engine._alert_oddsapi_pool_levels). */}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("sbc-root")).render(<SystemBetCalculator />);
{% endraw %}
</script>
</body>
</html>
