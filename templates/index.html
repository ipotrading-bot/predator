<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PREDATOR PAIM v5.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: #00ff00; font-family: monospace; }
        .card { background: #111; border: 1px solid #222; border-left: 4px solid #00ff00; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 50; padding: 20px; }
        .alpha-value { color: #60a5fa; font-weight: bold; }
    </style>
</head>
<body class="p-2 md:p-6">
    <!-- Header Simple -->
    <div class="flex justify-between items-center mb-6 border-b border-green-900 pb-2">
        <h1 class="text-lg font-bold">🦅 PREDATOR <span class="text-white">PAIM</span></h1>
        <div id="api-status" class="text-[10px] text-green-500">● SYSTEM ONLINE</div>
    </div>

    <!-- KPIs Mobile-First -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-6">
        <div class="card p-2 text-center"><div class="text-[9px] text-gray-500">CAPITAL</div><div class="text-sm font-bold">10000€</div></div>
        <div id="win-rate" class="card p-2 text-center"><div class="text-[9px] text-gray-500">WIN RATE</div><div class="text-sm font-bold">0.0%</div></div>
        <div id="clv-avg" class="card p-2 text-center"><div class="text-[9px] text-gray-500">CLV AVG</div><div class="text-sm font-bold">+0.0%</div></div>
        <div class="card p-2 text-center col-span-2 md:col-span-1"><div class="text-[9px] text-gray-500">STATUS</div><div class="text-sm font-bold">SÉCURISÉ</div></div>
    </div>

    <!-- Navigation -->
    <div class="flex gap-4 mb-4 text-xs font-bold border-b border-gray-800 pb-2 overflow-x-auto">
        <button onclick="loadSignals()" class="text-white border-b-2 border-green-500 pb-1">LIVE SIGNALS</button>
        <button onclick="alert('Bientôt disponible')" class="text-gray-500">LEDGER</button>
        <button onclick="runScan()" class="bg-green-900 text-green-400 px-2 rounded">FORCE SCAN</button>
    </div>

    <!-- Grid de Signaux -->
    <div id="signals-grid" class="grid grid-cols-1 gap-3">
        <div class="text-center p-10 text-gray-600">Initialisation du flux...</div>
    </div>

    <!-- Modale de Détail -->
    <div id="detail-modal" class="modal flex-col justify-center items-center">
        <div class="bg-[#111] border border-green-500 p-6 w-full max-w-md rounded-sm">
            <h2 id="m-title" class="text-xl font-bold text-white mb-4"></h2>
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="bg-black p-3 border border-gray-800">
                    <div class="text-[10px] text-gray-500">FAIR PRICE</div>
                    <div id="m-fair" class="text-lg font-bold"></div>
                </div>
                <div class="bg-black p-3 border border-gray-800">
                    <div class="text-[10px] text-gray-500">1XBET</div>
                    <div id="m-soft" class="text-lg font-bold text-green-400"></div>
                </div>
            </div>
            <div class="mb-6">
                <div class="text-[10px] text-gray-500 mb-1">IA RISK FLAG</div>
                <div id="m-ia" class="text-xs italic text-gray-300 bg-black p-2 border border-gray-900"></div>
            </div>
            <button id="m-link" class="w-full bg-blue-600 text-white font-bold py-3 mb-3">OUVRIR SUR 1XBET</button>
            <button onclick="closeModal()" class="w-full bg-red-900/30 text-red-500 py-2 text-xs">FERMER</button>
        </div>
    </div>

    <script>
        async function loadSignals() {
            const grid = document.getElementById('signals-grid');
            try {
                const res = await fetch('/api/data');
                const data = await res.json();
                
                // Extract signals array from API response (wraps in { signals: [...] })
                const signals = (data.signals || data || []);

                if (!signals || signals.length === 0) {
                    grid.innerHTML = '<div class="text-center p-10 text-gray-700">AUCUN ALPHA DÉTECTÉ</div>';
                    return;
                }

                grid.innerHTML = signals.filter(s => s.match_name && s.match_name !== 'null').map(s => `
                    <div class="card p-4 flex justify-between items-center" onclick='openModal(${JSON.stringify(s)})'>
                        <div>
                            <div class="text-[10px] text-gray-500">${s.sport || 'N/A'} | ${s.match_time ? s.match_time.substring(5,16) : 'N/A'}</div>
                            <div class="text-sm font-bold text-white">${s.match_name}</div>
                        </div>
                        <div class="text-right">
                            <div class="text-[10px] text-gray-500 uppercase">Alpha</div>
                            <div class="alpha-value">+${(s.alpha_spread * 100).toFixed(1)}%</div>
                        </div>
                    </div>
                `).join('');
            } catch (e) { grid.innerHTML = '<div class="text-red-500">Erreur de chargement</div>'; }
        }

        function openModal(s) {
            document.getElementById('m-title').innerText = s.match_name;
            document.getElementById('m-fair').innerText = s.fair_price || '0.00';
            document.getElementById('m-soft').innerText = s.cote_1xbet || '0.00';
            document.getElementById('m-ia').innerText = s.note_ia || 'Analyse non disponible';
            document.getElementById('detail-modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('detail-modal').style.display = 'none'; }

        async function runScan() {
            const btn = event.target;
            btn.innerText = "SCANNING...";
            await fetch('/api/screener');
            loadSignals();
            btn.innerText = "FORCE SCAN";
        }

        loadSignals();
        setInterval(loadSignals, 60000);
    </script>
</body>
</html>
