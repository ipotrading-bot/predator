<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PREDATOR PAIM v3.6 | Dashboard Reconstruit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #050505;
            --bg-card: #0a0a0a;
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-accent: rgba(0, 200, 255, 0.3);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.5);
            --text-muted: rgba(255, 255, 255, 0.3);
            --alpha-glow: #00d4ff;
            --elite-gold: #ffd700;
            --error-red: #ff4757;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }
        
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Loading Animation */
        .loading-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
        
        .loading-bar {
            height: 2px;
            background: linear-gradient(90deg, var(--alpha-glow), transparent);
            animation: loading 1.5s ease-in-out infinite;
        }
        
        @keyframes loading {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        /* Grid */
        .signal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1px;
            background: var(--border-subtle);
            min-height: calc(100vh - 60px);
        }
        
        /* Cards */
        .signal-card {
            background: var(--bg-card);
            border: 1px solid transparent;
            padding: 24px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }
        
        .signal-card:hover {
            background: #0f0f0f;
            border-color: var(--border-accent);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.1);
        }
        
        .signal-card.elite {
            border-left: 3px solid var(--elite-gold);
        }
        
        .alpha-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 36px;
            font-weight: 300;
            color: var(--alpha-glow);
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }
        
        /* Drawer */
        .drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 998;
        }
        
        .drawer-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .side-drawer {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background: #080808;
            border-left: 1px solid var(--border-subtle);
            transform: translateX(100%);
            transition: transform 0.3s ease;
            z-index: 999;
            overflow-y: auto;
        }
        
        .side-drawer.active {
            transform: translateX(0);
        }
        
        /* Error State */
        .error-state {
            grid-column: 1 / -1;
            padding: 100px 40px;
            text-align: center;
        }
        
        .error-state h2 {
            color: var(--error-red);
            font-size: 24px;
            margin-bottom: 16px;
        }
        
        /* Empty State */
        .empty-state {
            grid-column: 1 / -1;
            padding: 100px 40px;
            text-align: center;
            color: var(--text-muted);
        }
        
        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 24px;
            opacity: 0.4;
        }
        
        /* Button */
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid var(--border-accent);
            color: var(--alpha-glow);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: block;
            text-align: center;
        }
        
        .btn-primary:hover {
            background: rgba(0, 212, 255, 0.2);
            border-color: var(--alpha-glow);
        }
        
        /* Status indicators */
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
            animation: blink 2s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .status-dot.error { background: var(--error-red); box-shadow: 0 0 10px var(--error-red); }
        .status-dot.loading { background: var(--alpha-glow); animation: blink 1s infinite; }
    </style>
</head>
<body>
    <!-- Header -->
    <header style="padding: 16px 24px; border-bottom: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.8); position: sticky; top: 0; z-index: 100;">
        <div>
            <h1 style="font-size: 16px; font-weight: 600; letter-spacing: 0.05em;">
                PREDATOR <span style="color: var(--alpha-glow);">PAIM</span> v3.6
            </h1>
            <p style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">
                Dashboard Reconstruit • <span id="connection-status">Connexion...</span>
            </p>
        </div>
        <div style="display: flex; align-items: center; gap: 12px;">
            <span id="status-indicator" class="status-dot loading"></span>
            <span style="font-size: 11px; color: var(--text-secondary);">SYSTEM</span>
        </div>
    </header>

    <!-- Loading Bar -->
    <div id="loading-bar" class="loading-bar" style="display: block;"></div>

    <!-- Main Grid -->
    <main id="signal-grid" class="signal-grid">
        <!-- Loading State -->
        <div class="empty-state loading-pulse">
            <div class="empty-state-icon">📡</div>
            <p class="font-mono" style="font-size: 14px;">INITIALISATION DU TERMINAL...</p>
            <p style="font-size: 11px; color: var(--text-muted); margin-top: 8px;">Connexion à Supabase en cours</p>
        </div>
    </main>

    <!-- Drawer Overlay -->
    <div id="drawer-overlay" class="drawer-overlay" onclick="closeDrawer()"></div>

    <!-- Side Drawer -->
    <aside id="side-drawer" class="side-drawer">
        <div style="padding: 24px; border-bottom: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: flex-start;">
            <div>
                <div id="drawer-sport" style="font-size: 12px; color: var(--alpha-glow); margin-bottom: 4px;">—</div>
                <h2 id="drawer-match" style="font-size: 18px; font-weight: 600;">—</h2>
            </div>
            <button onclick="closeDrawer()" style="width: 32px; height: 32px; background: transparent; border: 1px solid var(--border-subtle); color: var(--text-secondary); cursor: pointer; font-size: 20px;">×</button>
        </div>
        
        <div style="padding: 24px;">
            <!-- Odds -->
            <div style="display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; padding: 20px; background: rgba(255,255,255,0.02); border: 1px solid var(--border-subtle); border-radius: 4px; margin-bottom: 24px;">
                <div style="text-align: center;">
                    <div style="font-size: 10px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px;">Fair Price</div>
                    <div id="drawer-fair" style="font-family: 'JetBrains Mono'; font-size: 28px; color: #888;">—</div>
                </div>
                <div style="color: var(--alpha-glow); font-size: 20px; display: flex; align-items: center;">→</div>
                <div style="text-align: center;">
                    <div style="font-size: 10px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px;">1XBet</div>
                    <div id="drawer-soft" style="font-family: 'JetBrains Mono'; font-size: 28px; color: var(--alpha-glow);">—</div>
                </div>
            </div>
            
            <!-- Details -->
            <div style="margin-bottom: 24px;">
                <div style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border-subtle);">
                    <span style="font-size: 11px; text-transform: uppercase; color: var(--text-muted);">Alpha</span>
                    <span id="drawer-alpha" style="font-family: 'JetBrains Mono'; color: var(--alpha-glow);">—</span>
                </div>
                <div style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border-subtle);">
                    <span style="font-size: 11px; text-transform: uppercase; color: var(--text-muted);">Mise</span>
                    <span id="drawer-stake" style="font-family: 'JetBrains Mono';">—</span>
                </div>
                <div style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border-subtle);">
                    <span style="font-size: 11px; text-transform: uppercase; color: var(--text-muted);">Marché</span>
                    <span id="drawer-market">—</span>
                </div>
                <div style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border-subtle);">
                    <span style="font-size: 11px; text-transform: uppercase; color: var(--text-muted);">Sélection</span>
                    <span id="drawer-selection">—</span>
                </div>
            </div>
            
            <!-- IA Note -->
            <div style="padding: 16px; background: rgba(0, 212, 255, 0.03); border-left: 3px solid var(--alpha-glow); margin-bottom: 24px;">
                <div style="font-size: 10px; text-transform: uppercase; color: var(--alpha-glow); margin-bottom: 8px;">🤖 Analyse IA</div>
                <p id="drawer-note" style="font-size: 13px; color: var(--text-secondary); line-height: 1.5;">—</p>
            </div>
            
            <!-- CTA -->
            <a id="drawer-link" href="#" target="_blank" class="btn-primary">
                Placer sur 1XBet →
            </a>
        </div>
    </aside>

    <script>
        // Configuration
        const API_BASE = window.location.origin;
        
        // Sport mappings
        const SPORT_ICONS = {
            'basketball_nba': '🏀', 'basketball_euroleague': '🏀', 'basketball_ncaab': '🏀',
            'tennis_atp': '🎾', 'tennis_wta': '🎾', 'tennis_atp_french_open': '🎾',
            'soccer_epl': '⚽', 'soccer_uefa_champs_league': '⚽', 'soccer_germany_bundesliga': '⚽',
            'esports_lol': '🎮', 'esports_lol_msi': '🎮', 'esports_lol_lck': '🎮',
            'baseball_mlb': '⚾', 'icehockey_nhl': '🏒', 'mma_mixed_martial_arts': '🥊'
        };
        
        const SPORT_NAMES = {
            'basketball_nba': 'NBA', 'basketball_euroleague': 'Euroleague',
            'tennis_atp': 'ATP', 'soccer_epl': 'EPL', 'soccer_uefa_champs_league': 'UCL',
            'esports_lol': 'LoL', 'baseball_mlb': 'MLB'
        };
        
        let signals = [];
        
        function getIcon(sport) {
            return SPORT_ICONS[sport] || '📊';
        }
        
        function getName(sport) {
            return SPORT_NAMES[sport] || sport?.split('_').pop()?.toUpperCase() || 'SPORT';
        }
        
        function formatTime(iso) {
            if (!iso) return '—';
            try {
                const d = new Date(iso);
                return `${String(d.getUTCDate()).padStart(2,'0')}/${String(d.getUTCMonth()+1).padStart(2,'0')} ${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`;
            } catch { return '—'; }
        }
        
        // Status update
        function setStatus(status, message) {
            const dot = document.getElementById('status-indicator');
            const text = document.getElementById('connection-status');
            dot.className = 'status-dot ' + status;
            text.textContent = message;
        }
        
        // Fetch signals
        async function loadSignals() {
            const grid = document.getElementById('signal-grid');
            
            try {
                setStatus('loading', 'Chargement...');
                
                const response = await fetch(`${API_BASE}/api/data`, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                signals = Array.isArray(data) ? data.filter(s => s.cote_1xbet > 0) : [];
                
                document.getElementById('loading-bar').style.display = 'none';
                
                if (signals.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📡</div>
                            <p class="font-mono" style="font-size: 14px;">AUCUN SIGNAL ACTIF</p>
                            <p style="font-size: 11px; color: var(--text-muted); margin-top: 8px;">
                                Scan rotationnel en cours — Prochain cycle dans ~5 min
                            </p>
                            <p style="font-size: 10px; color: var(--text-muted); margin-top: 16px;">
                                API: ${API_BASE}
                            </p>
                        </div>
                    `;
                    setStatus('error', 'Aucun signal');
                    return;
                }
                
                // Sort by alpha
                signals.sort((a, b) => (b.alpha_spread || 0) - (a.alpha_spread || 0));
                
                // Render
                grid.innerHTML = signals.map(s => {
                    const alpha = s.alpha_spread || 0;
                    const pct = (alpha * 100).toFixed(1);
                    const isElite = alpha >= 0.025;
                    const id = s.id || s.event_id || Math.random().toString(36);
                    
                    return `
                        <div class="signal-card ${isElite ? 'elite' : ''}" onclick="openDrawer('${id}')">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <span style="font-size: 20px;">${getIcon(s.sport)}</span>
                                    <span style="font-size: 11px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.05em;">
                                        ${getName(s.sport)}
                                    </span>
                                </div>
                                <span style="font-size: 11px; font-family: 'JetBrains Mono'; color: var(--text-muted);">
                                    ${formatTime(s.match_time)}
                                </span>
                            </div>
                            <h3 style="font-size: 15px; font-weight: 500; margin-bottom: 16px; line-height: 1.3;">
                                ${s.match_name || 'Match Inconnu'}
                            </h3>
                            <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                                <div class="alpha-display">${alpha >= 0 ? '+' : ''}${pct}%</div>
                                ${isElite ? '<span style="font-size: 10px; color: var(--elite-gold); text-transform: uppercase;">🔥 Elite</span>' : ''}
                            </div>
                        </div>
                    `;
                }).join('');
                
                setStatus('', `${signals.length} signaux actifs`);
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('loading-bar').style.display = 'none';
                grid.innerHTML = `
                    <div class="error-state">
                        <div class="empty-state-icon">⚠️</div>
                        <h2>ERREUR DE CONNEXION</h2>
                        <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;">
                            ${error.message}
                        </p>
                        <button onclick="location.reload()" style="padding: 12px 24px; background: rgba(255,255,255,0.1); border: 1px solid var(--border-subtle); color: var(--text-primary); cursor: pointer; font-size: 12px;">
                            🔄 Recharger
                        </button>
                    </div>
                `;
                setStatus('error', 'Erreur API');
            }
        }
        
        // Drawer functions
        function openDrawer(id) {
            const s = signals.find(sig => (sig.id || sig.event_id) === id);
            if (!s) return;
            
            document.getElementById('drawer-sport').innerHTML = `${getIcon(s.sport)} ${getName(s.sport)} | ${formatTime(s.match_time)}`;
            document.getElementById('drawer-match').textContent = s.match_name || '—';
            document.getElementById('drawer-fair').textContent = s.fair_price?.toFixed(2) || '—';
            document.getElementById('drawer-soft').textContent = s.cote_1xbet?.toFixed(2) || '—';
            document.getElementById('drawer-alpha').textContent = `${((s.alpha_spread || 0) * 100).toFixed(2)}%`;
            document.getElementById('drawer-stake').textContent = s.recommended_stake ? `${s.recommended_stake.toFixed(0)}€` : '—';
            document.getElementById('drawer-market').textContent = s.market_type || '—';
            document.getElementById('drawer-selection').textContent = s.selection || '—';
            document.getElementById('drawer-note').textContent = s.note_ia || s.ai_context || '✅ Analyse validée';
            document.getElementById('drawer-link').href = `https://1xbet.com/en/line/?search=${encodeURIComponent(s.match_name || '')}`;
            
            document.getElementById('drawer-overlay').classList.add('active');
            document.getElementById('side-drawer').classList.add('active');
        }
        
        function closeDrawer() {
            document.getElementById('drawer-overlay').classList.remove('active');
            document.getElementById('side-drawer').classList.remove('active');
        }
        
        // Keyboard
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeDrawer();
        });
        
        // Init
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🦅 PAIM Dashboard v3.6 — Initialisation...');
            console.log('API Base:', API_BASE);
            loadSignals();
            setInterval(loadSignals, 30000); // Refresh every 30s
        });
    </script>
</body>
</html>
