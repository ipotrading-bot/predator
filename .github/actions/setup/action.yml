name: Predator — préparation du runner
description: >-
  Python 3.11, dépendances (site-packages mis en cache sur le hash de
  requirements.txt : pip n'est relancé que quand il change), puis préflight
  des secrets du pool via scripts/ci_env.py — l'unique source de vérité des
  clés par job, dérivée du registre IA. Le checkout reste dans l'appelant :
  une action locale ne peut pas tourner avant que le dépôt soit présent.

  Le step appelant DOIT poser le bloc `env:` d'AMORÇAGE de son pool (Supabase
  seul), généré par `python scripts/ci_env.py --write`. NE JAMAIS fabriquer un dump de tous les
  secrets (`toJSON(secrets)`) : GitHub refuse de faire tourner un workflow qui
  en contient un — « GitHub detected that this workflow file may be malicious »,
  conclusion `action_required`, zéro job, aucun log. Vécu le 2026-08-26 sur
  cinq des six workflows. Et la détection a raison : ce dump était lisible par
  chaque step du job, `actions/checkout` compris.

inputs:
  pool:
    description: >-
      Pool de secrets à vérifier — scan | closing | settlement | reprice |
      readonly | backfill (voir scripts/ci_env.py). 'none' → pas de préflight
      (CI de tests, aucun secret).
    default: 'none'
  fast-install:
    description: >-
      'true' → restaure site-packages depuis le cache et saute pip quand
      requirements.txt n'a pas changé. Mettre 'false' pour revenir au pip
      systématique si un paquet natif se comporte mal après restauration.
    default: 'true'

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Restaurer site-packages
      if: inputs.fast-install == 'true'
      id: pkg
      uses: actions/cache@v4
      with:
        path: ${{ env.pythonLocation }}/lib/python3.11/site-packages
        key: ${{ runner.os }}-py311-sitepkg-${{ hashFiles('requirements.txt') }}

    - name: Installer les dépendances
      if: inputs.fast-install != 'true' || steps.pkg.outputs.cache-hit != 'true'
      shell: bash
      run: pip install -r requirements.txt

    # PRÉFLIGHT D'AMORÇAGE SEULEMENT (C5, 2026-08-27). Ce step ne reçoit plus
    # que les clés Supabase : `pip install` ci-dessus exécute le code de
    # dizaines de paquets tiers, et il n'a rien à faire avec les clés IA, de
    # cotes, de Telegram ou de Betfair dans son environnement. Le préflight
    # COMPLET — empreinte Groq, pool Groq, sources de repli — tourne dans le
    # step qui travaille, seul à porter le pool entier.
    - name: Préflight d'amorçage (pool ${{ inputs.pool }})
      if: inputs.pool != 'none'
      shell: bash
      env:
        POOL: ${{ inputs.pool }}
      run: python scripts/ci_env.py --pool "$POOL" --check --amorcage
