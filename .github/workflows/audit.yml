name: Predator Audit

# Settlement + CLV + couche d'apprentissage, toutes les 3 h.
# ⚠️ NE PAS RENOMMER CE FICHIER : api/index.py (/api/audit/run) le déclenche
# par son nom via l'API GitHub (…/actions/workflows/audit.yml/dispatches).
#
# Pool `settlement` (scripts/ci_env.py) : Supabase RW + clé de RÉSULTATS
# (TheSportsDB optionnelle ; ESPN et MLB statsapi sans clé). AUCUNE clé IA : le settlement est
# déterministe depuis le 2026-09-02 (Groq/Tavily supprimés du pipeline).

on:
  schedule:
    # CADENCE CALÉE SUR LES COUPS D'ENVOI, pas sur un chiffre rond. Mesuré le
    # 2026-09-05 sur 131 signaux recommandés : un pari devient réglable à
    # KO + SETTLEMENT_GRACE_H (4 h), et ces heures-là se massent en trois
    # vagues UTC — 02-06 (42 % du total, soirée américaine), 13-14, et 20-23
    # (30 %, soirée européenne). Le cron 0 */6 posait un tick à 00:00, quand
    # 1 % seulement des paris du jour sont réglables, et laissait la vague
    # de 20-23 attendre l'audit de 00:00 le lendemain. Trois heures d'écart
    # ramènent l'attente maximale de 6 h à 3 h sur CHAQUE vague.
    # La minute 45 évite le verrou `predator-signals-write` : scan.yml tire
    # `standard` à :03 et `reprice` à :25.
    # ⚠️ Cadence RÉGULIÈRE volontairement : le chien de garde Cloudflare
    # surveille ce workflow par FRAÎCHEUR (`stale_min`), ce qui n'a de sens
    # que si l'écart entre deux ticks est constant. Un cron « aux bonnes
    # heures » mais irrégulier imposerait le mécanisme de CRÉNEAUX de
    # scan.yml. Changer cette cadence = changer `stale_min` dans
    # scripts/cloudflare_watchdog_worker.js (gardien :
    # tests/test_watchdog_worker.py).
    - cron: '45 */3 * * *'   # 00:45 03:45 06:45 09:45 12:45 15:45 18:45 21:45 UTC
  workflow_dispatch:

# Settlement = UPDATE sur `signals` + INSERT dans `ai_learning_ledger`, en
# concurrence avec la purge des scans : même verrou que scan.yml.
concurrency:
  group: predator-signals-write
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          pool: settlement
        env:
          # ▼ GÉNÉRÉ par `python scripts/ci_env.py --write` — pool `settlement`, amorçage (Supabase seul). NE PAS ÉDITER.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # ▲ fin du bloc généré (pool `settlement`, amorçage (Supabase seul))
      - name: Lancer le moteur d'audit
        env:
          # ▼ GÉNÉRÉ par `python scripts/ci_env.py --write` — pool `settlement`. NE PAS ÉDITER.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
          # ▲ fin du bloc généré (pool `settlement`)
        run: |
          # Préflight COMPLET — voir scan.yml.
          python scripts/ci_env.py --pool settlement --check
          python run_audit.py
