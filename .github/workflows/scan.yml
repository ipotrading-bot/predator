name: Predator Scan

# Le MODE dans le nom du run. Sans ça, le mode n'est lisible qu'en ouvrant
# les steps du job (`Scan (…)`) : le chien de garde Cloudflare ne pouvait donc
# pas distinguer un tick reprice d'un scan standard, et l'absence d'un standard
# était INDÉTECTABLE (2026-09-04 — les reprice horaires maintenaient toujours
# scan.yml « frais »). `gh run list` le montre aussi désormais.
# ⚠️ Le cron cité ici doit exister dans scripts/ci_scan_mode.py::CRON_MODES avec
# CE mode — tests/test_watchdog_worker.py compare les deux.
# Un tick reprice promu par le bouton « Scanner » garde le nom `Scan reprice` :
# le nom est figé au démarrage, la promotion se décide dans un step.
# `github.event.inputs.…` et jamais `inputs.…` nu : la forme nue n'existe pas
# hors dispatch (tests/test_ci_env.py).
run-name: >-
  Scan ${{ github.event.inputs.mode || (github.event.schedule == '25 * * * *' && 'reprice' || 'standard') }}

# ──────────────────────────────────────────────────────────────────
# DEUX MODES, un seul workflow (2026-09-03, décision opérateur : « trop de
# workflows et de process ») — docs/systeme_de_scan.md pour l'opérateur.
#
#   standard  8×/jour aux fenêtres favorables : scan COMPLET, horizon 24 h,
#             Tier 1 OddsAPI + Tier 2 gratuit, puis passe de closing line.
#   reprice   toutes les heures, GRATUIT : reprend le slate soft photographié
#             par le dernier standard, le re-tarife contre Matchbook/Betfair,
#             capte la closing line d'exchange, se tait s'il n'y a rien de
#             neuf. Son pool de secrets ne contient AUCUNE clé payante.
#
# Le mode est déduit du cron qui a tiré (scripts/ci_scan_mode.py, testé) ; les
# secrets sont calculés par pool (scripts/ci_env.py, testé). Le bouton
# « Scanner » du dashboard pose meta.scan_request, lu à chaque tick : un tick
# reprice qui le trouve devient un scan standard complet.
#
# Supprimés le 2026-09-03 : golden (T-2h, 24/j — 100 % fantôme par
# construction et coûteux en crédits), deep (standard avec 100 matchs, jamais
# mesuré), guerrilla (48 h : tranche mesurée perdante). INCIDENTS.md « Cinq
# modes de scan, deux qui servent ».
#
# OddsAPI (Tier 1, payant) : le flag ODDS_API=1 est posé par
# scripts/ci_scan_mode.py (MODE_ENV) pour standard, jamais ici. La dépense est
# bornée par le RYTHME MENSUEL (core/scan_windows), sur 8 ticks/jour.
#
# Cadence : 8 + 24 = 32 invocations/jour, dont 8 scans complets. Ne pas
# remonter sans recalculer le budget des sources gratuites (odds-api.io 400,
# titan007 500 → 12-14 scans complets/jour).
# JAMAIS de nouveau schedule (2026-07-07 : la surcharge de schedules fait
# dériver tous les crons du repo). GitHub ne garantit pas la ponctualité
# (mesuré : 0,48 exécution/h pour un cron horaire) — le chien de garde
# Cloudflare rattrape en `reprice`.
# ──────────────────────────────────────────────────────────────────

on:
  schedule:
    # ⚠️ Toute ligne ici doit exister dans scripts/ci_scan_mode.py::CRON_MODES
    # (tests/test_ci_env.py compare les deux). Minutes décalées entre elles
    # et vis-à-vis de closing_line.yml (H+14/34/54).
    #
    # STANDARD — chaque heure est T-2h30 à T-6h d'un bloc de coups d'envoi
    # (core/scan_windows.py, même carte) : 06 KBO/NPB/AFL/NRL · 09 et 11
    # Big 5 du week-end (11:30–14:00) · 13 Big 5 soirée + MLB matinée ·
    # 16 Big 5 19:00–19:30 · 19 SA + MLB soirée · 21 NFL/NBA/NHL 00:00 ·
    # 23 US tardif + AFL/NRL du lendemain. Recalé le 2026-09-03 : 02/17/19/21
    # tombaient à moins de 2 h des coups d'envoi et n'achetaient que des
    # fantômes (INCIDENTS.md « Telegram après les fantômes », cause d).
    - cron: '3 6,9,11,13,16,19,21,23 * * *'
    # REPRICE — toutes les heures, gratuit. Absorbe le bouton « Scanner »
    # du dashboard (flag meta.scan_request, lu à chaque tick → scan standard).
    - cron: '25 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Mode de scan
        type: choice
        default: standard
        options: [standard, reprice]
      hours_ahead:
        description: Horizon en heures (vide = défaut du mode)
        type: string
        default: ''

# run_engine._save met à jour EN PLACE (select→update/insert) depuis le
# 2026-08-2x, mais _purge_old_signals supprime encore des lignes actives que
# le settlement d'audit.yml peut être en train de régler : scan et audit
# restent sérialisés. cancel-in-progress: false — on met en file plutôt que
# de tuer un run en pleine écriture.
concurrency:
  group: predator-signals-write
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    runs-on: ubuntu-latest
    # Plafond unique (était 15/15/25/15) + la passe closing line. C'est une
    # borne, pas un coût — un run tué à 8 min le 2026-07-07 a coûté un scan.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          pool: scan
        env:
          # ▼ GÉNÉRÉ par `python scripts/ci_env.py --write` — pool `scan`, amorçage (Supabase seul). NE PAS ÉDITER.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # ▲ fin du bloc généré (pool `scan`, amorçage (Supabase seul))

      - name: Résoudre le mode (cron → mode, flag manuel, variables)
        id: mode
        env:
          SCHEDULE:    ${{ github.event.schedule }}
          INPUT_MODE:  ${{ github.event.inputs.mode }}
          INPUT_HOURS: ${{ github.event.inputs.hours_ahead }}
          # ▼ GÉNÉRÉ par `python scripts/ci_env.py --write` — pool `scan`, amorçage (Supabase seul). NE PAS ÉDITER.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # ▲ fin du bloc généré (pool `scan`, amorçage (Supabase seul))
        run: python scripts/ci_scan_mode.py

      - name: Scan (${{ steps.mode.outputs.mode }})
        if: steps.mode.outputs.mode != 'reprice'
        env:
          # ▼ GÉNÉRÉ par `python scripts/ci_env.py --write` — pool `scan`. NE PAS ÉDITER.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
          BETFAIR_CERT: ${{ secrets.BETFAIR_CERT }}
          BETFAIR_CERT_KEY: ${{ secrets.BETFAIR_CERT_KEY }}
          FREE_SOURCES_PROXY: ${{ secrets.FREE_SOURCES_PROXY }}
          FREE_SOURCES_RELAY: ${{ secrets.FREE_SOURCES_RELAY }}
          FREE_SOURCES_RELAY_TOKEN: ${{ secrets.FREE_SOURCES_RELAY_TOKEN }}
          THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OVH_AI_API_KEY: ${{ secrets.OVH_AI_API_KEY }}
          # ▲ fin du bloc généré (pool `scan`)
        run: |
          # Préflight COMPLET : ce step est le seul à porter le pool entier
          # (C5). Les sources de repli ne peuvent se vérifier QUE là où les
          # clés sont réellement présentes.
          python scripts/ci_env.py --pool scan --check
          python run_engine.py

      - name: Closing line — passe post-scan
        # Même moment logique que les signaux frais ; pool `closing` = Supabase
        # RW + Betfair optionnel (l'exchange Matchbook n'a pas de clé). Une
        # passe qui échoue n'annule pas le scan déjà persisté : avertissement.
        if: steps.mode.outputs.mode != 'reprice'
        continue-on-error: true
        env:
          # ▼ GÉNÉRÉ par `python scripts/ci_env.py --write` — pool `closing`. NE PAS ÉDITER.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
          BETFAIR_CERT: ${{ secrets.BETFAIR_CERT }}
          BETFAIR_CERT_KEY: ${{ secrets.BETFAIR_CERT_KEY }}
          # ▲ fin du bloc généré (pool `closing`)
        run: python run_closing_line.py

      - name: REPRICE — Matchbook vs slate soft en cache
        # Le tick horaire. REPRICE=1 vient de $GITHUB_ENV (ci_scan_mode.py,
        # MODE_ENV). Le pool `reprice` ne contient que Supabase + Telegram :
        # garantie MÉCANIQUE que ce step ne peut rien dépenser
        # (tests/test_ci_env.py). Un seul run_engine par tick.
        if: steps.mode.outputs.mode == 'reprice'
        env:
          # ▼ GÉNÉRÉ par `python scripts/ci_env.py --write` — pool `reprice`. NE PAS ÉDITER.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # ▲ fin du bloc généré (pool `reprice`)
        run: python run_engine.py
