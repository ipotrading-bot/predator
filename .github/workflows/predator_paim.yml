name: PREDATOR PAIM — 4 Sessions Automatiques

on:
  schedule:
    - cron: "0 6 * * *"    # 06:00 UTC — Morning Scan (Europe Open)
    - cron: "0 12 * * *"   # 12:00 UTC — Line Mover Audit
    - cron: "0 18 * * *"   # 18:00 UTC — NBA/US Pre-flight
    - cron: "0 23 * * *"   # 23:00 UTC — Settlement Engine

  workflow_dispatch:
    inputs:
      session:
        description: "Session de scan"
        required: false
        default: "manual"
        type: choice
        options: [manual, morning, linemover, nba, settlement]

  repository_dispatch:
    types: [force-scan]

jobs:
  scan:
    name: "🦅 PAIM — ${{ github.event.inputs.session || 'scheduled' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure environment
        run: |
          echo "ODDS_API_KEY=${{ secrets.ODDS_API_KEY }}"               >> $GITHUB_ENV
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}"           >> $GITHUB_ENV
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}"   >> $GITHUB_ENV
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}"       >> $GITHUB_ENV
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}"               >> $GITHUB_ENV
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}"       >> $GITHUB_ENV
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}"               >> $GITHUB_ENV
          echo "NEWS_API_KEY=${{ secrets.NEWS_API_KEY }}"               >> $GITHUB_ENV
          echo "PERPLEXITY_API_KEY=${{ secrets.PERPLEXITY_API_KEY }}"   >> $GITHUB_ENV

      - name: Determine session
        id: session
        run: |
          HOUR=$(date -u +%H)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SESSION="${{ github.event.inputs.session }}"
          elif [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            SESSION="force"
          elif [ "$HOUR" -eq 6 ]; then
            SESSION="morning"
          elif [ "$HOUR" -eq 12 ]; then
            SESSION="linemover"
          elif [ "$HOUR" -eq 18 ]; then
            SESSION="nba"
          elif [ "$HOUR" -eq 23 ]; then
            SESSION="settlement"
          else
            SESSION="manual"
          fi
          echo "name=$SESSION" >> $GITHUB_OUTPUT
          echo "Session: $SESSION"

      # ── 06:00 : Morning Scan + Brief Telegram ────────────────
      - name: Morning Scan (06:00)
        if: steps.session.outputs.name == 'morning'
        run: python main.py --session morning --once
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: "."

      # ── 12:00 : Line Mover Audit ─────────────────────────────
      - name: Line Mover Audit (12:00)
        if: steps.session.outputs.name == 'linemover'
        run: python scripts/line_mover_audit.py
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: "."

      # ── 18:00 : NBA/US Pre-flight ────────────────────────────
      - name: NBA Pre-flight (18:00)
        if: steps.session.outputs.name == 'nba'
        run: python main.py --session nba --once
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: "."

      # ── 23:00 : Settlement Engine ────────────────────────────
      - name: Settlement Engine (23:00)
        if: steps.session.outputs.name == 'settlement'
        run: python scripts/settlement_engine.py
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: "."

      # ── Manuel / Force ───────────────────────────────────────
      - name: Manual / Force Scan
        if: steps.session.outputs.name == 'manual' || steps.session.outputs.name == 'force'
        run: python main.py --session "${{ steps.session.outputs.name }}" --once
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: "."

      - name: Upload scan log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-log-${{ steps.session.outputs.name }}-${{ github.run_number }}
          path: predator_paim.log
          retention-days: 7

      - name: Notify Telegram on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${{ secrets.TELEGRAM_CHAT_ID }}\", \"text\": \"🚨 PREDATOR PAIM — ERREUR\\nSession: ${{ steps.session.outputs.name }}\\nRun #${{ github.run_number }}\", \"parse_mode\": \"Markdown\"}"
