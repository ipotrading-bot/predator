name: Predator Rapport

# Rapport Telegram toutes les 2h, APRÈS le scan (instruction opérateur du
# 2026-08-06 — auparavant 2 rapports/jour, 07:05 et 18:05).
# Envoie : équipe, marché, cote, mise Kelly, alerte erreur si moteur KO
#
# Minute :35 — le créneau est contraint des deux côtés. En amont, laisser au
# scan de H:03 le temps d'écrire ses signaux (un rapport parti trop tôt décrit
# le scan PRÉCÉDENT). En aval, ne pas retomber sur les autres jobs qui se
# sérialisent sur le verrou `predator-signals-write` : golden_hour à H:25,
# deep_scan à H:33 (heures impaires), engine à H:03.
#
# run_rapport.py:REPORT_WINDOW_H doit rester égal à l'intervalle de ce cron.
# À 6h de fenêtre pour un rapport toutes les 2h, chaque signal repartait dans
# trois rapports d'affilée et un rappel devenait indiscernable d'une occasion
# neuve.

on:
  schedule:
    - cron: '35 */2 * * *'   # toutes les 2h à H+35, après le scan de H+03
  workflow_dispatch:         # Déclenchement manuel depuis GitHub Actions

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rapport:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send rapport
        env:
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_rapport.py
