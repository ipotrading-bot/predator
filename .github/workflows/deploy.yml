name: Deploy to Vercel

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "templates/**"
      - "core/**"
      - "requirements.txt"
      - "vercel.json"

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Seul workflow du dépôt sans borne de durée jusqu'au 2026-08-22. Un
    # `vercel deploy` qui reste pendu consommerait les 6 h par défaut de
    # GitHub Actions, sur le workflow le plus fréquent du dépôt.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel (Production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prod --token=$VERCEL_TOKEN --yes
