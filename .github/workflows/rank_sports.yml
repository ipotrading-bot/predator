name: Classement des sports (lecture seule)

# Imprime le classement des sports par réussite réelle depuis
# ai_learning_ledger. LECTURE SEULE : aucune écriture Supabase, aucun signal,
# aucun Telegram — donc volontairement hors du groupe de concurrence
# `predator-signals-write`, il ne peut rien courser.
#
# Reçoit SUPABASE_KEY (anon) et non SUPABASE_SERVICE_KEY : ce job n'a aucune
# raison de détenir un jeton d'écriture.

on:
  workflow_dispatch:
  schedule:
    # Hebdo (Phase 4 du recentrage, 2026-08-22) : la boucle de calibration
    # tourne à date fixe — lundi 07:00 UTC, après l'audit de 06:00 qui a
    # réglé le week-end. Un seul schedule de plus (leçon 2026-07-07).
    - cron: '0 7 * * 1'
  push:
    paths:
      - 'scripts/rank_sports.py'
      - 'scripts/calibration_report.py'
      - '.github/workflows/rank_sports.yml'

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Classer les sports par réussite
        env:
          PYTHONPATH: .
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/rank_sports.py

      - name: Rapport de calibration par bande
        env:
          PYTHONPATH: .
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/calibration_report.py

      - name: Rapport hebdo de vérité (CLV réel, Brier, ROI net taxe, SUSPECT, verdicts)
        # Lecture seule + Telegram. Les verdicts promotion/retrait viennent de
        # meta sport_verdict_* (posés par l'audit) — aucune écriture ici.
        env:
          PYTHONPATH: .
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/weekly_report.py
