name: CI

# tests.yml + deploy.yml fusionnés : le déploiement Vercel attend une suite
# verte (avant : parallèles, une régression pouvait partir en prod).
#
# ⚠️ Ce gate n'est RÉEL que parce que le déploiement Git automatique de Vercel
# est désactivé dans vercel.json ("git.deploymentEnabled.main": false).
# Mesuré le 2026-08-26 : chaque commit touchant api/templates/core partait
# DEUX fois (source `git` ET source `cli`, en course). Tant que la voie Git
# est active, elle déploie sans attendre `test` et ce `needs:` ne protège rien.
#
# Les secrets VERCEL_* vivent dans l'environnement GitHub `production` : aucun
# autre job ne les voit, et ils ne figurent dans aucun bloc généré par
# scripts/ci_env.py. Ce job est le seul à les nommer.

on:
  push:
    paths: &chemins_testes
      - '**.py'
      - 'api/**'
      - 'templates/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'vercel.json'
      # La CI se teste elle-même : tests/test_ci_env lit scan.yml pour
      # vérifier que chaque cron a sa ligne dans CRON_MODES, et
      # tests/test_workflow_secrets lit workflows ET actions. Sans ce
      # chemin, les fichiers gardés changeaient sans réveiller leur gardien —
      # un cron ajouté seul serait passé jusqu'au premier run rouge. Vécu le
      # 2026-08-26 : le correctif de .github/actions/setup n'a déclenché
      # aucun run.
      - '.github/**'
  pull_request:
    paths: *chemins_testes
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup   # pool 'none' : aucun secret, tests purs
        with:
          dev: 'true'                    # pytest + pyflakes, versions verrouillées
      - name: Tests
        run: python -m pytest tests/ -q
      # pyflakes vient de requirements-dev.txt depuis D2. Il était installé
      # ici, dans le `run:`, SANS version : le linter qui juge le dépôt était
      # choisi par PyPI au moment du run.
      - name: Lint
        run: python -m pyflakes $(git ls-files '*.py')

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10   # un `vercel deploy` pendu consommait 6 h avant le 2026-08-22
    steps:
      - uses: actions/checkout@v4
      # ÉPINGLÉ (D2) : `vercel@latest` laissait npm choisir, au moment du run,
      # l'outil qui pousse en PRODUCTION. C'est le dernier maillon flottant de
      # la chaîne de déploiement, et le plus sensible.
      - name: Installer Vercel CLI
        run: npm install -g vercel@59.1.4
      - name: Déployer sur Vercel (production)
        env:
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prod --token=$VERCEL_TOKEN --yes
