name: Predator Closing Line

# Capture du VRAI prix de clôture Pinnacle pour les signaux dont le coup
# d'envoi approche — indépendante de la cadence 6 h du settlement/CLV.
#
# LA FENÊTRE N'EST PAS DE 5 MIN (l'en-tête historique était périmé) :
# core/constants.py — CLOSING_LINE_WINDOW_MIN = 240 (première capture),
# CLOSING_LINE_TIGHTEN_MIN = 90 (on ne re-price qu'à moins de 90 min),
# CLOSING_LINE_REFRESH_MIN = 20 (et jamais plus souvent que toutes les 20 min).
# Un tick plus fréquent que 20 min est donc, par construction, un no-op pour
# un signal DÉJÀ tarifé (~1 min de runner pour rien).
#
# ⚠️ NUANCE MESURÉE, à lire avant de remonter ou redescendre cette cadence :
# GitHub ne livre pas les ticks demandés. Mesuré le 2026-08-01 : 0,48
# exécution/h pour un cron horaire. L'ancien `4-59/10` demandait 6 ticks/h
# pour en faire atterrir ~2,9, soit un espacement réel proche des 20 min de
# REFRESH_MIN — ce n'était pas du gaspillage pur. À 3 ticks/h demandés on en
# livre ~1,4, espacement médian ~40 min. Ce qui compense : une passe à la fin
# de CHAQUE scan (scan.yml, 36/j), soit 108 passes/jour contre 144 ticks
# avant. Elles sont agglutinées sur les minutes de scan et non réparties :
# surveiller `count_missed_closing_lines` (loggé par run_closing_line.py) —
# s'il monte, le retour arrière tient en une ligne.
#
# HORS du verrou `predator-signals-write`. Justification exacte, parce que la
# version courte est fausse : le SETTLEMENT ne peut pas toucher ces lignes
# (fetch_closing_line_candidates prend `match_time >= now`, fetch_pending
# `match_time < now − 4 h`). La PURGE, elle, le peut : les `purge_rules` de
# run_engine._purge_old_signals suppriment des lignes actives sur des critères
# de qualité (edge, sharp_prob, SUSPECT_DATA…) SANS filtre sur match_time.
# Mais elle ne peut que les SUPPRIMER, et Postgres sérialise déjà cette course
# ligne par ligne : au pire une écriture est perdue sur une ligne que la purge
# condamnait de toute façon. Le verrou n'achetait pas de correction — il
# achetait de l'attente derrière un deep scan de 25 min.

on:
  schedule:
    - cron: '14,34,54 * * * *'   # = CLOSING_LINE_REFRESH_MIN, décalé des ticks de scan
  workflow_dispatch:

concurrency:
  group: predator-closing-line
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  closing-line:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          pool: closing
        env:
          # ▼ GÉNÉRÉ par `python scripts/ci_env.py --write` — pool `closing`. NE PAS ÉDITER.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CHUTES_API_KEY: ${{ secrets.CHUTES_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OVH_AI_API_KEY: ${{ secrets.OVH_AI_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          SCALEWAY_API_KEY: ${{ secrets.SCALEWAY_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          UPSTAGE_API_KEY: ${{ secrets.UPSTAGE_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # ▲ fin du bloc généré (pool `closing`)
      - name: Capturer les closing lines
        env:
          # ▼ GÉNÉRÉ par `python scripts/ci_env.py --write` — pool `closing`. NE PAS ÉDITER.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CHUTES_API_KEY: ${{ secrets.CHUTES_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OVH_AI_API_KEY: ${{ secrets.OVH_AI_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          SCALEWAY_API_KEY: ${{ secrets.SCALEWAY_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          UPSTAGE_API_KEY: ${{ secrets.UPSTAGE_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # ▲ fin du bloc généré (pool `closing`)
        run: python run_closing_line.py
