name: Predator Closing Line

# Runs hourly to capture the REAL Pinnacle closing price (~5min before
# kickoff) for signals about to go live — Task 3 of the PAIM v9.5 audit.
# Independent of audit.yml's 6h settlement/CLV cadence: a 5-minute
# pre-kickoff window rarely lines up with a 6h schedule, so most matches
# would otherwise never get a genuine closing-line measurement at all.
# Manual trigger available for testing.

on:
  schedule:
    # Measured 2026-08-01: a '0 * * * *' cron here delivered only 0.48 runs/h
    # (100 runs over 206h), median gap between executions 116 min, worst 254.
    # GitHub drops scheduled ticks under load and never backfills them, so the
    # capture window can't be sized to the requested cadence — only to the
    # delivered one. Asking every 10 min (offset off the :00 rush, where
    # contention is worst) raises the number of executions that actually land;
    # core/audit_engine.py then refreshes each signal's price on whichever runs
    # do fire, so a dropped tick costs precision, never the whole measurement.
    # Cost: ~6x the Actions minutes of the hourly schedule (~30s per run).
    - cron: '4-59/10 * * * *'
  workflow_dispatch:

# Shared with golden_hour.yml/engine.yml/deep_scan.yml/audit.yml — same
# reasoning as audit.yml: avoid a purge or settlement UPDATE racing this
# job's write to the same still-'active' signal row.
concurrency:
  group: predator-signals-write
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  closing-line:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Verify required secrets are present
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          missing=""
          [ -z "$SUPABASE_URL" ]  && missing="$missing SUPABASE_URL"
          [ -z "$SUPABASE_KEY" ]  && missing="$missing SUPABASE_KEY"
          [ -z "$SUPABASE_SERVICE_KEY" ] && missing="$missing SUPABASE_SERVICE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing — job would otherwise exit 0 having captured nothing"
            exit 1
          fi
          # Same RLS role check as audit.yml — see that workflow for the
          # full 2026-07-07 incident writeup this guards against.
          if [[ "$SUPABASE_SERVICE_KEY" == sb_secret_* ]]; then
            role="service_role"
          elif [[ "$SUPABASE_SERVICE_KEY" == sb_publishable_* ]]; then
            role="anon"
          else
            role=$(python3 -c "import base64,json,os; s=os.environ.get('SUPABASE_SERVICE_KEY','').split('.'); print(json.loads(base64.urlsafe_b64decode(s[1]+'='*(-len(s[1])%4))).get('role','?') if len(s)>1 else '?')" 2>/dev/null || echo "?")
          fi
          if [ "$role" != "service_role" ]; then
            echo "::error::SUPABASE_SERVICE_KEY decodes to role='$role', not 'service_role' — this is the anon/publishable key, not the service_role secret. Writes will be rejected by RLS (42501). Fix: Supabase dashboard -> Project Settings -> API Keys -> copy the 'service_role' secret into this GitHub secret (not 'anon'/'public')."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Capture closing lines
        env:
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2:     ${{ secrets.GROQ_API_KEY_2 }}
          # GROQ_API_KEY_3 volontairement absent : c'est la clé réservée au
          # settlement (audit.yml). Voir le cloisonnement des quotas du
          # 2026-08-02 — les scans, 10x plus nombreux que l'audit, vidaient le
          # TPD avant qu'un seul WIN/LOSS soit écrit. _4 est la clé d'appoint
          # des scans : elle élargit LEUR réserve sans toucher à celle de l'audit.
          GROQ_API_KEY_4:     ${{ secrets.GROQ_API_KEY_4 }}
          TAVILY_API_KEY:     ${{ secrets.TAVILY_API_KEY }}
          # ── Routeur IA multi-fournisseurs (core/ai_router.py) ──
          # Une clé absente = fournisseur ignoré silencieusement. Sans ces
          # lignes, les secrets n'atteignent jamais le code : le routeur ne
          # verrait que Groq et toute la capacité ajoutée resterait morte.
          OPENROUTER_API_KEY:     ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN:   ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID:  ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OLLAMA_API_KEY:         ${{ secrets.OLLAMA_API_KEY }}
          NVIDIA_NIM_API_KEY:     ${{ secrets.NVIDIA_NIM_API_KEY }}
          COHERE_API_KEY:         ${{ secrets.COHERE_API_KEY }}
          UPSTAGE_API_KEY:        ${{ secrets.UPSTAGE_API_KEY }}
          NEBIUS_API_KEY:         ${{ secrets.NEBIUS_API_KEY }}
          MODELSCOPE_API_KEY:     ${{ secrets.MODELSCOPE_API_KEY }}
          SCALEWAY_API_KEY:       ${{ secrets.SCALEWAY_API_KEY }}
          OVH_AI_API_KEY:         ${{ secrets.OVH_AI_API_KEY }}
          SILICONFLOW_API_KEY:    ${{ secrets.SILICONFLOW_API_KEY }}
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python run_closing_line.py
