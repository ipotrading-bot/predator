name: Predator On-Demand Scan

# Ancien poller (5 puis 15 min, 288 puis 96 déclenchements/jour) — supprimé.
# À lui seul il représentait ~81% de tous les triggers cron planifiés du
# repo, et GitHub Actions retarde/ignore les schedules sous forte charge :
# golden_hour.yml (déclaré */30) tournait en réalité toutes les 1 à 4h30 à
# cause de cette surcharge, d'où les scans "Dernier scan" figés de plusieurs
# heures sur le dashboard.
#
# La vérification du flag Supabase meta.scan_request (posé par le bouton
# Scanner du dashboard) est désormais faite gratuitement dans golden_hour.yml
# à chaque exécution déjà planifiée (toutes les 30 min) — voir son step
# "Check manual scan request". Ce fichier n'a plus de schedule ; il reste
# disponible en workflow_dispatch pour un test/déclenchement manuel ponctuel.

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check scan request in Supabase
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          RESULT=$(curl -sf \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/meta?key=eq.scan_request&select=value" \
            2>/dev/null || echo "[]")
          COUNT=$(echo "$RESULT" | python3 -c "import json,sys; print(len(json.load(sys.stdin)))" 2>/dev/null || echo "0")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt "0" ]; then
            echo "Demande de scan détectée — démarrage"
          else
            echo "Aucune demande de scan — arrêt"
          fi

      - name: Clear scan request flag
        if: steps.check.outputs.count > 0
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          curl -sf -X DELETE \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/meta?key=eq.scan_request" \
            > /dev/null

      - uses: actions/checkout@v4
        if: steps.check.outputs.count > 0

      - uses: actions/setup-python@v5
        if: steps.check.outputs.count > 0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.check.outputs.count > 0
        run: pip install -r requirements.txt

      - name: Run On-Demand scan (guerrilla — sans OddsAPI)
        if: steps.check.outputs.count > 0
        env:
          GUERRILLA:          "1"
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_engine.py
