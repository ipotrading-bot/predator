# PREDATOR PAIM v7.0 — Pulse Hunter Engine (GitHub Actions)
# Cerveau Déporté — contourne le timeout 10s de Vercel.
# Fréquence : toutes les 20 minutes (gratuit, illimité)
# Exécute run_engine.py qui fait le travail lourd (Harvester + Oracle + PAIM)

name: PULSE HUNTER — Scan Toutes les 20min

on:
  schedule:
    # Pulse Hunter: scan toutes les 20 minutes, 24h/24
    - cron: "*/20 * * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "Mode de scan"
        required: false
        default: "pulse"
        type: choice
        options: [pulse, morning, linemover, nba, settlement, hunter]

  repository_dispatch:
    types: [force-scan, hunter-mode]

jobs:
  engine:
    name: "🦅 PAIM Engine — ${{ github.event.inputs.mode || 'pulse' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 25  # Les appels IA peuvent prendre 15-20s chacun
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure environment
        run: |
          echo "ODDS_API_KEY=${{ secrets.ODDS_API_KEY }}"               >> $GITHUB_ENV
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}"           >> $GITHUB_ENV
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}"   >> $GITHUB_ENV
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}"       >> $GITHUB_ENV
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}"               >> $GITHUB_ENV
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}"               >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}" >> $GITHUB_ENV
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}"               >> $GITHUB_ENV
          echo "NEWS_API_KEY=${{ secrets.NEWS_API_KEY }}"               >> $GITHUB_ENV
          echo "PERPLEXITY_API_KEY=${{ secrets.PERPLEXITY_API_KEY }}"   >> $GITHUB_ENV
          echo "RAPIDAPI_KEY=${{ secrets.RAPIDAPI_KEY }}"               >> $GITHUB_ENV
          echo "API_FOOTBALL_KEY=${{ secrets.API_FOOTBALL_KEY }}"       >> $GITHUB_ENV

      - name: Determine mode
        id: mode
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${{ github.event.inputs.mode }}"
          elif [[ "${{ github.event_name }}" == "repository_dispatch" && "${{ github.event.action }}" == "hunter-mode" ]]; then
            MODE="hunter"
          else
            MODE="pulse"
          fi
          echo "name=$MODE" >> $GITHUB_OUTPUT
          echo "Mode: $MODE"

      # ── MODE PULSE (toutes les 20 minutes) ──────────────────────
      - name: Pulse Hunter Scan
        if: steps.mode.outputs.name == 'pulse'
        run: python run_engine.py
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: "."

      # ── MODE HUNTER (saturation multi-sport) ────────────────────
      - name: Mode HUNTER — Saturation Multi-Sport
        if: steps.mode.outputs.name == 'hunter'
        run: python main.py --session hunter --once
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: "."

      # ── MODE MORNING (06:00) — Brief complet ────────────────────
      - name: Morning Brief
        if: steps.mode.outputs.name == 'morning'
        run: python main.py --session morning --once
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: "."

      # ── MODE NBA (US Pre-flight) ────────────────────────────────
      - name: NBA Pre-flight
        if: steps.mode.outputs.name == 'nba'
        run: python main.py --session nba --once
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: "."

      # ── MODE SETTLEMENT ─────────────────────────────────────────
      - name: Settlement Engine
        if: steps.mode.outputs.name == 'settlement'
        run: python scripts/settlement_engine.py
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: "."

      - name: Upload scan log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-log-${{ github.run_id }}
          path: predator_paim.log
          retention-days: 3

      - name: Notify Telegram on critical failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${{ secrets.TELEGRAM_CHAT_ID }}\", \"text\": \"🚨 PREDATOR ENGINE — ERREUR\\nMode: ${{ steps.mode.outputs.name }}\\nRun #${{ github.run_number }}\", \"parse_mode\": \"Markdown\"}"