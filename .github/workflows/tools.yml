name: Predator Tools (manuel)

# Utilitaires déclenchés À LA MAIN uniquement — aucun schedule ici, jamais.
#   monte_carlo     — aide à la décision avant tout retrait. Pool `readonly`.
#   backfill_ledger — remplit ai_learning_ledger depuis les signaux en statut
#                     terminal (one-shot, idempotent). Pool `backfill`, prend
#                     le verrou des scans (écrit dans le ledger).

on:
  workflow_dispatch:
    inputs:
      tool:
        type: choice
        default: monte_carlo
        options: [monte_carlo, backfill_ledger]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  monte_carlo:
    if: github.event.inputs.tool == 'monte_carlo'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          pool: readonly
        env:
          # ▼ GÉNÉRÉ par `python scripts/ci_env.py --write` — pool `readonly`. NE PAS ÉDITER.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # ▲ fin du bloc généré (pool `readonly`)
      - name: Simulation Monte Carlo
        env:
          # ▼ GÉNÉRÉ par `python scripts/ci_env.py --write` — pool `readonly`. NE PAS ÉDITER.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # ▲ fin du bloc généré (pool `readonly`)
        run: python run_monte_carlo.py

  backfill_ledger:
    if: github.event.inputs.tool == 'backfill_ledger'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: predator-signals-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          pool: backfill
        env:
          # ▼ GÉNÉRÉ par `python scripts/ci_env.py --write` — pool `backfill`. NE PAS ÉDITER.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # ▲ fin du bloc généré (pool `backfill`)
      - name: Backfill du ledger
        env:
          # ▼ GÉNÉRÉ par `python scripts/ci_env.py --write` — pool `backfill`. NE PAS ÉDITER.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # ▲ fin du bloc généré (pool `backfill`)
        run: python backfill_ledger.py
