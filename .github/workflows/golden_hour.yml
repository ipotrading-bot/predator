name: Predator Golden Hour

# Scan toutes les 20 min — 7 sport_keys prioritaires (WC+NBA+NHL+MLB+KBO+NPB+Copa)
# Fenêtre T-120min — détecte les mouvements de ligne Pinnacle→1XBet pré-match.
# Budget 20k req/mois : 72 exec/j × 7 sports = 504 req/j max → 15 120 req/mois.
# Engine + Deep (19 sports × 8×/j) = 4 560 req/mois → TOTAL MAX ≈ 19 680/mois.

on:
  schedule:
    - cron: '*/20 * * * *'  # Toutes les 20 minutes, 24h/24
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  golden-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Golden Hour scan (T-120min)
        env:
          GOLDEN_HOUR:        "1"
          ODDS_API_KEY:       ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          BETFAIR_APP_KEY:    ${{ secrets.BETFAIR_APP_KEY }}
          BETFAIR_USERNAME:   ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD:   ${{ secrets.BETFAIR_PASSWORD }}
        run: python run_engine.py
