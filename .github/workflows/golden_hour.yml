name: Predator Golden Hour

# ══════════════════════════════════════════════════════════════════
# BUDGET — SPORT_KEYS (core/odds_api.py) a 19 clés actives réelles, pas 11 :
# ce chiffre a déjà dérivé une fois (voir docstring d'odds_api.py) et a
# recommencé à dériver silencieusement depuis l'ajout des ligues Big-5.
#
#   Golden Hour : 24 exec/j × 19 keys =  456 req/j → ~13 880/mois
#   Engine      : 10 exec/j × 19 keys =  190 req/j →  ~5 784/mois
#   Deep Scan   :  4 exec/j × 19 keys =   76 req/j →  ~2 313/mois
#   ──────────────────────────────────────────────────────────────
#   TOTAL réel                         =  722 req/j → ~21 977/mois
#
# 2026-07-23 — CADENCE RAMENÉE DE 30 MIN À 1 H (décision opérateur).
# Divise par deux la consommation de Golden Hour (912 → 456 req/j) et le
# total du repo de ~39 % (35 857 → 21 977/mois).
#
# ⚠️ MAIS L'ORDRE DE GRANDEUR NE COLLE TOUJOURS PAS, et il faut le dire
# clairement plutôt que de laisser croire que ce changement suffit. Le
# « budget annoncé = 20 000/mois » écrit ici avant cette date correspond à
# un palier OddsAPI payant. La clé réellement en service le 2026-07-23
# relève du PLAN GRATUIT : 500 requêtes/MOIS au total, vérifié sur les logs
# (`quota guard — 47 remaining`, soit ~453 déjà consommées).
#
# À 19 clés de sport, 500 req/mois ne suffisent pas, quelle que soit la
# cadence : un seul scan complet par JOUR coûte déjà 19 × 30 = 570 req/mois.
# Le vrai levier n'est donc pas ici mais dans SPORT_KEYS (core/odds_api.py),
# ou dans le palier souscrit. Espacer le cron réduit la casse, il ne la
# supprime pas.
#
# Le quota guard (`quota_remaining < 50` dans core/odds_api.py) empêche un
# blocage total, mais à ce volume il se déclenche en permanence — constaté
# le 2026-07-23 : figé à 47 sur cinq runs consécutifs, une seule clé de
# sport interrogée par scan, le moteur vivant uniquement sur ses sources de
# repli. Voir aussi le fix du 2026-07-07 qui évite au moins de perdre les
# events déjà récupérés quand ça arrive (HTTP 422 faisait `return []` au
# lieu de `break`).
#
# 2026-07-07 : run réel tué par le timeout de 8 min (job 28865964902,
# 12:25→12:34 UTC), aucun signal écrit, scan suivant absorbé par le trou —
# timeout remonté à 12 min (aligné sur on_demand.yml) pour absorber le
# fallback Gemini (Oracle, jusqu'à 3 calls) sans se faire tuer en plein run.
# ══════════════════════════════════════════════════════════════════
#
# Fenêtre T-120min — détecte les mouvements de ligne Pinnacle→1XBet
# pré-match sur les sports sélectionnés (lag documenté uniquement).
# Intervalle 1 h, 24 passes/jour (était 30 min / 48 passes avant le
# 2026-07-23 — voir le bloc BUDGET ci-dessus).
#
# Absorbe aussi la demande de scan manuel (bouton Scanner du dashboard) —
# on_demand.yml pollait Supabase toutes les 5 min (288 déclenchements/jour,
# ~81% de tous les triggers cron planifiés du repo) rien que pour ça, et
# GitHub Actions retarde/ignore les schedules sous forte charge : ce fichier,
# pourtant déclaré */30, tournait en réalité toutes les 1 à 4h30. Ce poller
# a été supprimé (on_demand.yml — schedule retiré puis fichier supprimé le
# 2026-07-07, il ne faisait plus que dupliquer ce check) ; la vérification du
# flag se fait maintenant ici, gratuitement, à chaque exécution déjà planifiée.
#
# ⚠️ CONSÉQUENCE DU PASSAGE À 1 H : la latence du bouton « Scanner » du
# dashboard double, de ≤30 min à ≤60 min. C'est le prix du quota, et c'est
# assumé — mais ne pas re-créer un poller dédié pour compenser, c'est
# exactement l'erreur du 2026-07-07 décrite ci-dessus.

on:
  schedule:
    # H+25 et non H+00 : `predator-signals-write` sérialise ce job avec
    # closing_line.yml (H+00), engine.yml (H+03) et deep_scan.yml (H+33).
    # Les faire démarrer à la même minute les mettrait en file d'attente
    # les uns derrière les autres — closing_line a une fenêtre de capture
    # de ~5 min avant le coup d'envoi, elle ne supporte pas d'attendre.
    - cron: '25 * * * *'  # Toutes les heures, 24h/24 (24/jour)
  workflow_dispatch:

# Shared with engine.yml/deep_scan.yml/audit.yml — all read/write
# the same `signals`/`ai_learning_ledger` rows via non-atomic delete+insert
# (run_engine.py _save/_archive_before_purge, core/audit_engine.py settlement).
# Without this, two of these workflows overlapping in wall-clock time can
# double-write or race a purge against an in-flight settlement update.
# cancel-in-progress: false — queue the newer run rather than kill one
# mid-write, which would be worse than waiting.
concurrency:
  group: predator-signals-write
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  golden-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # 12 → 15 le 2026-08-22 : le job porte désormais deux
                          # exécutions (golden hour + REPRICE, ce dernier < 1 min)

    steps:
      - name: Verify required secrets are present
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          # ── Routeur IA multi-fournisseurs (core/ai_router.py) ──
          # Une clé absente = fournisseur ignoré silencieusement. Sans ces
          # lignes, les secrets n'atteignent jamais le code : le routeur ne
          # verrait que Groq et toute la capacité ajoutée resterait morte.
          OPENROUTER_API_KEY:     ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN:   ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID:  ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OLLAMA_API_KEY:         ${{ secrets.OLLAMA_API_KEY }}
          NVIDIA_NIM_API_KEY:     ${{ secrets.NVIDIA_NIM_API_KEY }}
          COHERE_API_KEY:         ${{ secrets.COHERE_API_KEY }}
          UPSTAGE_API_KEY:        ${{ secrets.UPSTAGE_API_KEY }}
          NEBIUS_API_KEY:         ${{ secrets.NEBIUS_API_KEY }}
          MODELSCOPE_API_KEY:     ${{ secrets.MODELSCOPE_API_KEY }}
          SCALEWAY_API_KEY:       ${{ secrets.SCALEWAY_API_KEY }}
          OVH_AI_API_KEY:         ${{ secrets.OVH_AI_API_KEY }}
          SILICONFLOW_API_KEY:    ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          missing=""
          [ -z "$SUPABASE_URL" ]  && missing="$missing SUPABASE_URL"
          [ -z "$SUPABASE_KEY" ]  && missing="$missing SUPABASE_KEY"
          [ -z "$SUPABASE_SERVICE_KEY" ] && missing="$missing SUPABASE_SERVICE_KEY"
          [ -z "$ODDS_API_KEY" ]  && missing="$missing ODDS_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing — job would otherwise exit 0 having scanned/persisted nothing"
            exit 1
          fi
          # 2026-07-07 incident: SUPABASE_SERVICE_KEY was present but held the
          # anon/publishable key, not the service_role secret — it authenticates
          # fine (no 401) then fails every single write with RLS 42501, silently,
          # for as long as nobody notices the "0/N persisted" log line. Decode
          # the JWT locally (no network call) and fail loud right here instead.
          # Handles both the legacy JWT format (role claim in the payload)
          # and Supabase's newer sb_secret_.../sb_publishable_... keys
          # (role is the prefix, not a JWT at all — decoding one as base64
          # silently returns role='?', which is what happened here).
          if [[ "$SUPABASE_SERVICE_KEY" == sb_secret_* ]]; then
            role="service_role"
          elif [[ "$SUPABASE_SERVICE_KEY" == sb_publishable_* ]]; then
            role="anon"
          else
            role=$(python3 -c "import base64,json,os; s=os.environ.get('SUPABASE_SERVICE_KEY','').split('.'); print(json.loads(base64.urlsafe_b64decode(s[1]+'='*(-len(s[1])%4))).get('role','?') if len(s)>1 else '?')" 2>/dev/null || echo "?")
          fi
          if [ "$role" != "service_role" ]; then
            echo "::error::SUPABASE_SERVICE_KEY decodes to role='$role', not 'service_role' — this is the anon/publishable key, not the service_role secret. Writes will be rejected by RLS (42501). Fix: Supabase dashboard -> Project Settings -> API Keys -> copy the 'service_role' secret into this GitHub secret (not 'anon'/'public')."
            exit 1
          fi
          # Incident 2026-08-10 -> 08-20: ten days of '0 matchs, 0 signaux' while the
          # operator believed the fallback sources were configured. Say, in every run
          # summary, which fallback credentials actually reach the engine. Warning
          # only: none of these is mandatory, but a scan with none of them has
          # exactly one source (the OddsAPI pool) and no net underneath it.
          fb=""
          [ -z "$API_FOOTBALL_KEY" ] && fb="$fb API_FOOTBALL_KEY"
          [ -z "$GROQ_API_KEY" ]     && fb="$fb GROQ_API_KEY"
          [ -z "$TAVILY_API_KEY" ]   && fb="$fb TAVILY_API_KEY"
          if [ -n "$fb" ]; then
            echo "::warning::Fallback sources NOT configured (empty secrets):$fb — if the OddsAPI pool is dead this scan has no other source of matches"
          else
            echo "Fallback sources configured: API_FOOTBALL_KEY GROQ_API_KEY TAVILY_API_KEY"
          fi

      - name: Check manual scan request
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # RLS blocks DELETE on `meta` for the anon key, same as `signals` —
          # this used the anon key for the DELETE below until 2026-07-07,
          # which meant the flag could silently fail to clear and keep
          # re-triggering guerrilla mode every 30min. Read still uses the
          # anon key (SELECT is allowed); only the DELETE needs service_role.
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          RESULT=$(curl -sf \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/meta?key=eq.scan_request&select=value" \
            2>/dev/null || echo "[]")
          COUNT=$(echo "$RESULT" | python3 -c "import json,sys; print(len(json.load(sys.stdin)))" 2>/dev/null || echo "0")
          if [ "$COUNT" -gt "0" ]; then
            echo "manual=true" >> "$GITHUB_OUTPUT"
            curl -sf -X DELETE \
              -H "apikey: $SUPABASE_SERVICE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
              "$SUPABASE_URL/rest/v1/meta?key=eq.scan_request" > /dev/null \
              || echo "::warning::scan_request flag DELETE failed — it may re-trigger guerrilla mode next run"
            echo "Demande de scan manuelle détectée — mode guerrilla (sans OddsAPI)"
          else
            echo "manual=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Golden Hour scan (T-120min)
        env:
          GOLDEN_HOUR:        ${{ steps.check.outputs.manual != 'true' && '1' || '' }}
          GUERRILLA:          ${{ steps.check.outputs.manual == 'true' && '1' || '' }}
          ODDS_API_KEY:       ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEYS:      ${{ secrets.ODDS_API_KEYS }}
          API_FOOTBALL_KEY:   ${{ secrets.API_FOOTBALL_KEY }}
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2:     ${{ secrets.GROQ_API_KEY_2 }}
          # GROQ_API_KEY_3 volontairement absent : c'est la clé réservée au
          # settlement (audit.yml). Voir le cloisonnement des quotas du
          # 2026-08-02 — les scans, 10x plus nombreux que l'audit, vidaient le
          # TPD avant qu'un seul WIN/LOSS soit écrit. _4 est la clé d'appoint
          # des scans : elle élargit LEUR réserve sans toucher à celle de l'audit.
          GROQ_API_KEY_4:     ${{ secrets.GROQ_API_KEY_4 }}
          TAVILY_API_KEY:     ${{ secrets.TAVILY_API_KEY }}
          # ── Routeur IA multi-fournisseurs (core/ai_router.py) ──
          # Une clé absente = fournisseur ignoré silencieusement. Sans ces
          # lignes, les secrets n'atteignent jamais le code : le routeur ne
          # verrait que Groq et toute la capacité ajoutée resterait morte.
          OPENROUTER_API_KEY:     ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN:   ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID:  ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OLLAMA_API_KEY:         ${{ secrets.OLLAMA_API_KEY }}
          NVIDIA_NIM_API_KEY:     ${{ secrets.NVIDIA_NIM_API_KEY }}
          COHERE_API_KEY:         ${{ secrets.COHERE_API_KEY }}
          UPSTAGE_API_KEY:        ${{ secrets.UPSTAGE_API_KEY }}
          NEBIUS_API_KEY:         ${{ secrets.NEBIUS_API_KEY }}
          MODELSCOPE_API_KEY:     ${{ secrets.MODELSCOPE_API_KEY }}
          SCALEWAY_API_KEY:       ${{ secrets.SCALEWAY_API_KEY }}
          OVH_AI_API_KEY:         ${{ secrets.OVH_AI_API_KEY }}
          SILICONFLOW_API_KEY:    ${{ secrets.SILICONFLOW_API_KEY }}
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          BETFAIR_APP_KEY:    ${{ secrets.BETFAIR_APP_KEY }}
          BETFAIR_USERNAME:   ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD:   ${{ secrets.BETFAIR_PASSWORD }}
          BETFAIR_CERT:       ${{ secrets.BETFAIR_CERT }}
          BETFAIR_CERT_KEY:   ${{ secrets.BETFAIR_CERT_KEY }}
        run: python run_engine.py

      - name: Run REPRICE scan (Matchbook vs slate soft en cache)
        # Réutilise le cron horaire existant — JAMAIS de nouveau schedule
        # (leçon du 2026-07-07 : la surcharge de schedules fait dériver tous
        # les crons du repo). Aucune clé payante dans cet env : Matchbook est
        # sans clé ni compte (700 req/min) et le slate soft vient de
        # meta.cache_soft_slate (posé par engine/deep/guerrilla, TTL 4h).
        # L'ABSENCE d'ODDS_API_KEY/GROQ/TAVILY/API_FOOTBALL ici est la
        # garantie mécanique que ce step ne peut rien dépenser.
        # Sauté sur un tick manuel : le step précédent vient alors de faire
        # un scan GUERRILLA complet qui a rafraîchi le slate — repricer les
        # mêmes données dans la même minute n'apporte rien.
        if: steps.check.outputs.manual != 'true'
        env:
          REPRICE:              '1'
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:         ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_engine.py
