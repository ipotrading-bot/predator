name: Predator Golden Hour

# ══════════════════════════════════════════════════════════════════
# BUDGET 20 000 req/mois — Optimisation 11 sport keys (100 %)
#
#   Golden Hour : 48 exec/j × 11 keys =  528 req/j → 15 840/mois
#   Engine      : 10 exec/j × 11 keys =  110 req/j →  3 300/mois
#   Deep Scan   :  4 exec/j × 11 keys =   44 req/j →  1 320/mois
#   ──────────────────────────────────────────────────────────────
#   TOTAL brut                         =  682 req/j → 20 460/mois
#   Quota guard (stop à 50 restantes)  →  usage effectif ≈ 100 % ✓
# ══════════════════════════════════════════════════════════════════
#
# Fenêtre T-120min — détecte les mouvements de ligne Pinnacle→1XBet
# pré-match sur les 11 sports sélectionnés (lag documenté uniquement).
# Intervalle 30 min = couverture optimale, 48 passes/jour.

on:
  schedule:
    - cron: '*/30 * * * *'  # Toutes les 30 minutes, 24h/24 (48/jour)
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  golden-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Golden Hour scan (T-120min)
        env:
          GOLDEN_HOUR:        "1"
          ODDS_API_KEY:       ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          BETFAIR_APP_KEY:    ${{ secrets.BETFAIR_APP_KEY }}
          BETFAIR_USERNAME:   ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD:   ${{ secrets.BETFAIR_PASSWORD }}
        run: python run_engine.py
