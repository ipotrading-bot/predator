name: Predator Golden Hour

# ══════════════════════════════════════════════════════════════════
# BUDGET 20 000 req/mois — Optimisation mathématique (30 sport keys)
#
#   Équation : 7×G + 30×(E+D) = 666,67 req/jour
#   Solution : G=48/j (I=30min) | E=8/j | D=3/j
#
#   Golden Hour : 48 exec/j × 7  keys =  336 req/j → 10 080/mois
#   Engine      :  8 exec/j × 30 keys =  240 req/j →  7 200/mois
#   Deep Scan   :  3 exec/j × 30 keys =   90 req/j →  2 700/mois
#   ──────────────────────────────────────────────────────────────
#   TOTAL                              =  666 req/j → 19 980/mois
#   Usage budget                                      99,9 % ✓
# ══════════════════════════════════════════════════════════════════
#
# Fenêtre T-120min — détecte les mouvements de ligne Pinnacle→1XBet
# pré-match. Intervalle 30 min = couverture correcte pour tous sports.

on:
  schedule:
    - cron: '*/30 * * * *'  # Toutes les 30 minutes, 24h/24 (48/jour)
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  golden-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Golden Hour scan (T-120min)
        env:
          GOLDEN_HOUR:        "1"
          ODDS_API_KEY:       ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          BETFAIR_APP_KEY:    ${{ secrets.BETFAIR_APP_KEY }}
          BETFAIR_USERNAME:   ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD:   ${{ secrets.BETFAIR_PASSWORD }}
        run: python run_engine.py
