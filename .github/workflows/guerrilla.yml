name: Predator Guerrilla Scan

# Scan sans OddsAPI — 1XBet direct feed + Pinnacle via Gemini Search
# Déclencher manuellement quand le quota OddsAPI est épuisé

on:
  workflow_dispatch:

# Shared with golden_hour.yml/engine.yml/deep_scan.yml/audit.yml — this writes
# to the same signals/ai_learning_ledger rows via run_engine.py's non-atomic
# delete+insert. Was previously missing this group entirely (the one write
# workflow in the repo without it) — a manual trigger overlapping a scheduled
# run could double-write or race a purge against an in-flight settlement.
concurrency:
  group: predator-signals-write
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  guerrilla-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Verify required secrets are present
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          missing=""
          [ -z "$SUPABASE_URL" ]  && missing="$missing SUPABASE_URL"
          [ -z "$SUPABASE_KEY" ]  && missing="$missing SUPABASE_KEY"
          [ -z "$SUPABASE_SERVICE_KEY" ] && missing="$missing SUPABASE_SERVICE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing — job would otherwise exit 0 having scanned/persisted nothing"
            exit 1
          fi
          if [[ "$SUPABASE_SERVICE_KEY" == sb_secret_* ]]; then
            role="service_role"
          elif [[ "$SUPABASE_SERVICE_KEY" == sb_publishable_* ]]; then
            role="anon"
          else
            role=$(python3 -c "import base64,json,os; s=os.environ.get('SUPABASE_SERVICE_KEY','').split('.'); print(json.loads(base64.urlsafe_b64decode(s[1]+'='*(-len(s[1])%4))).get('role','?') if len(s)>1 else '?')" 2>/dev/null || echo "?")
          fi
          if [ "$role" != "service_role" ]; then
            echo "::error::SUPABASE_SERVICE_KEY decodes to role='$role', not 'service_role' — this is the anon/publishable key, not the service_role secret. Writes will be rejected by RLS (42501). Fix: Supabase dashboard -> Project Settings -> API Keys -> copy the 'service_role' secret into this GitHub secret (not 'anon'/'public')."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Guerrilla scan (sans OddsAPI)
        env:
          GUERRILLA:          "1"
          API_FOOTBALL_KEY:   ${{ secrets.API_FOOTBALL_KEY }}
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2:     ${{ secrets.GROQ_API_KEY_2 }}
          TAVILY_API_KEY:     ${{ secrets.TAVILY_API_KEY }}
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_engine.py
