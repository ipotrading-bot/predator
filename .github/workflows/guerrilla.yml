name: Predator Guerrilla Scan

# Scan sans OddsAPI — Melbet direct feed + Pinnacle via recherche web (Groq/Tavily).
# Couvre MMA, eSports, Table Tennis, Volley, Handball : les sports que le plan
# OddsAPI 500 req/mois ne paie pas. Tourne en continu, plus seulement en secours
# de quota.

on:
  schedule:
    # Toutes les 2h, heures impaires à H+47. Le créneau est choisi pour ne pas
    # entrer en file d'attente derrière un job long du groupe
    # `predator-signals-write` : engine.yml part à H+03, golden_hour.yml à H+25,
    # deep_scan.yml à H+33, et closing_line.yml occupe H+04→H+54 par pas de 10.
    # Heures impaires = pas de collision avec le gros des ticks engine.yml
    # (0/2/4/16/18/22 UTC).
    # 2 runs/jour depuis le 2026-08-22 (était 12) — même arbitrage de budget
    # que engine.yml : guerrilla saute OddsAPI et paie donc TOUJOURS sur les
    # sources gratuites. Deux créneaux : matinée asiatique + soirée européenne.
    - cron: '47 9,21 * * *'
  workflow_dispatch:
  # Toucher ce fichier relance un scan. Régler les budgets ci-dessous sans
  # pouvoir observer le résultat avant 2h rend l'ajustement aveugle : ce
  # déclencheur ferme la boucle. `paths` le limite à ce seul fichier — un
  # commit sur le moteur ne déclenche rien.
  push:
    paths:
      - '.github/workflows/guerrilla.yml'

# Shared with golden_hour.yml/engine.yml/deep_scan.yml/audit.yml — this writes
# to the same signals/ai_learning_ledger rows via run_engine.py's non-atomic
# delete+insert. Was previously missing this group entirely (the one write
# workflow in the repo without it) — a manual trigger overlapping a scheduled
# run could double-write or race a purge against an in-flight settlement.
concurrency:
  group: predator-signals-write
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  guerrilla-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Verify required secrets are present
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          # ── Routeur IA multi-fournisseurs (core/ai_router.py) ──
          # Une clé absente = fournisseur ignoré silencieusement. Sans ces
          # lignes, les secrets n'atteignent jamais le code : le routeur ne
          # verrait que Groq et toute la capacité ajoutée resterait morte.
          OPENROUTER_API_KEY:     ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN:   ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID:  ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OLLAMA_API_KEY:         ${{ secrets.OLLAMA_API_KEY }}
          NVIDIA_NIM_API_KEY:     ${{ secrets.NVIDIA_NIM_API_KEY }}
          COHERE_API_KEY:         ${{ secrets.COHERE_API_KEY }}
          UPSTAGE_API_KEY:        ${{ secrets.UPSTAGE_API_KEY }}
          NEBIUS_API_KEY:         ${{ secrets.NEBIUS_API_KEY }}
          MODELSCOPE_API_KEY:     ${{ secrets.MODELSCOPE_API_KEY }}
          SCALEWAY_API_KEY:       ${{ secrets.SCALEWAY_API_KEY }}
        run: |
          missing=""
          [ -z "$SUPABASE_URL" ]  && missing="$missing SUPABASE_URL"
          [ -z "$SUPABASE_KEY" ]  && missing="$missing SUPABASE_KEY"
          [ -z "$SUPABASE_SERVICE_KEY" ] && missing="$missing SUPABASE_SERVICE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing — job would otherwise exit 0 having scanned/persisted nothing"
            exit 1
          fi
          if [[ "$SUPABASE_SERVICE_KEY" == sb_secret_* ]]; then
            role="service_role"
          elif [[ "$SUPABASE_SERVICE_KEY" == sb_publishable_* ]]; then
            role="anon"
          else
            role=$(python3 -c "import base64,json,os; s=os.environ.get('SUPABASE_SERVICE_KEY','').split('.'); print(json.loads(base64.urlsafe_b64decode(s[1]+'='*(-len(s[1])%4))).get('role','?') if len(s)>1 else '?')" 2>/dev/null || echo "?")
          fi
          if [ "$role" != "service_role" ]; then
            echo "::error::SUPABASE_SERVICE_KEY decodes to role='$role', not 'service_role' — this is the anon/publishable key, not the service_role secret. Writes will be rejected by RLS (42501). Fix: Supabase dashboard -> Project Settings -> API Keys -> copy the 'service_role' secret into this GitHub secret (not 'anon'/'public')."
            exit 1
          fi
          # Incident 2026-08-10 -> 08-20: ten days of '0 matchs, 0 signaux' while the
          # operator believed the fallback sources were configured. Say, in every run
          # summary, which fallback credentials actually reach the engine. Warning
          # only: none of these is mandatory, but a scan with none of them has
          # exactly one source (the OddsAPI pool) and no net underneath it.
          fb=""
          [ -z "$API_FOOTBALL_KEY" ] && fb="$fb API_FOOTBALL_KEY"
          [ -z "$GROQ_API_KEY" ]     && fb="$fb GROQ_API_KEY"
          [ -z "$TAVILY_API_KEY" ]   && fb="$fb TAVILY_API_KEY"
          if [ -n "$fb" ]; then
            echo "::warning::Fallback sources NOT configured (empty secrets):$fb — if the OddsAPI pool is dead this scan has no other source of matches"
          else
            echo "Fallback sources configured: API_FOOTBALL_KEY GROQ_API_KEY TAVILY_API_KEY"
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Guerrilla scan (sans OddsAPI)
        env:
          GUERRILLA:          "1"

          # ── Budget : le mur est le TPM, pas le TPD ─────────────────────
          # Le compte Groq a ~300k tokens/JOUR sur 3 clés, mais chaque clé est
          # plafonnée à 8000 tokens/MINUTE en free tier, et `max_tokens` est
          # RÉSERVÉ sur ce budget-minute, pas facturé à l'usage. Monter
          # SEARCH_MAX_TOKENS à 6000 (run 30765759639) a fait réclamer 75% du
          # quota-minute à chaque appel : 413 sur tennis, basket, MMA et
          # l'oracle, donc bascule Tavily systématique. 2500 laisse la marge
          # que compound-mini consomme en injectant ses résultats de recherche.
          SEARCH_MAX_TOKENS:       "2500"   # défaut 2048 — MMA / Pinnacle (eSports + alt sports retirés le 2026-08-22)
          PINNACLE_BATCH:          "25"     # défaut 25   — au-delà, le prompt pousse au 413

          # Tavily est un service séparé : il ne consomme pas le TPM Groq.
          # C'est le seul poste qu'on peut ouvrir sans risque.
          PINNACLE_TAVILY_QUERIES: "6"      # défaut 4
          TAVILY_RUN_BUDGET:       "40"     # défaut 25

          # MAX_ORACLE reste à 3 : chaque repêchage interroge 3 books, et sur
          # 429-minute le client dort 20-40s par book. À 8, le run a dépassé le
          # timeout global de 540s après 3 matchs — 0 signal écrit.
          MAX_ORACLE:              "3"      # défaut 3

          # Caches : le cron est à 2h, un TTL de 4h faisait tourner un run sur
          # deux sur une carte déjà jouée. 1,5h sur les sports alternatifs
          # raccourcit aussi le TTL d'un résultat VIDE (min(3h, TTL) côté
          # _get_cached) — un slate vide mérite d'être retenté vite.
          CACHE_MMA_TTL_H:     "4"     # défaut 8
          CACHE_ESPORTS_TTL_H: "4"     # défaut 8
          CACHE_ALT_TTL_H:     "1.5"   # défaut 4 — slate ITTF tourne en ~1h
          CACHE_EMPTY_TTL_H:   "1.5"   # défaut 3 — un vide dû à une clé morte
                                       # ne doit pas museler le sport 3h durant

          API_FOOTBALL_KEY:   ${{ secrets.API_FOOTBALL_KEY }}
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2:     ${{ secrets.GROQ_API_KEY_2 }}
          # GROQ_API_KEY_3 volontairement absent : c'est la clé réservée au
          # settlement (audit.yml). Voir le cloisonnement des quotas du
          # 2026-08-02 — les scans, 10x plus nombreux que l'audit, vidaient le
          # TPD avant qu'un seul WIN/LOSS soit écrit. _4 est la clé d'appoint
          # des scans : elle élargit LEUR réserve sans toucher à celle de l'audit.
          GROQ_API_KEY_4:     ${{ secrets.GROQ_API_KEY_4 }}
          TAVILY_API_KEY:     ${{ secrets.TAVILY_API_KEY }}
          # ── Routeur IA multi-fournisseurs (core/ai_router.py) ──
          # Une clé absente = fournisseur ignoré silencieusement. Sans ces
          # lignes, les secrets n'atteignent jamais le code : le routeur ne
          # verrait que Groq et toute la capacité ajoutée resterait morte.
          OPENROUTER_API_KEY:     ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN:   ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID:  ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OLLAMA_API_KEY:         ${{ secrets.OLLAMA_API_KEY }}
          NVIDIA_NIM_API_KEY:     ${{ secrets.NVIDIA_NIM_API_KEY }}
          COHERE_API_KEY:         ${{ secrets.COHERE_API_KEY }}
          UPSTAGE_API_KEY:        ${{ secrets.UPSTAGE_API_KEY }}
          NEBIUS_API_KEY:         ${{ secrets.NEBIUS_API_KEY }}
          MODELSCOPE_API_KEY:     ${{ secrets.MODELSCOPE_API_KEY }}
          SCALEWAY_API_KEY:       ${{ secrets.SCALEWAY_API_KEY }}
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_engine.py
