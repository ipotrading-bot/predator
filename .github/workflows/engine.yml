name: Predator Engine

# QUOTA MODE — active until 2026-06-01
# OddsAPI budget: 500 req/month → max 35 req/day (12 lean keys × 3 scans = 36/day)
# Quota guard in odds_api.py stops scan if remaining < 15.
#
# 10:00 UTC — EU morning  : Copa Libertadores overnight + EU pre-match lines
# 17:00 UTC — EU prime    : Top EU fixtures, NBA/NHL approaching
# 22:00 UTC — US evening  : NBA/NHL tip-off window, SA evening games
#
# RESTORE after OddsAPI upgrade (≥ 30k req/month plan):
#   - cron: '*/30 6-22 * * *'
#   - cron: '0 0-5 * * *'

on:
  schedule:
    - cron: '0 10 * * *'   # EU morning scan    — 10:00 UTC
    - cron: '0 17 * * *'   # EU prime-time scan — 17:00 UTC
    - cron: '0 22 * * *'   # US evening scan    — 22:00 UTC (NBA/NHL tip-off)
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run engine
        env:
          ODDS_API_KEY:       ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          BETFAIR_APP_KEY:    ${{ secrets.BETFAIR_APP_KEY }}
          BETFAIR_USERNAME:   ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD:   ${{ secrets.BETFAIR_PASSWORD }}
        run: python run_engine.py
