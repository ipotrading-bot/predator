name: Predator Engine

# ══════════════════════════════════════════════════════════════════
# BUDGET — voir golden_hour.yml pour le détail : SPORT_KEYS a 19 clés
# réelles (pas 11), donc l'usage réel (~35 857 req/mois) dépasse de ~79%
# le budget de 20 000/mois annoncé ici à l'origine. Décision produit à
# prendre (réduire SPORT_KEYS ou confirmer le palier OddsAPI), pas un
# bug de code — voir le commentaire détaillé dans golden_hour.yml.
# ══════════════════════════════════════════════════════════════════
#
# Cadence : toutes les 2 heures, 12 runs/jour (instruction opérateur du
# 2026-08-06 — l'ancienne grille de 10 sessions « alignées sur les fenêtres
# d'inefficience » laissait trois trous de 3h : 04→07, 13→16 et 18→22, le plus
# long tombant en pleine soirée US).
#
# Coût mesuré le 2026-08-06 via /events (gratuit) sur les 18 sport-keys, en
# fenêtre 24h : 14 crédits par scan. 12 runs/jour = ~168 crédits/jour, plus
# le deep_scan (4/jour) = ~224/jour. Sur un plan 500 req/mois, une clé tient
# donc ~2 jours — cadence de rotation à assumer, conforme à la décision
# opérateur « ne pas rationner » du 2026-08-01.
#
# ATTENTION : GitHub ne garantit pas la ponctualité des crons. Mesuré sur ce
# repo : 0,48 exécution/h pour un cron horaire, médiane 116 min entre deux
# runs. Demander 2h donne donc ~2h en pratique, avec des trous plus longs aux
# heures de charge — ne jamais dimensionner une fenêtre applicative sur la
# cadence DEMANDÉE ici (cf. la fenêtre de capture de closing_line.yml).
on:
  schedule:
    # Minute offset to :03 (not :00) — golden_hour.yml fires every :00 and
    # :30. Both workflows run run_engine.py's _purge_old_signals()/_save()
    # (non-atomic delete+insert) against the same signals rows; landing on
    # the exact same minute maximized the chance of a concurrent overlap.
    # 8 scans/jour depuis le 2026-08-22 (était 12) : quand OddsAPI est mort,
    # chaque scan paie sur les budgets journaliers des sources gratuites
    # (api-sports 80/sport, odds-api.io 400, titan007 500 ≈ 8-14 scans
    # complets). À 12 scans engine + 12 guerrilla + 24 golden hour, tout le
    # budget partait avant 08:30 UTC et la soirée européenne tournait à sec —
    # dernier signal du 2026-08-21 émis à 08:24. Réduire la cadence rend
    # chaque scan complet ; ne pas la remonter sans recalculer le tableau.
    # Placés sur les FENÊTRES FAVORABLES (core/scan_windows.py, Phase 3 du
    # recentrage 2026-08-22) et non plus à intervalle uniforme : la valeur
    # d'un scan payant est là où les books soft traînent derrière le sharp.
    # Toujours 8/jour ; la couverture 24h entre deux ticks est assurée par
    # golden_hour.yml (horaire, fenêtre 2h, espacé hors fenêtre par la
    # politique de dépense) et par le step REPRICE gratuit.
    - cron: '3 2  * * *'   # 02:00 UTC — SA fin de soirée + MLB late + NBA/NHL + cartes MMA (nuit ven-dim)
    - cron: '3 6  * * *'   # 06:00 UTC — KBO/NPB ouverture (lag Asie) + AFL/NRL
    - cron: '3 9  * * *'   # 09:00 UTC — KBO/NPB + Australie
    - cron: '3 12 * * *'   # 12:00 UTC — fond : fin KBO/NPB/AU, midi EU
    - cron: '3 17 * * *'   # 17:00 UTC — Big 5 + LdC/UEL ouverture + Euroleague (jeu/ven)
    - cron: '3 19 * * *'   # 19:00 UTC — Big 5 soirée
    - cron: '3 21 * * *'   # 21:00 UTC — SA + MLB ouverture + Big 5 clôture
    - cron: '3 23 * * *'   # 23:00 UTC — SA/MLB + NBA/NHL tip-off
  workflow_dispatch:

# Shared with golden_hour.yml/deep_scan.yml/audit.yml — the
# minute-offset above only avoids same-minute starts, it doesn't prevent
# overlap once a run takes several minutes. See golden_hour.yml for the
# full rationale.
concurrency:
  group: predator-signals-write
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Verify required secrets are present
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          missing=""
          [ -z "$SUPABASE_URL" ]  && missing="$missing SUPABASE_URL"
          [ -z "$SUPABASE_KEY" ]  && missing="$missing SUPABASE_KEY"
          [ -z "$SUPABASE_SERVICE_KEY" ] && missing="$missing SUPABASE_SERVICE_KEY"
          [ -z "$ODDS_API_KEY" ]  && missing="$missing ODDS_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing — job would otherwise exit 0 having scanned/persisted nothing"
            exit 1
          fi
          # 2026-07-07 incident: SUPABASE_SERVICE_KEY was present but held the
          # anon/publishable key, not the service_role secret — it authenticates
          # fine (no 401) then fails every single write with RLS 42501, silently,
          # for as long as nobody notices the "0/N persisted" log line. Decode
          # the JWT locally (no network call) and fail loud right here instead.
          # Handles both the legacy JWT format (role claim in the payload)
          # and Supabase's newer sb_secret_.../sb_publishable_... keys
          # (role is the prefix, not a JWT at all — decoding one as base64
          # silently returns role='?', which is what happened here).
          if [[ "$SUPABASE_SERVICE_KEY" == sb_secret_* ]]; then
            role="service_role"
          elif [[ "$SUPABASE_SERVICE_KEY" == sb_publishable_* ]]; then
            role="anon"
          else
            role=$(python3 -c "import base64,json,os; s=os.environ.get('SUPABASE_SERVICE_KEY','').split('.'); print(json.loads(base64.urlsafe_b64decode(s[1]+'='*(-len(s[1])%4))).get('role','?') if len(s)>1 else '?')" 2>/dev/null || echo "?")
          fi
          if [ "$role" != "service_role" ]; then
            echo "::error::SUPABASE_SERVICE_KEY decodes to role='$role', not 'service_role' — this is the anon/publishable key, not the service_role secret. Writes will be rejected by RLS (42501). Fix: Supabase dashboard -> Project Settings -> API Keys -> copy the 'service_role' secret into this GitHub secret (not 'anon'/'public')."
            exit 1
          fi
          # Incident 2026-08-10 -> 08-20: ten days of '0 matchs, 0 signaux' while the
          # operator believed the fallback sources were configured. Say, in every run
          # summary, which fallback credentials actually reach the engine. Warning
          # only: none of these is mandatory, but a scan with none of them has
          # exactly one source (the OddsAPI pool) and no net underneath it.
          fb=""
          [ -z "$API_FOOTBALL_KEY" ] && fb="$fb API_FOOTBALL_KEY"
          [ -z "$GROQ_API_KEY" ]     && fb="$fb GROQ_API_KEY"
          [ -z "$TAVILY_API_KEY" ]   && fb="$fb TAVILY_API_KEY"
          if [ -n "$fb" ]; then
            echo "::warning::Fallback sources NOT configured (empty secrets):$fb — if the OddsAPI pool is dead this scan has no other source of matches"
          else
            echo "Fallback sources configured: API_FOOTBALL_KEY GROQ_API_KEY TAVILY_API_KEY"
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run engine
        env:
          ODDS_API_KEY:       ${{ secrets.ODDS_API_KEY }}
          API_FOOTBALL_KEY:   ${{ secrets.API_FOOTBALL_KEY }}
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2:     ${{ secrets.GROQ_API_KEY_2 }}
          # GROQ_API_KEY_3 volontairement absent : c'est la clé réservée au
          # settlement (audit.yml). Voir le cloisonnement des quotas du
          # 2026-08-02 — les scans, 10x plus nombreux que l'audit, vidaient le
          # TPD avant qu'un seul WIN/LOSS soit écrit. _4 est la clé d'appoint
          # des scans : elle élargit LEUR réserve sans toucher à celle de l'audit.
          GROQ_API_KEY_4:     ${{ secrets.GROQ_API_KEY_4 }}
          TAVILY_API_KEY:     ${{ secrets.TAVILY_API_KEY }}
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          BETFAIR_APP_KEY:    ${{ secrets.BETFAIR_APP_KEY }}
          BETFAIR_USERNAME:   ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD:   ${{ secrets.BETFAIR_PASSWORD }}
          BETFAIR_CERT:       ${{ secrets.BETFAIR_CERT }}
          BETFAIR_CERT_KEY:   ${{ secrets.BETFAIR_CERT_KEY }}
        run: python run_engine.py
