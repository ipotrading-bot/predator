name: Predator Engine

# All cron times are UTC/GMT — GitHub Actions runs on UTC.
#
# EU MARKET WINDOW  06:00–21:30 UTC — every 30 min
#   └ 06:00 UTC = European bookmaker lines refresh (max inefficiency)
#   └ 06:00–11:59 UTC = EU-OPEN  : fresh pre-match lines
#   └ 12:00–17:59 UTC = EU-MID   : afternoon fixtures
#   └ 18:00–21:30 UTC = EU-CLOSE : prime-time kickoffs
#
# NBA OVERNIGHT     00:00–05:00 UTC — hourly
#   └ Covers US evening slate (EST-5h = UTC): tip-offs 17:00–02:00 ET

on:
  schedule:
    - cron: '*/30 6-22 * * *'   # EU market window — every 30 min, 06:00–22:30 UTC (WC 18h ET = 22h UTC)
    - cron: '0 0-5 * * *'       # NBA overnight window — hourly, 00:00–05:00 UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run engine
        env:
          ODDS_API_KEY:       ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          BETFAIR_APP_KEY:    ${{ secrets.BETFAIR_APP_KEY }}
          BETFAIR_USERNAME:   ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD:   ${{ secrets.BETFAIR_PASSWORD }}
        run: python run_engine.py
