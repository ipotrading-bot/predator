name: Predator Engine

# ══════════════════════════════════════════════════════════════════
# BUDGET — voir golden_hour.yml pour le détail : SPORT_KEYS a 19 clés
# réelles (pas 11), donc l'usage réel (~35 857 req/mois) dépasse de ~79%
# le budget de 20 000/mois annoncé ici à l'origine. Décision produit à
# prendre (réduire SPORT_KEYS ou confirmer le palier OddsAPI), pas un
# bug de code — voir le commentaire détaillé dans golden_hour.yml.
# ══════════════════════════════════════════════════════════════════
#
# Sessions alignées sur les fenêtres d'inefficience marché :
#   00:00 — Minuit UTC : NBA/NHL tip-off + MLB late
#   02:00 — Nuit US late / Copa late / KBO pré-ouverture
#   04:00 — Pré-KBO/NPB matin Asie (06:00–13:00 UTC = fenêtre lag max)
#   07:00 — EU morning : Asia closing + lignes EU fraîches + AFL morning
#   09:00 — EU mid-morning : KBO/NPB live + NRL/AFL pré-match
#   11:00 — EU midday : SA opening + MLB preview + Brasileirão
#   13:00 — EU afternoon : Copa Lib pré-match + MLS opening
#   16:00 — EU prime-time : WC/Copa soirée pré-match (mouvement max)
#   18:00 — EU close : NBA/NHL pre-game T-4h + Copa in-play
#   22:00 — US evening : NBA/NHL tip-off live + MLB final + Copa nuit
# ══════════════════════════════════════════════════════════════════

on:
  schedule:
    # Minute offset to :03 (not :00) — golden_hour.yml fires every :00 and
    # :30. Both workflows run run_engine.py's _purge_old_signals()/_save()
    # (non-atomic delete+insert) against the same signals rows; landing on
    # the exact same minute maximized the chance of a concurrent overlap.
    - cron: '3 0  * * *'   # Minuit UTC : NBA/NHL tip-off + MLB late    — 00:00 UTC
    - cron: '3 2  * * *'   # Nuit US late / KBO pré-ouverture           — 02:00 UTC
    - cron: '3 4  * * *'   # Pré-KBO/NPB matin Asie (lag max)          — 04:00 UTC
    - cron: '3 7  * * *'   # EU morning : Asia closing + AFL            — 07:00 UTC
    - cron: '3 9  * * *'   # EU mid-morning : KBO/NPB live + NRL        — 09:00 UTC
    - cron: '3 11 * * *'   # EU midday : SA + MLB preview               — 11:00 UTC
    - cron: '3 13 * * *'   # EU afternoon : Copa Lib + MLS              — 13:00 UTC
    - cron: '3 16 * * *'   # EU prime-time : WC/Copa pré-match          — 16:00 UTC
    - cron: '3 18 * * *'   # EU close : NBA/NHL pre-game T-4h           — 18:00 UTC
    - cron: '3 22 * * *'   # US evening : NBA/NHL tip-off + Copa nuit   — 22:00 UTC
  workflow_dispatch:

# Shared with golden_hour.yml/deep_scan.yml/audit.yml/on_demand.yml — the
# minute-offset above only avoids same-minute starts, it doesn't prevent
# overlap once a run takes several minutes. See golden_hour.yml for the
# full rationale.
concurrency:
  group: predator-signals-write
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run engine
        env:
          ODDS_API_KEY:       ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          BETFAIR_APP_KEY:    ${{ secrets.BETFAIR_APP_KEY }}
          BETFAIR_USERNAME:   ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD:   ${{ secrets.BETFAIR_PASSWORD }}
        run: python run_engine.py
