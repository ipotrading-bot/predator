name: Predator Engine

# Budget 20 000 req/mois — 8 sport_keys actifs juin 2026
# 8 keys × 6 scans/day = 48 req/day Engine (1 440/mois)
# Quota guard dans odds_api.py stoppe si remaining < 50.
#
# 08:00 UTC — EU morning early : Copa Lib overnight + pré-match EU
# 11:00 UTC — EU midday        : Lignes SA ouvertes + NBA/NHL preview
# 14:00 UTC — EU afternoon     : Brasileirão + Argentine en journée
# 17:00 UTC — EU prime         : NBA/NHL approchant
# 20:00 UTC — NBA/NHL pre-game : T-3h avant tip-off (mouvement max)
# 23:00 UTC — US evening       : Copa + NBA/NHL en cours (inplay edges)

on:
  schedule:
    - cron: '0 8  * * *'   # EU morning early   — 08:00 UTC
    - cron: '0 11 * * *'   # EU midday          — 11:00 UTC
    - cron: '0 14 * * *'   # EU afternoon       — 14:00 UTC
    - cron: '0 17 * * *'   # EU prime-time      — 17:00 UTC
    - cron: '0 20 * * *'   # NBA/NHL pre-game   — 20:00 UTC
    - cron: '0 23 * * *'   # US evening         — 23:00 UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run engine
        env:
          ODDS_API_KEY:       ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          BETFAIR_APP_KEY:    ${{ secrets.BETFAIR_APP_KEY }}
          BETFAIR_USERNAME:   ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD:   ${{ secrets.BETFAIR_PASSWORD }}
        run: python run_engine.py
