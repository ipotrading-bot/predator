name: Predator Engine

# ══════════════════════════════════════════════════════════════════
# BUDGET 20 000 req/mois — Optimisation mathématique (30 sport keys)
#
#   Solution : G=48/j (I=30min) | E=8/j | D=3/j
#   Ce fichier : E = 8 scans/jour × 30 keys = 240 req/j → 7 200/mois
#
# Sessions alignées sur les fenêtres d'inefficience marché :
#   01:00 — Nuit US late / Copa late
#   04:00 — Pré-KBO/NPB matin Asie
#   07:00 — EU morning : Asia closing + lignes EU fraîches
#   10:00 — EU midday  : SA opening + MLB preview
#   13:00 — EU afternoon : Brasileirão + Argentine journée
#   16:00 — EU prime-time : Copa/WC pré-match
#   19:00 — NBA/NHL pre-game : T-3h avant tip-off (mouvement max)
#   22:00 — US evening : Copa + NBA/NHL en cours
# ══════════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: '0 1  * * *'   # Nuit US / Copa late       — 01:00 UTC
    - cron: '0 4  * * *'   # Pré-KBO/NPB Asie          — 04:00 UTC
    - cron: '0 7  * * *'   # EU morning                — 07:00 UTC
    - cron: '0 10 * * *'   # EU midday                 — 10:00 UTC
    - cron: '0 13 * * *'   # EU afternoon / Brasileirão — 13:00 UTC
    - cron: '0 16 * * *'   # EU prime-time             — 16:00 UTC
    - cron: '0 19 * * *'   # NBA/NHL pre-game T-3h     — 19:00 UTC
    - cron: '0 22 * * *'   # US evening                — 22:00 UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run engine
        env:
          ODDS_API_KEY:       ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          BETFAIR_APP_KEY:    ${{ secrets.BETFAIR_APP_KEY }}
          BETFAIR_USERNAME:   ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD:   ${{ secrets.BETFAIR_PASSWORD }}
        run: python run_engine.py
