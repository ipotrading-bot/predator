name: Predator Deep Scan 48h

# Deep scan — horizon 48h, couverture complète 19 sports + tous marchés
# vs engine.yml : MAX_MATCHES 50→100 | SPORT_QUOTA large (soccer=16, baseball=12)
#
# 05:55 UTC — avant EU-OPEN : KBO/NPB nuit + WC/Copa pré-journée (slate complet)
# 18:30 UTC — prime-time    : WC + Copa soirée + NBA/NHL pré-match + MLB

on:
  schedule:
    - cron: '55 5  * * *'   # 05:55 UTC — avant EU-OPEN (KBO/NPB nuit)
    - cron: '30 18 * * *'   # 18:30 UTC — prime-time WC/Copa/NBA pré-match
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deep-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25      # Longer timeout — more events, more API calls

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run deep scan (48h / all sports / all markets)
        env:
          ODDS_API_KEY:       ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          BETFAIR_APP_KEY:    ${{ secrets.BETFAIR_APP_KEY }}
          BETFAIR_USERNAME:   ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD:   ${{ secrets.BETFAIR_PASSWORD }}
          DEEP_SCAN:          "1"
        run: python run_engine.py
