name: Predator Deep Scan 48h

# ══════════════════════════════════════════════════════════════════
# BUDGET — voir golden_hour.yml pour le détail : SPORT_KEYS a 19 clés
# réelles (pas 11), donc ce fichier consomme ~76 req/j → ~2 313/mois,
# pas 44/1 320. Le total réel du repo dépasse de ~79% le budget de
# 20 000/mois annoncé ici à l'origine.
#
# Deep scan — horizon 48h, MAX_MATCHES=100, tous marchés (h2h+spreads+totals)
# Décalé de 30 min par rapport à Engine pour éviter les doublons en DB.
#
#   05:30 UTC — avant EU-OPEN  : KBO/NPB nuit + WC/Copa pré-journée
#   11:30 UTC — EU-MID early   : SA opening + MLB preview
#   17:30 UTC — EU-CLOSE       : Copa soirée + NBA/NHL T-5h
#   23:30 UTC — Overnight      : NBA/NHL tip-off + MLB final + Copa nuit
# ══════════════════════════════════════════════════════════════════

on:
  schedule:
    # Minute offset to :33 (not :30) — golden_hour.yml fires every :00 and
    # :30, so :30 landed on the exact same minute as a golden_hour run.
    # Still 30min clear of engine.yml (now :03) to avoid DB duplicates.
    - cron: '33 5  * * *'   # 05:30 UTC — KBO/NPB nuit + WC/Copa pré-journée
    - cron: '33 11 * * *'   # 11:30 UTC — SA opening + MLB preview
    - cron: '33 17 * * *'   # 17:30 UTC — Copa soirée + NBA/NHL T-5h
    - cron: '33 23 * * *'   # 23:30 UTC — NBA/NHL live + MLB final + Copa nuit
  workflow_dispatch:

# Shared with golden_hour.yml/engine.yml/audit.yml/on_demand.yml — the
# minute-offset above only avoids same-minute starts, it doesn't prevent
# overlap once a run takes several minutes (this job's timeout is 25min).
# See golden_hour.yml for the full rationale.
concurrency:
  group: predator-signals-write
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deep-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Verify required secrets are present
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          missing=""
          [ -z "$SUPABASE_URL" ]  && missing="$missing SUPABASE_URL"
          [ -z "$SUPABASE_KEY" ]  && missing="$missing SUPABASE_KEY"
          [ -z "$ODDS_API_KEY" ]  && missing="$missing ODDS_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing — job would otherwise exit 0 having scanned/persisted nothing"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run deep scan (48h / all sports / all markets)
        env:
          ODDS_API_KEY:       ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          BETFAIR_APP_KEY:    ${{ secrets.BETFAIR_APP_KEY }}
          BETFAIR_USERNAME:   ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD:   ${{ secrets.BETFAIR_PASSWORD }}
          DEEP_SCAN:          "1"
        run: python run_engine.py
