name: Predator Deep Scan 48h

# ══════════════════════════════════════════════════════════════════
# BUDGET 20 000 req/mois — Optimisation mathématique (30 sport keys)
#
#   Solution : G=48/j (I=30min) | E=8/j | D=3/j
#   Ce fichier : D = 3 scans/jour × 30 keys = 90 req/j → 2 700/mois
#
# Deep scan — horizon 48h, couverture complète 30 sports + tous marchés
# vs engine.yml : MAX_MATCHES 50→100 | SPORT_QUOTA large
#
#   05:30 UTC — avant EU-OPEN  : KBO/NPB nuit + WC/Copa pré-journée
#   12:30 UTC — EU-MID         : SA afternoon + MLB opening
#   19:30 UTC — EU-CLOSE       : WC/Copa soirée + NBA/NHL pré-match
# ══════════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: '30 5  * * *'   # 05:30 UTC — avant EU-OPEN (KBO/NPB nuit)
    - cron: '30 12 * * *'   # 12:30 UTC — EU-MID (SA afternoon + MLB)
    - cron: '30 19 * * *'   # 19:30 UTC — prime-time WC/Copa/NBA/NHL
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deep-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run deep scan (48h / all sports / all markets)
        env:
          ODDS_API_KEY:       ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          BETFAIR_APP_KEY:    ${{ secrets.BETFAIR_APP_KEY }}
          BETFAIR_USERNAME:   ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD:   ${{ secrets.BETFAIR_PASSWORD }}
          DEEP_SCAN:          "1"
        run: python run_engine.py
