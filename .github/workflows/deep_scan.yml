name: Predator Deep Scan 24h

# ══════════════════════════════════════════════════════════════════
# BUDGET — voir golden_hour.yml pour le détail : SPORT_KEYS a 19 clés
# réelles (pas 11), donc ce fichier consomme ~76 req/j → ~2 313/mois,
# pas 44/1 320. Le total réel du repo dépasse de ~79% le budget de
# 20 000/mois annoncé ici à l'origine.
#
# Deep scan — horizon 24h, MAX_MATCHES=100, tous marchés (h2h+spreads+totals)
# Décalé de 30 min par rapport à Engine pour éviter les doublons en DB.
#
# HORIZON 24h, ET NON 48h (instruction opérateur 2026-08-06). Le nom de ce
# workflow annonçait 48h alors qu'il en faisait déjà 24 sans le dire : le bloc
# `hours_ahead` de run_engine.py n'a pas de branche `elif DEEP_SCAN`, donc
# DEEP_SCAN=1 tombait dans le cas général, passé à 24h par le commit 1552f1d.
# HOURS_AHEAD est désormais posé explicitement plus bas — ce qui reste « deep »
# ici, c'est MAX_MATCHES=100 (vs 50) et les quotas par sport élargis, pas
# l'horizon. Le ledger justifie ce 24h : au-delà, ROI -62,8% (p=0,0023).
#
#   05:30 UTC — avant EU-OPEN  : KBO/NPB nuit + Copa pré-journée
#   11:30 UTC — EU-MID early   : SA opening + MLB preview
#   17:30 UTC — EU-CLOSE       : Copa soirée + NBA/NHL T-5h
#   23:30 UTC — Overnight      : NBA/NHL tip-off + MLB final + Copa nuit
# ══════════════════════════════════════════════════════════════════

on:
  schedule:
    # Minute offset to :33 (not :30) — golden_hour.yml fires every :00 and
    # :30, so :30 landed on the exact same minute as a golden_hour run.
    # Still 30min clear of engine.yml (now :03) to avoid DB duplicates.
    - cron: '33 5  * * *'   # 05:30 UTC — KBO/NPB nuit + WC/Copa pré-journée
    - cron: '33 11 * * *'   # 11:30 UTC — SA opening + MLB preview
    - cron: '33 17 * * *'   # 17:30 UTC — Copa soirée + NBA/NHL T-5h
    - cron: '33 23 * * *'   # 23:30 UTC — NBA/NHL live + MLB final + Copa nuit
  workflow_dispatch:

# Shared with golden_hour.yml/engine.yml/audit.yml — the
# minute-offset above only avoids same-minute starts, it doesn't prevent
# overlap once a run takes several minutes (this job's timeout is 25min).
# See golden_hour.yml for the full rationale.
concurrency:
  group: predator-signals-write
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deep-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Verify required secrets are present
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          missing=""
          [ -z "$SUPABASE_URL" ]  && missing="$missing SUPABASE_URL"
          [ -z "$SUPABASE_KEY" ]  && missing="$missing SUPABASE_KEY"
          [ -z "$SUPABASE_SERVICE_KEY" ] && missing="$missing SUPABASE_SERVICE_KEY"
          [ -z "$ODDS_API_KEY" ]  && missing="$missing ODDS_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing — job would otherwise exit 0 having scanned/persisted nothing"
            exit 1
          fi
          # 2026-07-07 incident: SUPABASE_SERVICE_KEY was present but held the
          # anon/publishable key, not the service_role secret — it authenticates
          # fine (no 401) then fails every single write with RLS 42501, silently,
          # for as long as nobody notices the "0/N persisted" log line. Decode
          # the JWT locally (no network call) and fail loud right here instead.
          # Handles both the legacy JWT format (role claim in the payload)
          # and Supabase's newer sb_secret_.../sb_publishable_... keys
          # (role is the prefix, not a JWT at all — decoding one as base64
          # silently returns role='?', which is what happened here).
          if [[ "$SUPABASE_SERVICE_KEY" == sb_secret_* ]]; then
            role="service_role"
          elif [[ "$SUPABASE_SERVICE_KEY" == sb_publishable_* ]]; then
            role="anon"
          else
            role=$(python3 -c "import base64,json,os; s=os.environ.get('SUPABASE_SERVICE_KEY','').split('.'); print(json.loads(base64.urlsafe_b64decode(s[1]+'='*(-len(s[1])%4))).get('role','?') if len(s)>1 else '?')" 2>/dev/null || echo "?")
          fi
          if [ "$role" != "service_role" ]; then
            echo "::error::SUPABASE_SERVICE_KEY decodes to role='$role', not 'service_role' — this is the anon/publishable key, not the service_role secret. Writes will be rejected by RLS (42501). Fix: Supabase dashboard -> Project Settings -> API Keys -> copy the 'service_role' secret into this GitHub secret (not 'anon'/'public')."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run deep scan (48h / all sports / all markets)
        env:
          ODDS_API_KEY:       ${{ secrets.ODDS_API_KEY }}
          API_FOOTBALL_KEY:   ${{ secrets.API_FOOTBALL_KEY }}
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2:     ${{ secrets.GROQ_API_KEY_2 }}
          # GROQ_API_KEY_3 volontairement absent : c'est la clé réservée au
          # settlement (audit.yml). Voir le cloisonnement des quotas du
          # 2026-08-02 — les scans, 10x plus nombreux que l'audit, vidaient le
          # TPD avant qu'un seul WIN/LOSS soit écrit. _4 est la clé d'appoint
          # des scans : elle élargit LEUR réserve sans toucher à celle de l'audit.
          GROQ_API_KEY_4:     ${{ secrets.GROQ_API_KEY_4 }}
          TAVILY_API_KEY:     ${{ secrets.TAVILY_API_KEY }}
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          BETFAIR_APP_KEY:    ${{ secrets.BETFAIR_APP_KEY }}
          BETFAIR_USERNAME:   ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD:   ${{ secrets.BETFAIR_PASSWORD }}
          BETFAIR_CERT:       ${{ secrets.BETFAIR_CERT }}
          BETFAIR_CERT_KEY:   ${{ secrets.BETFAIR_CERT_KEY }}
          DEEP_SCAN:          "1"
          # Explicite : run_engine.py lit HOURS_AHEAD avec un défaut de 24, mais
          # ce workflow s'appelait « 48h » — le rendre visible ici évite que le
          # prochain lecteur croie encore à un horizon différent d'engine.yml.
          HOURS_AHEAD:        "24"
        run: python run_engine.py
